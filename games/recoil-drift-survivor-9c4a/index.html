<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Recoil Drift Survivor</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 20% 20%, #142138 0%, #0a1628 45%, #08111f 100%);
      height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif; touch-action: none;
    }
    #ui-overlay {
      position: fixed; inset: 0; display: none; z-index: 30;
      background: rgba(4, 10, 20, 0.84); align-items: center; justify-content: center;
    }
    #panel {
      width: min(90vw, 460px); background: rgba(10, 26, 46, 0.96);
      border: 2px solid #48cae4; border-radius: 16px; padding: 22px;
      color: #d9f6ff; box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
    h2 { color: #90e0ef; margin-bottom: 8px; font-size: 1.5rem; }
    #final-score { font-size: 1.2rem; margin-bottom: 12px; color: #ffd166; }
    input, button {
      width: 100%; border-radius: 10px; border: 1px solid #57b3d2; margin-top: 10px;
      padding: 11px 12px; font-family: inherit;
    }
    input { background: #0a1d32; color: #e8f9ff; }
    button { background: #118ab2; color: white; cursor: pointer; font-weight: 700; }
    button:hover { filter: brightness(1.1); }
    #leaderboard { margin-top: 12px; max-height: 180px; overflow-y: auto; font-size: 0.95rem; line-height: 1.45; }
    .hint { margin-top: 10px; color: #9edff0; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div id="panel">
      <h2>Run Over</h2>
      <div id="final-score">Score: 0</div>
      <input id="player-name" maxlength="16" placeholder="Pilot name" />
      <button id="submit-score">Submit Score</button>
      <button id="play-again">Play Again</button>
      <div id="leaderboard">Top pilots loading...</div>
      <div class="hint">Tip: You only move from recoil. Shoot opposite where you want to drift.</div>
    </div>
  </div>

<script src='../../shared/supabase-config.js'></script><script src='../../shared/supabase-client.js'></script><script>
const GAME_ID = 'recoil-drift-survivor-9c4a';
const LEADERBOARD_API = window.GAME_HUB_API_BASE;

/*
DESIGN HEADER
- Controls: Mouse/touch aim + hold to fire; keyboard aim with WASD/arrow keys and fire with Space.
- Core loop/death: Survive in open water-like space while drifting only from recoil; die on enemy collision.
- Hazards: (1) Mines that drift inward, (2) Hunters that chase and accelerate, (3) Pulse rings that sweep across arena.
- Pickups/risk-reward: (1) Ammo core grants burst ammo bonus, (2) Overcharge boosts recoil/shot speed but increases spawn pressure for 8s.
- Scoring: score = Math.floor(timeAlive * 10 + bonusPoints), monotonic.
- Difficulty: smooth ease ramp over 120s scaling spawn rates, enemy speed, pulse frequency.
- Visual/audio: Ocean/cool palette + Orbitron, bubbling particles/parallax, synthy sonar-like procedural SFX.
*/

async function submitScore(playerName, score) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gameId: GAME_ID, playerName, score })
    });
    return await res.json();
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return null;
  }
}

async function getLeaderboard(limit = 10) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);
    const data = await res.json();
    return data.scores || [];
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return [];
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(type, freq, duration, vol = 0.2, slide = 1) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
}
const sfxStart = () => { beep('triangle', 330, 0.08, 0.18, 1.4); beep('triangle', 460, 0.12, 0.12, 1.2); };
const sfxShoot = () => beep('square', 220, 0.06, 0.12, 1.7);
const sfxPickup = () => { beep('sine', 660, 0.08, 0.2, 1.2); beep('sine', 980, 0.09, 0.12, 1.1); };
const sfxHit = () => beep('sawtooth', 120, 0.18, 0.24, 0.65);
const sfxDeath = () => { beep('sawtooth', 290, 0.42, 0.28, 0.3); beep('triangle', 120, 0.55, 0.2, 0.55); };

function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function lerp(a, b, t) { return a + (b - a) * t; }

let gameRef = null;

class MenuScene extends Phaser.Scene {
  constructor() { super('MenuScene'); }
  create() {
    const { width, height } = this.scale;
    this.add.rectangle(width/2, height/2, width, height, 0x0a1628, 0.65);
    const title = this.add.text(width/2, height*0.28, 'RECOIL DRIFT SURVIVOR', {
      fontFamily: 'Orbitron, sans-serif', fontSize: '42px', color: '#90e0ef', stroke: '#001b2e', strokeThickness: 5
    }).setOrigin(0.5);
    this.tweens.add({ targets: title, y: title.y + 8, duration: 1200, yoyo: true, repeat: -1, ease: 'Sine.InOut' });

    this.add.text(width/2, height*0.50,
      'You cannot thrust.\nMove only by firing recoil.\n\nMouse/Touch: aim + hold fire\nWASD/Arrows aim, Space fire',
      { fontFamily: 'Orbitron, sans-serif', align: 'center', fontSize: '20px', color: '#caf0f8', lineSpacing: 8 }
    ).setOrigin(0.5);

    const start = this.add.text(width/2, height*0.78, 'TAP OR PRESS ANY KEY TO DIVE', {
      fontFamily: 'Orbitron, sans-serif', fontSize: '18px', color: '#ffd166'
    }).setOrigin(0.5);
    this.tweens.add({ targets: start, alpha: 0.25, duration: 700, yoyo: true, repeat: -1 });

    const boot = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      sfxStart();
      this.scene.start('GameScene');
    };
    this.input.once('pointerdown', boot);
    this.input.keyboard.once('keydown', boot);
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    this.dead = false;
    this.bonusPoints = 0;
    this.gameStartTime = this.time.now;
    this.overchargeUntil = 0;
    this.lastShot = 0;
    this.lastPulse = 0;
    this.touchFire = false;
    this.pointerAim = new Phaser.Math.Vector2(1, 0);

    const { width, height } = this.scale;
    this.bounds = new Phaser.Geom.Rectangle(18, 18, width - 36, height - 36);

    this.bgStars = this.add.tileSprite(width/2, height/2, width, height, this.makeStarTexture());

    this.makeTextures();

    this.player = this.physics.add.image(width/2, height/2, 'player').setDepth(3);
    this.player.setCircle(18, 14, 14);
    this.player.setDamping(true).setDrag(0.08).setMaxVelocity(340, 340);

    this.bullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, runChildUpdate: false });
    this.mines = this.physics.add.group();
    this.hunters = this.physics.add.group();
    this.cores = this.physics.add.group();

    this.scoreText = this.add.text(16, 12, 'Score: 0', { fontFamily: 'Orbitron', fontSize: '26px', color: '#e0fbfc' }).setDepth(20);
    this.infoText = this.add.text(16, 46, 'Overcharge: ready', { fontFamily: 'Orbitron', fontSize: '16px', color: '#90e0ef' }).setDepth(20);

    this.keys = this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,SPACE');

    this.input.on('pointerdown', (p) => { this.touchFire = true; this.setPointerAim(p); });
    this.input.on('pointermove', (p) => this.setPointerAim(p));
    this.input.on('pointerup', () => { this.touchFire = false; });

    this.physics.add.overlap(this.bullets, this.mines, (b, m) => this.hitMine(b, m));
    this.physics.add.overlap(this.bullets, this.hunters, (b, h) => this.hitHunter(b, h));
    this.physics.add.overlap(this.player, this.mines, () => this.gameOver());
    this.physics.add.overlap(this.player, this.hunters, () => this.gameOver());
    this.physics.add.overlap(this.player, this.cores, (_, c) => this.collectCore(c));

    this.matter = this.add.particles(0,0,'dot', { x: { min: 0, max: width }, y: { min: 0, max: height },
      lifespan: 2600, speedY: { min: -8, max: -18 }, scale: { start: 0.8, end: 0 }, quantity: 1, frequency: 220,
      tint: [0x48cae4, 0x90e0ef], alpha: { start: 0.25, end: 0 } });
  }

  makeStarTexture() {
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0x0f2742, 1); g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 300; i++) {
      g.fillStyle(Phaser.Display.Color.GetColor(100 + Math.random()*90, 180 + Math.random()*60, 220 + Math.random()*35), 0.45 + Math.random()*0.4);
      g.fillCircle(Math.random()*512, Math.random()*512, Math.random()*1.8 + 0.4);
    }
    g.generateTexture('starfield', 512, 512); g.destroy();
    return 'starfield';
  }

  makeTextures() {
    let g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0x0096c7, 1); g.fillCircle(32, 32, 26);
    g.lineStyle(4, 0x90e0ef, 1); g.strokeCircle(32, 32, 26);
    g.fillStyle(0xffffff, 0.35); g.fillCircle(40, 24, 8);
    g.fillStyle(0x023047, 1); g.fillTriangle(32, 8, 24, 30, 40, 30);
    g.generateTexture('player', 64, 64); g.destroy();

    g = this.make.graphics({ x:0, y:0, add:false });
    g.fillStyle(0xffb703, 1); g.fillTriangle(8, 3, 8, 13, 16, 8);
    g.fillStyle(0xffe08a, 0.8); g.fillCircle(5, 8, 2);
    g.generateTexture('bullet', 16, 16); g.destroy();

    g = this.make.graphics({ x:0, y:0, add:false });
    g.fillStyle(0x8d99ae, 1); g.fillCircle(24,24,18); g.fillStyle(0x2b2d42,1); g.fillCircle(24,24,7);
    for (let i=0;i<8;i++){ const a=i*Math.PI/4; g.fillStyle(0xef233c,1); g.fillCircle(24+Math.cos(a)*14,24+Math.sin(a)*14,3); }
    g.generateTexture('mine', 48,48); g.destroy();

    g = this.make.graphics({ x:0, y:0, add:false });
    g.fillStyle(0x5e60ce,1); g.fillEllipse(26,24,40,28); g.lineStyle(4,0xb8c0ff,1); g.strokeEllipse(26,24,40,28);
    g.fillStyle(0xffffff,0.4); g.fillCircle(34,17,5); g.fillStyle(0x1f2a44,1); g.fillCircle(18,24,6);
    g.generateTexture('hunter', 52,48); g.destroy();

    g = this.make.graphics({ x:0, y:0, add:false });
    g.fillStyle(0x06d6a0,1); g.fillCircle(20,20,16); g.lineStyle(5,0x89f0d0,1); g.strokeCircle(20,20,16);
    g.fillStyle(0x023047,1); g.fillRect(16,9,8,22); g.fillRect(9,16,22,8);
    g.generateTexture('core', 40,40); g.destroy();

    g = this.make.graphics({ x:0, y:0, add:false });
    g.fillStyle(0xffffff,1); g.fillCircle(3,3,3); g.generateTexture('dot', 6, 6); g.destroy();
  }

  setPointerAim(pointer) {
    this.pointerAim.set(pointer.worldX - this.player.x, pointer.worldY - this.player.y).normalize();
  }

  keyboardAim() {
    const x = (this.keys.D.isDown || this.keys.RIGHT.isDown ? 1 : 0) - (this.keys.A.isDown || this.keys.LEFT.isDown ? 1 : 0);
    const y = (this.keys.S.isDown || this.keys.DOWN.isDown ? 1 : 0) - (this.keys.W.isDown || this.keys.UP.isDown ? 1 : 0);
    return new Phaser.Math.Vector2(x, y);
  }

  fire(aim, boosted = false) {
    if (!aim || aim.lengthSq() < 0.01) return;
    const dir = aim.clone().normalize();
    const b = this.bullets.create(this.player.x + dir.x * 22, this.player.y + dir.y * 22, 'bullet');
    if (!b) return;
    const speed = boosted ? 620 : 540;
    b.setVelocity(dir.x * speed, dir.y * speed).setRotation(dir.angle());
    b.setCircle(5, 3, 3);
    this.time.delayedCall(1200, () => b?.destroy());

    const recoil = boosted ? 92 : 72;
    this.player.body.velocity.x -= dir.x * recoil;
    this.player.body.velocity.y -= dir.y * recoil;
    sfxShoot();
  }

  spawnMine(difficulty) {
    const p = this.edgePoint();
    const m = this.mines.create(p.x, p.y, 'mine');
    m.setCircle(14, 10, 10);
    const toCenter = new Phaser.Math.Vector2(this.scale.width/2 - p.x, this.scale.height/2 - p.y).normalize();
    const speed = lerp(30, 115, difficulty);
    m.setVelocity(toCenter.x * speed + Phaser.Math.Between(-20, 20), toCenter.y * speed + Phaser.Math.Between(-20, 20));
    m.setAngularVelocity(Phaser.Math.Between(-80, 80));
  }

  spawnHunter(difficulty) {
    const p = this.edgePoint();
    const h = this.hunters.create(p.x, p.y, 'hunter');
    h.setCircle(12, 14, 12);
    h.maxSpeed = lerp(60, 210, difficulty);
  }

  spawnCore(difficulty) {
    const margin = 45;
    const x = Phaser.Math.Between(margin, this.scale.width - margin);
    const y = Phaser.Math.Between(margin, this.scale.height - margin);
    const c = this.cores.create(x, y, 'core');
    c.kind = Math.random() < 0.55 ? 'ammo' : 'overcharge';
    c.setTint(c.kind === 'ammo' ? 0x06d6a0 : 0xffd166);
    c.setCircle(12, 8, 8);
    this.tweens.add({ targets: c, y: c.y - 8, duration: 620, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    this.time.delayedCall(9000 - difficulty * 3000, () => c?.destroy());
  }

  edgePoint() {
    const w = this.scale.width, h = this.scale.height;
    const side = Phaser.Math.Between(0, 3);
    if (side === 0) return { x: -24, y: Phaser.Math.Between(0, h) };
    if (side === 1) return { x: w + 24, y: Phaser.Math.Between(0, h) };
    if (side === 2) return { x: Phaser.Math.Between(0, w), y: -24 };
    return { x: Phaser.Math.Between(0, w), y: h + 24 };
  }

  collectCore(core) {
    if (!core.active) return;
    if (core.kind === 'ammo') {
      this.bonusPoints += 40;
      for (let i = 0; i < 3; i++) this.time.delayedCall(i * 65, () => this.fire(this.pointerAim.lengthSq() ? this.pointerAim : new Phaser.Math.Vector2(1,0), true));
    } else {
      this.bonusPoints += 70;
      this.overchargeUntil = this.time.now + 8000;
    }
    sfxPickup();
    core.destroy();
  }

  hitMine(bullet, mine) {
    if (!mine.active || !bullet.active) return;
    bullet.destroy();
    this.bonusPoints += 25;
    this.burst(mine.x, mine.y, 0x90e0ef);
    mine.destroy();
  }

  hitHunter(bullet, hunter) {
    if (!hunter.active || !bullet.active) return;
    bullet.destroy();
    this.bonusPoints += 35;
    this.burst(hunter.x, hunter.y, 0xffd166);
    hunter.destroy();
  }

  burst(x, y, tint) {
    const p = this.add.particles(x, y, 'dot', {
      speed: { min: 80, max: 200 }, angle: { min: 0, max: 360 }, lifespan: 500,
      scale: { start: 0.9, end: 0 }, quantity: 16, tint, alpha: { start: 0.85, end: 0 }
    });
    this.time.delayedCall(520, () => p.destroy());
  }

  update(time, delta) {
    if (this.dead) return;
    const dt = delta / 16.667;
    const elapsed = (time - this.gameStartTime) / 1000;
    const t = Math.min(elapsed / 120, 1);
    const difficulty = easeInOut(t);

    this.bgStars.tilePositionX += (0.15 + difficulty * 0.75) * dt;
    this.bgStars.tilePositionY += (0.07 + difficulty * 0.45) * dt;

    const isOvercharged = this.overchargeUntil > time;
    const mineRate = lerp(0.35, 1.8, difficulty) + (isOvercharged ? 0.32 : 0);
    const hunterRate = lerp(0.08, 0.9, difficulty) + (isOvercharged ? 0.18 : 0);
    const coreRate = lerp(0.16, 0.1, difficulty);

    if (Math.random() < mineRate * (delta / 1000)) this.spawnMine(difficulty);
    if (Math.random() < hunterRate * (delta / 1000)) this.spawnHunter(difficulty);
    if (Math.random() < coreRate * (delta / 1000) && this.cores.countActive(true) < 3) this.spawnCore(difficulty);

    if (time - this.lastPulse > lerp(6400, 2300, difficulty)) {
      this.lastPulse = time;
      const pulseY = Phaser.Math.Between(40, this.scale.height - 40);
      const pulse = this.add.rectangle(-30, pulseY, 24, 180, 0x48cae4, 0.23).setDepth(2);
      this.physics.add.existing(pulse);
      pulse.body.allowGravity = false;
      pulse.body.setVelocityX(lerp(120, 290, difficulty));
      pulse.body.setSize(24, 160);
      this.physics.add.overlap(this.player, pulse, () => this.gameOver());
      this.time.delayedCall(7000, () => pulse?.destroy());
    }

    this.hunters.children.iterate((h) => {
      if (!h?.active) return;
      const dir = new Phaser.Math.Vector2(this.player.x - h.x, this.player.y - h.y).normalize();
      h.body.velocity.x += dir.x * 5.5 * dt;
      h.body.velocity.y += dir.y * 5.5 * dt;
      const speed = h.body.velocity.length();
      if (speed > h.maxSpeed) h.body.velocity.scale(h.maxSpeed / speed);
      h.rotation = h.body.velocity.angle();
    });

    const kAim = this.keyboardAim();
    const hasKeyboardAim = kAim.lengthSq() > 0;
    const aim = hasKeyboardAim ? kAim.normalize() : this.pointerAim;

    const firing = this.touchFire || this.keys.SPACE.isDown;
    const shotGap = isOvercharged ? 95 : 135;
    if (firing && time - this.lastShot > shotGap) {
      this.lastShot = time;
      this.fire(aim, isOvercharged);
    }

    this.player.rotation = aim.angle() + Math.PI / 2;

    if (!Phaser.Geom.Rectangle.ContainsPoint(this.bounds, this.player)) {
      this.gameOver();
      return;
    }

    this.mines.children.iterate((m) => {
      if (!m?.active) return;
      if (m.x < -60 || m.x > this.scale.width + 60 || m.y < -60 || m.y > this.scale.height + 60) m.destroy();
    });
    this.hunters.children.iterate((h) => {
      if (!h?.active) return;
      if (h.x < -90 || h.x > this.scale.width + 90 || h.y < -90 || h.y > this.scale.height + 90) h.destroy();
    });

    const score = Math.floor(elapsed * 10 + this.bonusPoints);
    this.scoreText.setText(`Score: ${score}`);
    this.infoText.setText(isOvercharged ? `Overcharge: ${Math.ceil((this.overchargeUntil - time)/1000)}s (danger++)` : 'Overcharge: ready');
  }

  gameOver() {
    if (this.dead) return;
    this.dead = true;
    sfxHit(); sfxDeath();
    this.cameras.main.shake(230, 0.012);
    this.cameras.main.flash(220, 180, 235, 255);
    this.burst(this.player.x, this.player.y, 0xff6b6b);
    this.player.setVisible(false);

    const elapsed = (this.time.now - this.gameStartTime) / 1000;
    const finalScore = Math.floor(elapsed * 10 + this.bonusPoints);
    this.time.delayedCall(500, () => {
      this.scene.pause();
      showGameOverUI(finalScore);
    });
  }
}

const config = {
  type: Phaser.AUTO,
  width: 900,
  height: 600,
  backgroundColor: '#0a1628',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, GameScene]
};

gameRef = new Phaser.Game(config);

const overlay = document.getElementById('ui-overlay');
const finalScoreEl = document.getElementById('final-score');
const nameInput = document.getElementById('player-name');
const submitBtn = document.getElementById('submit-score');
const againBtn = document.getElementById('play-again');
const leaderboardEl = document.getElementById('leaderboard');
let cachedScore = 0;

async function renderLeaderboard() {
  const rows = await getLeaderboard(10);
  if (!rows.length) {
    leaderboardEl.innerHTML = 'Leaderboard unavailable or empty.';
    return;
  }
  leaderboardEl.innerHTML = '<b>Top 10</b><br>' + rows.map((r, i) => `${i + 1}. ${r.playerName} — ${r.score}`).join('<br>');
}

function showGameOverUI(finalScore) {
  cachedScore = finalScore;
  finalScoreEl.textContent = `Score: ${finalScore}`;
  overlay.style.display = 'flex';
  nameInput.focus();
  renderLeaderboard();
}

submitBtn.addEventListener('click', async () => {
  const playerName = (nameInput.value || 'Pilot').trim().slice(0,16);
  submitBtn.disabled = true;
  await submitScore(playerName || 'Pilot', cachedScore);
  await renderLeaderboard();
  submitBtn.disabled = false;
});

againBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  nameInput.value = '';
  const scene = gameRef.scene.getScene('GameScene');
  scene.scene.restart();
  gameRef.scene.start('GameScene');
});
</script>
</body>
</html>
