<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" /><title>Radio Roulette DJ</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(180deg,#2d1b4e,#1a1a2e);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;touch-action:none;font-family:'Fredoka',sans-serif}#ui-overlay{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(10,6,20,.85);z-index:10}.panel{width:min(92vw,460px);background:#201537;border:2px solid #ff6b9d;border-radius:18px;padding:20px;color:#f5ecff;box-shadow:0 0 28px rgba(255,107,157,.35)}.panel h2{font-size:2rem;margin-bottom:8px}.panel p{margin-bottom:10px;color:#e6d8ff}#playerName{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #c44dff;margin-bottom:10px;background:#130c24;color:#fff}.row{display:flex;gap:10px;margin:10px 0 14px}button{flex:1;border:none;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}#submitBtn{background:#ffd93d;color:#2b1a00}#replayBtn{background:#6bff6b;color:#043100}#leaderboard{margin-top:8px;max-height:220px;overflow:auto}#leaderboard li{margin:4px 0;color:#f8eaff}.small{font-size:.88rem;color:#d4c0ff}</style></head><body><div id="ui-overlay"><div class="panel"><h2>You're Off-Air!</h2><p id="finalScore">Score: 0</p><input id="playerName" maxlength="20" placeholder="DJ name" /><div class="row"><button id="submitBtn">Submit Score</button><button id="replayBtn">Play Again</button></div><p class="small">Top listeners voted these DJs highest:</p><ol id="leaderboard"></ol></div></div><script>/* DESIGN HEADER
Controls: Arrow/WASD move, Space/tap quick-mix pulse.
Loop/Death: Endless station survival; lose when outrage hits 100 or hype hits 0.
Hazards: Troll orbs, dead-air glitches, bad-request bombs.
Pickups/Risk-Reward: Hype drops heal + points; golden requests give big score but temporarily raise spawn chaos.
Scoring: score = Math.floor(timeAlive * 10 + bonusPoints), monotonic.
Difficulty: smooth ease ramp over 120s for speed/spawn/outrage drain.
Visual: Candy/pastel nightclub with animated equalizer bars + Fredoka.
Audio: punchy synth chirps for actions, gritty buzz for damage, descending saw for death.
*/
const GAME_ID='radio-roulette-dj-8198';const SUPABASE_URL='https://lecyuhectrddtbjfyarm.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_gEX7QnQ24XzV6t0eNuWnVQ_ud19UxxJ';const LEADERBOARD_API='https://game-hub-supabase.local';
function getClientFingerprint(){const key='gamehub.client-fingerprint.v1';const e=localStorage.getItem(key);if(e)return e;const c=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem(key,c);return c;}
async function supabaseRequest(path,{method='GET',body,prefer}={}){const headers={apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'};if(prefer)headers.Prefer=prefer;const res=await fetch(SUPABASE_URL+'/rest/v1'+path,{method,headers,body:body?JSON.stringify(body):undefined});const text=await res.text();const data=text?JSON.parse(text):null;if(!res.ok)throw new Error((data&&(data.message||data.error))||('Supabase '+res.status));return data;}
async function submitScore(playerName,score){try{await supabaseRequest('/leaderboard_scores',{method:'POST',prefer:'return=minimal',body:{game_slug:GAME_ID,player_name:String(playerName||'Anonymous').slice(0,20),score:Math.round(score),client_fingerprint:getClientFingerprint()}});const scores=await getLeaderboard(100);const rank=scores.findIndex((row)=>row.playerName===String(playerName||'Anonymous').slice(0,20)&&row.score===Math.round(score))+1;return {ok:true,rank:rank>0?rank:null,totalScores:scores.length};}catch(e){console.warn('Leaderboard unavailable:',e);return null;}}
async function getLeaderboard(limit=10){try{const rows=await supabaseRequest('/rpc/get_game_leaderboard',{method:'POST',body:{p_game_slug:GAME_ID,p_limit:Math.min(Math.max(parseInt(limit,10)||10,1),100)}});return (rows||[]).map((row)=>({playerName:row.player_name,score:Number(row.score)||0,date:row.created_at}));}catch(e){console.warn('Leaderboard unavailable:',e);return [];}}
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();function playSound(type,freq,duration,volume){if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime);gain.gain.setValueAtTime(volume||0.2,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);osc.start();osc.stop(audioCtx.currentTime+duration);}const sfxStart=()=>{playSound('triangle',520,0.08,0.2);playSound('triangle',780,0.1,0.16)};const sfxMix=()=>{playSound('square',340,0.06,0.18);playSound('triangle',460,0.08,0.12)};const sfxCollect=()=>{playSound('sine',840,0.09,0.2);playSound('sine',1120,0.12,0.14)};const sfxHit=()=>playSound('sawtooth',140,0.18,0.22);const sfxDeath=()=>{playSound('sawtooth',280,0.5,0.28);playSound('sawtooth',90,0.7,0.2)};
const lerp=(a,b,t)=>a+(b-a)*t,easeInOut=(t)=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;let currentScene=null;
class MenuScene extends Phaser.Scene{constructor(){super('MenuScene')}create(){const w=this.scale.width,h=this.scale.height,bg=this.add.graphics();bg.fillGradientStyle(0x2d1b4e,0x2d1b4e,0x1a1a2e,0x1a1a2e,1);bg.fillRect(0,0,w,h);for(let i=0;i<40;i++){const x=Phaser.Math.Between(0,w),y=Phaser.Math.Between(0,h),bar=this.add.rectangle(x,y,Phaser.Math.Between(6,14),Phaser.Math.Between(24,70),0xc44dff,0.2);this.tweens.add({targets:bar,scaleY:Phaser.Math.FloatBetween(0.4,1.6),duration:Phaser.Math.Between(500,1400),yoyo:true,repeat:-1})}this.add.text(w/2,h*.25,'RADIO ROULETTE DJ',{fontFamily:'Fredoka',fontSize:'54px',color:'#ffd93d',stroke:'#5b2a86',strokeThickness:8}).setOrigin(.5);this.add.text(w/2,h*.48,'Move left/right to catch good vibes
and dodge station chaos.
Space/Tap = Quick-Mix blast',{fontFamily:'Fredoka',fontSize:'26px',align:'center',color:'#fceeff'}).setOrigin(.5);const pulse=this.add.text(w/2,h*.72,'Tap or Press Any Key to Go Live',{fontFamily:'Fredoka',fontSize:'30px',color:'#6bff6b'}).setOrigin(.5);this.tweens.add({targets:pulse,alpha:.35,duration:700,yoyo:true,repeat:-1});const start=()=>{if(audioCtx.state==='suspended')audioCtx.resume();sfxStart();this.scene.start('GameScene')};this.input.once('pointerdown',start);this.input.keyboard.once('keydown',start)}}
class GameScene extends Phaser.Scene{constructor(){super('GameScene')}create(){currentScene=this;this.gameOverTriggered=false;this.gameStartTime=this.time.now;this.timeAlive=0;this.bonusPoints=0;this.score=0;this.chaosBoostUntil=0;this.hype=100;this.outrage=0;const w=this.scale.width,h=this.scale.height;this.eqBars=this.add.group();for(let i=0;i<26;i++){const x=i*(w/25),bar=this.add.rectangle(x,h-20,16,20,0xff6b9d,0.25).setOrigin(0.5,1);this.eqBars.add(bar)}const g=this.add.graphics();g.fillStyle(0xff6b9d,1);g.fillRoundedRect(0,18,120,52,18);g.fillStyle(0xffffff,.25);g.fillRoundedRect(8,24,104,14,8);g.fillStyle(0x2d1b4e,1);g.fillCircle(24,44,8);g.fillCircle(96,44,8);g.lineStyle(5,0xffd93d,1);g.strokeCircle(60,44,12);g.generateTexture('djDeck',120,88);g.clear();g.fillStyle(0xff4757,1);g.fillCircle(18,18,18);g.lineStyle(4,0xffffff,.3);g.strokeCircle(18,18,14);g.generateTexture('trollOrb',36,36);g.clear();g.fillStyle(0x7be3ff,1);g.fillRoundedRect(0,0,28,44,6);g.fillStyle(0xffffff,.35);g.fillRoundedRect(4,5,20,8,4);g.generateTexture('glitch',28,44);g.clear();g.fillStyle(0xff9f1c,1);g.beginPath();g.moveTo(22,0);g.lineTo(44,22);g.lineTo(22,44);g.lineTo(0,22);g.closePath();g.fillPath();g.lineStyle(4,0xffe8b6,.6);g.strokePath();g.generateTexture('badReq',44,44);g.clear();g.fillStyle(0x6bff6b,1);g.fillCircle(16,16,16);g.fillStyle(0xffffff,.4);g.fillCircle(11,10,5);g.generateTexture('hypeDrop',32,32);g.clear();g.fillStyle(0xffd93d,1);g.beginPath();g.moveTo(18,0);g.lineTo(23,12);g.lineTo(36,12);g.lineTo(26,20);g.lineTo(30,34);g.lineTo(18,26);g.lineTo(6,34);g.lineTo(10,20);g.lineTo(0,12);g.lineTo(13,12);g.closePath();g.fillPath();g.generateTexture('goldReq',36,34);g.destroy();this.player=this.physics.add.sprite(w/2,h-95,'djDeck').setCollideWorldBounds(true);this.player.body.setSize(this.player.width*.78,this.player.height*.72);this.player.body.setOffset(this.player.width*.11,this.player.height*.16);this.hazards=this.physics.add.group();this.pickups=this.physics.add.group();this.physics.add.overlap(this.player,this.hazards,this.onHazardHit,null,this);this.physics.add.overlap(this.player,this.pickups,this.onPickup,null,this);this.cursors=this.input.keyboard.createCursorKeys();this.keys=this.input.keyboard.addKeys('W,A,S,D,SPACE');this.pointerX=null;this.input.on('pointermove',p=>this.pointerX=p.x);this.input.on('pointerdown',p=>{this.pointerX=p.x;this.quickMix()});this.lastQuickMix=0;this.scoreText=this.add.text(16,12,'Score: 0',{fontFamily:'Fredoka',fontSize:'30px',color:'#fff7ba',stroke:'#482c70',strokeThickness:6});this.hypeText=this.add.text(16,52,'Hype: 100',{fontFamily:'Fredoka',fontSize:'24px',color:'#6bff6b',stroke:'#25143b',strokeThickness:5});this.outrageText=this.add.text(16,82,'Outrage: 0',{fontFamily:'Fredoka',fontSize:'24px',color:'#ff8ea6',stroke:'#25143b',strokeThickness:5});this.spawnAccumulator=0}
quickMix(){const now=this.time.now;if(now-this.lastQuickMix<850)return;this.lastQuickMix=now;sfxMix();this.cameras.main.shake(80,0.004);let cleared=0;this.hazards.getChildren().forEach(h=>{const d=Phaser.Math.Distance.Between(h.x,h.y,this.player.x,this.player.y);if(d<130&&h.active){h.destroy();cleared++}});if(cleared>0){this.bonusPoints+=cleared*12;const t=this.add.text(this.player.x,this.player.y-50,'MIX x'+cleared,{fontFamily:'Fredoka',fontSize:'18px',align:'center',color:'#ffd93d'}).setOrigin(.5);this.tweens.add({targets:t,y:t.y-30,alpha:0,duration:500,onComplete:()=>t.destroy()})}}
spawnEntity(kind,speedMul){const w=this.scale.width,x=Phaser.Math.Between(32,w-32);if(Phaser.Math.Distance.Between(x,0,this.player.x,this.player.y)<140)return;if(kind==='troll'){const s=this.hazards.create(x,-20,'trollOrb');s.type='troll';s.speed=speedMul*Phaser.Math.FloatBetween(95,140);s.body.setCircle(14)}else if(kind==='glitch'){const s=this.hazards.create(x,-20,'glitch');s.type='glitch';s.speed=speedMul*Phaser.Math.FloatBetween(70,110);s.body.setSize(20,34);s.body.setOffset(4,6)}else if(kind==='badReq'){const s=this.hazards.create(x,-20,'badReq');s.type='badReq';s.speed=speedMul*Phaser.Math.FloatBetween(120,170);s.spin=Phaser.Math.FloatBetween(-0.03,0.03);s.body.setSize(28,28);s.body.setOffset(8,8)}else if(kind==='hype'){const s=this.pickups.create(x,-20,'hypeDrop');s.type='hype';s.speed=speedMul*Phaser.Math.FloatBetween(90,120);s.body.setCircle(12)}else if(kind==='gold'){const s=this.pickups.create(x,-20,'goldReq');s.type='gold';s.speed=speedMul*Phaser.Math.FloatBetween(100,140);s.body.setSize(24,24);s.body.setOffset(6,5)}}
onHazardHit(_p,h){if(!h.active||this.gameOverTriggered)return;const map={troll:[12,5],glitch:[8,8],badReq:[16,4]},vals=map[h.type]||[10,6];this.outrage=Math.min(100,this.outrage+vals[0]);this.hype=Math.max(0,this.hype-vals[1]);h.destroy();this.player.setTint(0xffffff);this.tweens.add({targets:this.player,alpha:.75,yoyo:true,repeat:1,duration:70,onComplete:()=>this.player.clearTint()});sfxHit();this.cameras.main.shake(120,.008)}
onPickup(_p,p){if(!p.active)return;if(p.type==='hype'){this.hype=Math.min(100,this.hype+18);this.bonusPoints+=24}else{this.bonusPoints+=70;this.chaosBoostUntil=this.time.now+7000;this.outrage=Math.min(100,this.outrage+5)}sfxCollect();const pop=this.add.text(p.x,p.y-12,p.type==='gold'?'+70 CHAOS!':'+24 HYPE',{fontFamily:'Fredoka',fontSize:'16px',color:p.type==='gold'?'#ffd93d':'#6bff6b'}).setOrigin(.5);this.tweens.add({targets:pop,y:pop.y-24,alpha:0,duration:600,onComplete:()=>pop.destroy()});p.destroy()}
gameOver(){if(this.gameOverTriggered)return;this.gameOverTriggered=true;sfxDeath();this.player.setTint(0xff4444);this.tweens.add({targets:this.player,scale:1.4,alpha:0,duration:320,ease:'Back.easeIn'});this.cameras.main.shake(220,.015);this.cameras.main.flash(180,255,180,200);this.time.delayedCall(520,()=>{this.scene.pause();showGameOverUI(Math.floor(this.score))})}
update(time,delta){if(this.gameOverTriggered)return;const dt=delta/16.667,elapsed=(time-this.gameStartTime)/1000;this.timeAlive=elapsed;const t=Math.min(elapsed/120,1),diff=easeInOut(t),baseSpeed=lerp(1,2.4,diff),hazardRate=lerp(0.55,2.7,diff)+(time<this.chaosBoostUntil?0.75:0),pickupRate=lerp(0.33,0.5,1-diff),moveSpeed=lerp(240,380,diff);this.player.setVelocityX(0);const left=this.cursors.left.isDown||this.keys.A.isDown,right=this.cursors.right.isDown||this.keys.D.isDown;if(left)this.player.setVelocityX(-moveSpeed*dt);else if(right)this.player.setVelocityX(moveSpeed*dt);else if(this.pointerX!==null){const dx=this.pointerX-this.player.x;this.player.setVelocityX(Phaser.Math.Clamp(dx*6,-moveSpeed,moveSpeed)*dt)}if(Phaser.Input.Keyboard.JustDown(this.keys.SPACE))this.quickMix();this.spawnAccumulator+=delta/1000;while(this.spawnAccumulator>0.12){this.spawnAccumulator-=0.12;if(Math.random()<hazardRate*0.12){const r=Math.random();if(r<0.45)this.spawnEntity('troll',baseSpeed);else if(r<0.75)this.spawnEntity('glitch',baseSpeed);else this.spawnEntity('badReq',baseSpeed)}if(Math.random()<pickupRate*0.12)this.spawnEntity(Math.random()<0.78?'hype':'gold',baseSpeed)}this.hazards.getChildren().forEach(h=>{if(!h.active)return;h.y+=h.speed*(delta/1000);if(h.type==='troll')h.x+=Math.sin((time+h.y)*0.005)*0.8*dt;if(h.type==='badReq')h.rotation+=h.spin*dt;if(h.type==='glitch')h.alpha=0.45+Math.sin(time*0.02+h.y*0.1)*0.4;if(h.y>this.scale.height+40)h.destroy()});this.pickups.getChildren().forEach(p=>{if(!p.active)return;p.y+=p.speed*(delta/1000);p.x+=Math.sin((time+p.y)*0.008)*0.7*dt;if(p.y>this.scale.height+40)p.destroy()});this.eqBars.getChildren().forEach((bar,i)=>{bar.height=20+Math.abs(Math.sin(time*0.005+i*0.35))*lerp(22,68,diff)});this.outrage=Math.min(100,this.outrage+lerp(0.018,0.11,diff)*dt);this.hype=Math.max(0,this.hype-lerp(0.012,0.05,diff)*dt);this.score=Math.floor(this.timeAlive*10+this.bonusPoints);this.scoreText.setText('Score: '+this.score);this.hypeText.setText('Hype: '+Math.floor(this.hype));this.outrageText.setText('Outrage: '+Math.floor(this.outrage));if(this.hype<=0||this.outrage>=100)this.gameOver()}}
new Phaser.Game({type:Phaser.AUTO,width:800,height:600,backgroundColor:'#1a1a2e',physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[MenuScene,GameScene]});
const overlay=document.getElementById('ui-overlay'),finalScoreEl=document.getElementById('finalScore'),nameInput=document.getElementById('playerName'),submitBtn=document.getElementById('submitBtn'),replayBtn=document.getElementById('replayBtn'),leaderboardEl=document.getElementById('leaderboard');let latestScore=0;
async function renderLeaderboard(){const rows=await getLeaderboard(10);leaderboardEl.innerHTML='';if(!rows.length){const li=document.createElement('li');li.textContent='No scores yet — be first!';leaderboardEl.appendChild(li);return;}rows.forEach((r,i)=>{const li=document.createElement('li');li.textContent='#'+(i+1)+' '+r.playerName+' — '+r.score;leaderboardEl.appendChild(li);});}
function showGameOverUI(finalScore){latestScore=finalScore;finalScoreEl.textContent='Score: '+finalScore;overlay.style.display='flex';renderLeaderboard();setTimeout(()=>nameInput.focus(),80)}
submitBtn.addEventListener('click',async()=>{submitBtn.disabled=true;const name=(nameInput.value||'Anonymous').trim().slice(0,20)||'Anonymous';await submitScore(name,latestScore);await renderLeaderboard();submitBtn.disabled=false;});
replayBtn.addEventListener('click',()=>{overlay.style.display='none';nameInput.value='';submitBtn.disabled=false;if(currentScene)currentScene.scene.restart();});
</script></body></html>
