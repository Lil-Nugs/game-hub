<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Dreamfall Escape</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #0a1628 0%, #09111d 45%, #05070c 100%);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; touch-action: none;
      font-family: 'Orbitron', sans-serif;
      color: #d7f6ff;
    }
    #ui-overlay {
      position: fixed; inset: 0; display: none;
      justify-content: center; align-items: center;
      background: rgba(4, 10, 20, 0.86); z-index: 10;
      padding: 16px;
    }
    .panel {
      width: min(92vw, 430px);
      border: 2px solid #48cae4;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(12,28,42,0.96), rgba(6,15,24,0.96));
      box-shadow: 0 0 28px rgba(72,202,228,0.28);
      padding: 18px;
    }
    h2 { font-size: 1.4rem; margin-bottom: 10px; color: #90e0ef; }
    .score { font-size: 1.8rem; font-weight: 900; color: #ffd166; margin-bottom: 12px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #48cae4; background: #06121d; color: #eafcff;
      font-family: inherit; margin-bottom: 10px;
    }
    button {
      width: 100%; margin-top: 8px; padding: 10px 12px;
      border-radius: 8px; border: 0; cursor: pointer;
      font-family: inherit; font-weight: 700;
      background: #00b4d8; color: #031018;
    }
    button:hover { filter: brightness(1.08); }
    #leaderboard { margin-top: 12px; font-size: 0.9rem; line-height: 1.45; max-height: 180px; overflow-y: auto; }
    #leaderboard ol { padding-left: 18px; }
    .tiny { margin-top: 8px; opacity: 0.8; font-size: 0.78rem; }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div class="panel">
      <h2>Dream Shattered</h2>
      <div id="final-score" class="score">Score: 0</div>
      <input id="player-name" maxlength="16" placeholder="Your name" value="Runner" />
      <button id="submit-score">Submit Score</button>
      <div id="leaderboard">Top dream runners will appear here.</div>
      <button id="play-again">Play Again</button>
      <div class="tiny">Controls: A/D or ←/→ to switch lanes, Space/↑ or tap to jump.</div>
    </div>
  </div>

<script src='../../shared/supabase-config.js'></script><script src='../../shared/supabase-client.js'></script><script>
// Design notes:
// Genre: Endless lane-runner survival.
// Core mechanic: Switch between 3 lanes and jump over low hazards while dodging blockers.
// Death condition: Collision with nightmare debris.
// Difficulty: Time-based smooth ramp of scroll speed + spawn frequency + hazard complexity.
// Visual theme: Ocean/cool dreamscape (teal/cyan palette), circular dream-runner vs jagged debris silhouettes.
// Score: timeAlive*10 + bonus dream shards.

const GAME_ID = 'dream-collapse-runner-b62f';
const LEADERBOARD_API = window.GAME_HUB_API_BASE;

async function submitScore(playerName, score) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gameId: GAME_ID, playerName, score })
    });
    return await res.json();
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return null;
  }
}

async function getLeaderboard(limit = 10) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);
    const data = await res.json();
    return data.scores || [];
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return [];
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type, freq, duration, volume = 0.25, slide = null) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
const sfxStart = () => { playSound('triangle', 320, 0.08, 0.15, 520); playSound('triangle', 520, 0.11, 0.11, 760); };
const sfxJump = () => { playSound('sine', 360, 0.08, 0.18, 620); };
const sfxCollect = () => { playSound('sine', 780, 0.08, 0.14, 1080); };
const sfxHit = () => { playSound('sawtooth', 160, 0.22, 0.24, 75); };
const sfxDeath = () => { playSound('square', 340, 0.12, 0.2, 120); playSound('sawtooth', 150, 0.5, 0.22, 45); };

const W = 800, H = 600;
const laneX = [260, 400, 540];
const overlay = document.getElementById('ui-overlay');
const finalScoreEl = document.getElementById('final-score');
const nameInput = document.getElementById('player-name');
const submitBtn = document.getElementById('submit-score');
const leaderboardEl = document.getElementById('leaderboard');
const replayBtn = document.getElementById('play-again');
let currentScene = null;
let latestScore = 0;

function lerp(a,b,t){ return a + (b-a)*t; }
function easeInOut(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2,2)/2; }

class MenuScene extends Phaser.Scene {
  constructor(){ super('MenuScene'); }
  create(){
    this.add.rectangle(W/2, H/2, W, H, 0x0a1628, 1);
    for(let i=0;i<120;i++){
      const star = this.add.circle(Phaser.Math.Between(0,W), Phaser.Math.Between(0,H), Phaser.Math.Between(1,3), 0x90e0ef, Phaser.Math.FloatBetween(0.2,0.8));
      this.tweens.add({ targets: star, alpha: Phaser.Math.FloatBetween(0.12,0.9), duration: Phaser.Math.Between(1000,3000), yoyo:true, repeat:-1 });
    }
    this.add.text(W/2, 150, 'DREAMFALL ESCAPE', { fontFamily:'Orbitron', fontSize:'48px', color:'#90e0ef', stroke:'#001219', strokeThickness:6 }).setOrigin(0.5);
    this.add.text(W/2, 240, 'The dream is collapsing behind you. Keep running.', { fontFamily:'Orbitron', fontSize:'20px', color:'#caf0f8' }).setOrigin(0.5);
    this.add.text(W/2, 310, 'Move lanes: A/D or ←/→\nJump: Space/↑ or Tap\nCollect dream shards for bonus score', { align:'center', fontFamily:'Orbitron', fontSize:'22px', color:'#48cae4', lineSpacing: 10 }).setOrigin(0.5);
    const pulse = this.add.text(W/2, 500, 'TAP OR PRESS ANY KEY TO START', { fontFamily:'Orbitron', fontSize:'20px', color:'#ffd166' }).setOrigin(0.5);
    this.tweens.add({ targets: pulse, alpha: 0.35, duration: 650, yoyo: true, repeat: -1 });

    const start = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      sfxStart();
      this.scene.start('GameScene');
    };
    this.input.once('pointerdown', start);
    this.input.keyboard.once('keydown', start);
  }
}

class GameScene extends Phaser.Scene {
  constructor(){ super('GameScene'); }
  create(){
    currentScene = this;
    this.isDead = false;
    this.score = 0;
    this.bonus = 0;
    this.gameStartTime = this.time.now;
    this.spawnAccumulator = 0;
    this.shardAccumulator = 0;
    this.currentLane = 1;

    this.bg = this.add.tileSprite(W/2,H/2,W,H,'').setTint(0x0a1628);
    this.road = this.add.tileSprite(W/2,H/2,420,H,'').setTint(0x123047).setAlpha(0.7);
    for (let x of laneX) this.add.rectangle(x, H/2, 4, H, 0x48cae4, 0.22);

    // textures
    const g = this.make.graphics({x:0,y:0,add:false});
    g.fillStyle(0x48cae4,1); g.fillCircle(48,48,36);
    g.fillStyle(0x90e0ef,0.8); g.fillCircle(56,40,12);
    g.lineStyle(6,0x00b4d8,1); g.strokeCircle(48,48,36); g.generateTexture('runner',96,96); g.clear();

    g.fillStyle(0x1b263b,1); g.fillTriangle(48,8,10,84,86,84);
    g.fillStyle(0x415a77,1); g.fillTriangle(48,18,22,76,74,76);
    g.lineStyle(4,0x778da9,1); g.strokeTriangle(48,8,10,84,86,84); g.generateTexture('spike',96,96); g.clear();

    g.fillStyle(0xffd166,1); g.fillCircle(28,28,20);
    g.fillStyle(0xffef99,1); g.fillCircle(20,20,8);
    g.lineStyle(3,0xe09f3e,1); g.strokeCircle(28,28,20); g.generateTexture('shard',56,56); g.destroy();

    this.player = this.physics.add.sprite(laneX[this.currentLane], H-110, 'runner').setScale(0.72);
    this.player.body.setCircle(26, 22, 22);
    this.player.setDepth(3);
    this.playerJumping = false;

    this.obstacles = this.physics.add.group();
    this.shards = this.physics.add.group();

    this.physics.add.overlap(this.player, this.obstacles, this.die, null, this);
    this.physics.add.overlap(this.player, this.shards, this.collectShard, null, this);

    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('A,D,SPACE');
    this.input.on('pointerdown', (p) => {
      if (this.isDead) return;
      if (p.x < W*0.33) this.shiftLane(-1);
      else if (p.x > W*0.66) this.shiftLane(1);
      else this.jump();
    });

    this.scoreText = this.add.text(16, 14, 'Score: 0', { fontFamily:'Orbitron', fontSize:'26px', color:'#caf0f8', stroke:'#001219', strokeThickness:4 }).setDepth(5);
    this.timeText = this.add.text(16, 48, 'Time: 0.0s', { fontFamily:'Orbitron', fontSize:'20px', color:'#90e0ef' }).setDepth(5);

    this.particles = this.add.particles(0,0,'shard',{ lifespan:500, speed:{min:20,max:140}, scale:{start:0.2,end:0}, blendMode:'ADD', emitting:false });
  }

  shiftLane(dir){
    const target = Phaser.Math.Clamp(this.currentLane + dir, 0, 2);
    if (target === this.currentLane) return;
    this.currentLane = target;
    this.tweens.add({ targets: this.player, x: laneX[target], duration: 115, ease:'Sine.out' });
  }

  jump(){
    if (this.playerJumping) return;
    this.playerJumping = true;
    sfxJump();
    this.tweens.add({
      targets: this.player,
      y: H-210,
      duration: 220,
      ease: 'Sine.out',
      yoyo: true,
      onComplete: () => { this.player.y = H-110; this.playerJumping = false; }
    });
  }

  spawnObstacle(speed){
    const lane = Phaser.Math.Between(0,2);
    const type = Math.random() < 0.28 ? 'low' : 'high';
    const y = -60;
    const obs = this.obstacles.create(laneX[lane], y, 'spike').setScale(type === 'low' ? 0.52 : 0.8);
    obs.type = type;
    obs.speed = speed * (type === 'low' ? 1.05 : 0.95);
    obs.angleVel = Phaser.Math.FloatBetween(-110,110);
    obs.body.setCircle(type === 'low' ? 15 : 23, type === 'low' ? 18 : 16, type === 'low' ? 18 : 16);
  }

  spawnShard(speed){
    const lane = Phaser.Math.Between(0,2);
    const shard = this.shards.create(laneX[lane], -40, 'shard').setScale(0.6);
    shard.speed = speed * 0.85;
    shard.spin = Phaser.Math.FloatBetween(-180,180);
    shard.body.setCircle(10, 8, 8);
  }

  collectShard(player, shard){
    shard.destroy();
    this.bonus += 25;
    sfxCollect();
    this.particles.emitParticleAt(player.x, player.y-20, 12);
  }

  die(){
    if (this.isDead) return;
    this.isDead = true;
    sfxHit(); sfxDeath();
    this.cameras.main.shake(240, 0.015);
    this.cameras.main.flash(220, 200, 240, 255);
    this.player.setTint(0xffffff);
    this.tweens.add({ targets: this.player, alpha: 0, angle: 180, duration: 420, ease: 'Cubic.in' });
    this.time.delayedCall(500, () => {
      this.scene.pause();
      showGameOverUI(Math.floor(this.score));
    });
  }

  update(time, delta){
    if (this.isDead) return;
    const dt = delta / 16.667;
    const elapsed = (time - this.gameStartTime) / 1000;
    const difficulty = easeInOut(Math.min(elapsed / 120, 1));

    const worldSpeed = lerp(4.2, 12.8, difficulty) * dt;
    const spawnRate = lerp(0.55, 2.85, difficulty);
    const shardRate = lerp(0.42, 1.55, difficulty);

    this.bg.tilePositionY += worldSpeed * 0.35;
    this.road.tilePositionY += worldSpeed;

    this.spawnAccumulator += delta / 1000;
    this.shardAccumulator += delta / 1000;

    if (this.spawnAccumulator >= 1 / spawnRate) {
      this.spawnAccumulator = 0;
      this.spawnObstacle(worldSpeed);
    }
    if (this.shardAccumulator >= 1 / shardRate) {
      this.shardAccumulator = 0;
      this.spawnShard(worldSpeed);
    }

    this.obstacles.children.iterate(o => {
      if (!o) return;
      o.y += o.speed;
      o.angle += o.angleVel * (delta/1000);
      if (o.y > H + 90) o.destroy();
      if (o.type === 'low' && !this.playerJumping && Phaser.Math.Distance.Between(o.x,o.y,this.player.x,this.player.y) < 52) {
        this.die();
      }
    });

    this.shards.children.iterate(s => {
      if (!s) return;
      s.y += s.speed;
      s.angle += s.spin * (delta/1000);
      if (s.y > H + 70) s.destroy();
    });

    if (Phaser.Input.Keyboard.JustDown(this.cursors.left) || Phaser.Input.Keyboard.JustDown(this.keys.A)) this.shiftLane(-1);
    if (Phaser.Input.Keyboard.JustDown(this.cursors.right) || Phaser.Input.Keyboard.JustDown(this.keys.D)) this.shiftLane(1);
    if (Phaser.Input.Keyboard.JustDown(this.cursors.up) || Phaser.Input.Keyboard.JustDown(this.cursors.space) || Phaser.Input.Keyboard.JustDown(this.keys.SPACE)) this.jump();

    this.score += delta / 100 + (this.bonus > 0 ? 0 : 0);
    const total = Math.floor(this.score + this.bonus);
    this.scoreText.setText(`Score: ${total}`);
    this.timeText.setText(`Time: ${elapsed.toFixed(1)}s`);
  }
}

const game = new Phaser.Game({
  type: Phaser.AUTO,
  width: W,
  height: H,
  backgroundColor: '#0a1628',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, GameScene]
});

function renderLeaderboard(scores){
  if (!scores.length) { leaderboardEl.innerHTML = 'No scores yet — be the first lucid runner.'; return; }
  leaderboardEl.innerHTML = `<ol>${scores.map(s => `<li><strong>${(s.playerName||'Anon').replace(/[<>]/g,'')}</strong> — ${s.score}</li>`).join('')}</ol>`;
}

async function showGameOverUI(finalScore){
  latestScore = finalScore;
  finalScoreEl.textContent = `Score: ${finalScore}`;
  overlay.style.display = 'flex';
  const scores = await getLeaderboard(10);
  renderLeaderboard(scores);
}

submitBtn.addEventListener('click', async () => {
  submitBtn.disabled = true;
  const name = (nameInput.value || 'Runner').trim().slice(0,16);
  await submitScore(name || 'Runner', latestScore);
  const scores = await getLeaderboard(10);
  renderLeaderboard(scores);
  submitBtn.disabled = false;
});

replayBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  submitBtn.disabled = false;
  if (currentScene) currentScene.scene.restart();
});
</script>
</body>
</html>
