<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Paradox Pursuit</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 30% 30%, #10233a, #060b17 65%);
      display: flex; justify-content: center; align-items: center;
      width: 100vw; height: 100vh; overflow: hidden; touch-action: none;
      font-family: 'Orbitron', sans-serif;
    }
    #ui-overlay {
      position: fixed; inset: 0; display: none; z-index: 10;
      align-items: center; justify-content: center;
      background: rgba(2, 6, 14, 0.82);
      color: #d9f2ff;
    }
    .panel {
      width: min(92vw, 460px); background: rgba(8, 20, 40, 0.95);
      border: 2px solid #48cae4; border-radius: 14px; padding: 18px;
      box-shadow: 0 0 24px rgba(72, 202, 228, 0.3);
      text-align: center;
    }
    h2 { font-size: 28px; margin-bottom: 8px; color: #90e0ef; }
    #final-score { font-size: 20px; margin: 10px 0 14px; color: #ffd166; }
    input, button {
      width: 100%; margin: 6px 0; padding: 10px;
      border-radius: 8px; border: 1px solid #48cae4;
      background: #0d1f39; color: #fff; font-family: inherit;
    }
    button { cursor: pointer; font-weight: 700; background: #12548a; }
    button:hover { filter: brightness(1.1); }
    #leaderboard { margin-top: 10px; font-size: 14px; text-align: left; max-height: 180px; overflow-y: auto; }
    .lb-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(144,224,239,.2); }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div class="panel">
      <h2>Timeline Collapsed</h2>
      <div id="final-score">Score: 0</div>
      <input id="player-name" maxlength="20" placeholder="Your codename" value="Traveler" />
      <button id="submit-score">Submit Score</button>
      <button id="play-again">Play Again</button>
      <div id="leaderboard"></div>
    </div>
  </div>
<script src='../../shared/supabase-config.js'></script><script src='../../shared/supabase-client.js'></script><script>
const GAME_ID = 'time-chase-paradox-4ad1';
const LEADERBOARD_API = window.GAME_HUB_API_BASE;

/* DESIGN HEADER
Controls: WASD/Arrow keys to move, hold/touch to dash toward pointer (high risk), mobile drag supported.
Loop/Death: Survive endless pursuit by alternate selves; touching any pursuer or anomaly shard kills you.
Hazards: (1) Echo Hunters that home slowly then sharply, (2) Mirror Wraiths that charge in straight bursts, (3) Temporal shards drifting from rifts.
Pickups/Risk: Chrono Orbs give +25 bonus and brief slowdown pulse; grabbing while chased is risky. Dash grants mobility but increases heat and spawns more hazards.
Scoring: score = Math.floor(timeAlive*10 + bonusPoints), monotonic.
Difficulty: smooth 0->1 over 120s; spawn rate, enemy speed, burst frequency, shard density all lerp up with ease.
Visual: Ocean/Cosmic cool palette, Orbitron font, parallax starfield + moving rift rings.
Audio: soft sine for pickups, triangle chirps for dashes, distorted saw for hits/death.
*/

async function submitScore(playerName, score) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gameId: GAME_ID, playerName, score })
    });
    return await res.json();
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return null;
  }
}

async function getLeaderboard(limit = 10) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);
    const data = await res.json();
    return data.scores || [];
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return [];
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type, freq, duration, volume = 0.2, rampTo = 0.001) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(rampTo, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
const sfxStart = () => { playSound('triangle', 440, .08, .16); playSound('triangle', 660, .1, .12); };
const sfxDash = () => { playSound('triangle', 520, .08, .14); playSound('sine', 820, .06, .1); };
const sfxCollect = () => { playSound('sine', 720, .08, .17); playSound('sine', 980, .11, .12); };
const sfxHit = () => { playSound('sawtooth', 170, .18, .22); };
const sfxDeath = () => { playSound('sawtooth', 300, .15, .2); playSound('sawtooth', 120, .65, .24); };

const overlay = document.getElementById('ui-overlay');
const finalScoreEl = document.getElementById('final-score');
const playerNameInput = document.getElementById('player-name');
const submitBtn = document.getElementById('submit-score');
const playAgainBtn = document.getElementById('play-again');
const leaderboardEl = document.getElementById('leaderboard');

let currentScene = null;
let finalScoreCache = 0;

function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }

function renderLeaderboard(scores) {
  if (!scores.length) {
    leaderboardEl.innerHTML = '<div style="opacity:.8">No scores yet — be first to stabilize the timeline.</div>';
    return;
  }
  leaderboardEl.innerHTML = '<div style="margin-bottom:6px;color:#90e0ef">Top Temporal Survivors</div>' +
    scores.map((s, i) => `<div class="lb-row"><span>${i + 1}. ${String(s.playerName || 'Traveler').slice(0,20)}</span><strong>${s.score}</strong></div>`).join('');
}

async function showGameOverUI(finalScore) {
  finalScoreCache = finalScore;
  finalScoreEl.textContent = `Score: ${finalScore}`;
  overlay.style.display = 'flex';
  renderLeaderboard(await getLeaderboard());
}

submitBtn.onclick = async () => {
  submitBtn.disabled = true;
  const name = (playerNameInput.value || 'Traveler').trim().slice(0, 20);
  await submitScore(name || 'Traveler', finalScoreCache);
  renderLeaderboard(await getLeaderboard());
  submitBtn.disabled = false;
};

playAgainBtn.onclick = () => {
  overlay.style.display = 'none';
  if (currentScene) currentScene.scene.restart();
};

class MenuScene extends Phaser.Scene {
  constructor() { super('MenuScene'); }
  create() {
    const { width, height } = this.scale;
    this.add.text(width/2, height*0.22, 'PARADOX PURSUIT', { fontFamily: 'Orbitron', fontSize: '46px', color: '#90e0ef' }).setOrigin(0.5);
    this.add.text(width/2, height*0.39,
      'You are a time traveler hunted by your alternate selves.\nMove: WASD / Arrows / drag\nDash: Hold pointer (raises danger)\nGrab Chrono Orbs for bonus + brief slowdown',
      { fontFamily: 'Orbitron', fontSize: '19px', color: '#d9f2ff', align: 'center', lineSpacing: 8 }).setOrigin(0.5);
    const pulse = this.add.text(width/2, height*0.8, 'Tap / Press Any Key to Jump Timelines', { fontFamily: 'Orbitron', fontSize: '22px', color: '#ffd166' }).setOrigin(0.5);
    this.tweens.add({ targets: pulse, alpha: 0.25, duration: 650, yoyo: true, repeat: -1 });

    const start = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      sfxStart();
      this.scene.start('GameScene');
    };
    this.input.keyboard.once('keydown', start);
    this.input.once('pointerdown', start);
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  createTextures() {
    const g = this.add.graphics();
    g.clear();
    g.fillStyle(0x00b4d8, 1); g.fillCircle(48, 48, 34);
    g.lineStyle(6, 0x90e0ef, 1); g.strokeCircle(48, 48, 34);
    g.fillStyle(0xffffff, .32); g.fillCircle(60, 35, 10);
    g.generateTexture('playerTex', 96, 96);

    g.clear();
    g.fillStyle(0x7b2cbf, 1); g.fillTriangle(16, 80, 48, 16, 80, 80);
    g.lineStyle(5, 0xc77dff, 1); g.strokeTriangle(16, 80, 48, 16, 80, 80);
    g.fillStyle(0xffffff, .3); g.fillCircle(48, 50, 8);
    g.generateTexture('hunterTex', 96, 96);

    g.clear();
    g.fillStyle(0xf72585, 1); g.fillCircle(48, 48, 24);
    g.lineStyle(8, 0xff99c8, 1); g.strokeCircle(48, 48, 24);
    g.fillStyle(0xffffff, .35); g.fillCircle(55, 42, 6);
    g.generateTexture('wraithTex', 96, 96);

    g.clear();
    g.fillStyle(0xff4d6d, 1); g.fillTriangle(10, 86, 48, 10, 86, 86);
    g.lineStyle(4, 0xff8fa3, 1); g.strokeTriangle(10, 86, 48, 10, 86, 86);
    g.generateTexture('shardTex', 96, 96);

    g.clear();
    g.fillStyle(0xffd166, 1); g.fillCircle(48, 48, 22);
    g.lineStyle(5, 0xffffff, 1); g.strokeCircle(48, 48, 22);
    g.generateTexture('orbTex', 96, 96);

    g.destroy();
  }

  create() {
    currentScene = this;
    overlay.style.display = 'none';
    this.createTextures();

    this.bg1 = this.add.tileSprite(400, 300, 800, 600, null).setTint(0x0a1628).setAlpha(.7);
    this.starField = this.add.particles(0, 0, 'orbTex', {
      x: { min: 0, max: 800 }, y: { min: 0, max: 600 },
      speedY: { min: 6, max: 24 }, speedX: { min: -5, max: 5 },
      lifespan: 14000, scale: { start: 0.03, end: 0 }, alpha: { start: .5, end: 0 }, quantity: 1, frequency: 130
    });

    this.player = this.physics.add.sprite(400, 300, 'playerTex').setScale(.52).setDamping(true).setDrag(0.93).setMaxVelocity(240);
    this.player.body.setCircle(18, 14, 14);

    this.hunters = this.physics.add.group();
    this.wraiths = this.physics.add.group();
    this.shards = this.physics.add.group();
    this.orbs = this.physics.add.group();

    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D');
    this.pointer = this.input.activePointer;

    this.gameStartTime = this.time.now;
    this.bonusPoints = 0;
    this.heat = 0;
    this.dead = false;

    this.scoreText = this.add.text(14, 10, 'Score 0', { fontFamily: 'Orbitron', fontSize: '24px', color: '#d9f2ff' }).setDepth(20);
    this.infoText = this.add.text(14, 40, 'Avoid selves. Hold pointer to dash.', { fontFamily: 'Orbitron', fontSize: '14px', color: '#90e0ef' }).setDepth(20);

    this.physics.add.overlap(this.player, this.hunters, () => this.gameOver(), null, this);
    this.physics.add.overlap(this.player, this.wraiths, () => this.gameOver(), null, this);
    this.physics.add.overlap(this.player, this.shards, () => this.gameOver(), null, this);
    this.physics.add.overlap(this.player, this.orbs, (_, orb) => this.collectOrb(orb), null, this);

    this.time.addEvent({ delay: 950, loop: true, callback: () => this.trySpawnHunter() });
    this.time.addEvent({ delay: 1450, loop: true, callback: () => this.trySpawnWraith() });
    this.time.addEvent({ delay: 1200, loop: true, callback: () => this.trySpawnShard() });
    this.time.addEvent({ delay: 2600, loop: true, callback: () => this.trySpawnOrb() });
  }

  getDifficulty() {
    const elapsed = (this.time.now - this.gameStartTime) / 1000;
    const t = Math.min(elapsed / 120, 1);
    return { elapsed, t, e: easeInOut(t) };
  }

  spawnAtEdge(tex, group, scale = .46) {
    const side = Phaser.Math.Between(0, 3);
    let x = 0, y = 0;
    if (side === 0) { x = Phaser.Math.Between(0, 800); y = -20; }
    else if (side === 1) { x = 820; y = Phaser.Math.Between(0, 600); }
    else if (side === 2) { x = Phaser.Math.Between(0, 800); y = 620; }
    else { x = -20; y = Phaser.Math.Between(0, 600); }
    if (Phaser.Math.Distance.Between(x, y, this.player.x, this.player.y) < 180) return null;
    const s = group.create(x, y, tex).setScale(scale);
    s.body.setCircle(16, 15, 15);
    return s;
  }

  trySpawnHunter() {
    if (this.dead) return;
    const { e } = this.getDifficulty();
    const cap = Math.floor(lerp(2, 13, e + Math.min(this.heat * 0.12, 0.2)));
    if (this.hunters.countActive(true) >= cap) return;
    const h = this.spawnAtEdge('hunterTex', this.hunters);
    if (!h) return;
    h.turnRate = Phaser.Math.FloatBetween(0.02, 0.05);
    h.baseSpeed = lerp(28, 125, e);
  }

  trySpawnWraith() {
    if (this.dead) return;
    const { e } = this.getDifficulty();
    const cap = Math.floor(lerp(1, 8, e + Math.min(this.heat * 0.15, 0.25)));
    if (this.wraiths.countActive(true) >= cap || Math.random() > lerp(0.35, 0.9, e)) return;
    const w = this.spawnAtEdge('wraithTex', this.wraiths, .44);
    if (!w) return;
    w.body.setCircle(15, 16, 16);
    w.chargeTimer = Phaser.Math.Between(500, 1100);
  }

  trySpawnShard() {
    if (this.dead) return;
    const { e } = this.getDifficulty();
    if (Math.random() > lerp(0.25, 0.95, e + Math.min(this.heat*0.08, 0.15))) return;
    const sh = this.spawnAtEdge('shardTex', this.shards, .34);
    if (!sh) return;
    sh.body.setCircle(12, 18, 18);
    const angle = Phaser.Math.Angle.Between(sh.x, sh.y, this.player.x + Phaser.Math.Between(-100,100), this.player.y + Phaser.Math.Between(-100,100));
    const speed = lerp(50, 180, e);
    sh.setVelocity(Math.cos(angle)*speed, Math.sin(angle)*speed);
    sh.setAngularVelocity(Phaser.Math.Between(-160, 160));
  }

  trySpawnOrb() {
    if (this.dead) return;
    if (this.orbs.countActive(true) > 2) return;
    const x = Phaser.Math.Between(80, 720), y = Phaser.Math.Between(80, 520);
    if (Phaser.Math.Distance.Between(x, y, this.player.x, this.player.y) < 130) return;
    const orb = this.orbs.create(x, y, 'orbTex').setScale(0.28);
    orb.body.setCircle(18, 15, 15);
    this.tweens.add({ targets: orb, y: y - 10, yoyo: true, duration: 700, repeat: -1, ease: 'Sine.inOut' });
  }

  collectOrb(orb) {
    orb.destroy();
    this.bonusPoints += 25;
    sfxCollect();
    this.cameras.main.flash(80, 120, 220, 255, false);
    this.hunters.children.each(h => { if (h.active) h.baseSpeed *= 0.88; });
    this.wraiths.children.each(w => { if (w.active) w.chargeTimer += 80; });
  }

  handlePlayer(dt) {
    const accel = 12 * dt;
    if (this.keys.A.isDown || this.cursors.left.isDown) this.player.setVelocityX(this.player.body.velocity.x - accel);
    if (this.keys.D.isDown || this.cursors.right.isDown) this.player.setVelocityX(this.player.body.velocity.x + accel);
    if (this.keys.W.isDown || this.cursors.up.isDown) this.player.setVelocityY(this.player.body.velocity.y - accel);
    if (this.keys.S.isDown || this.cursors.down.isDown) this.player.setVelocityY(this.player.body.velocity.y + accel);

    if (this.pointer.isDown) {
      const ang = Phaser.Math.Angle.Between(this.player.x, this.player.y, this.pointer.worldX, this.pointer.worldY);
      this.player.body.velocity.x += Math.cos(ang) * 8.5 * dt;
      this.player.body.velocity.y += Math.sin(ang) * 8.5 * dt;
      this.heat = Math.min(this.heat + 0.004 * dt, 1.5);
      if (Math.random() < 0.03 * dt) sfxDash();
    } else {
      this.heat = Math.max(this.heat - 0.0016 * dt, 0);
    }

    this.player.x = Phaser.Math.Clamp(this.player.x, 14, 786);
    this.player.y = Phaser.Math.Clamp(this.player.y, 14, 586);
  }

  update(time, delta) {
    if (this.dead) return;
    const dt = delta / 16.667;
    const { elapsed, e } = this.getDifficulty();

    this.bg1.tilePositionY += (0.2 + e * 0.7) * dt;

    this.handlePlayer(dt);

    this.hunters.children.each(h => {
      if (!h.active) return;
      const targetA = Phaser.Math.Angle.Between(h.x, h.y, this.player.x, this.player.y);
      const cur = h.rotation;
      h.rotation = Phaser.Math.Angle.RotateTo(cur, targetA + Math.PI/2, h.turnRate * dt);
      const moveAng = h.rotation - Math.PI/2;
      const spd = h.baseSpeed + this.heat * 26;
      h.setVelocity(Math.cos(moveAng) * spd, Math.sin(moveAng) * spd);
      if (h.x < -60 || h.x > 860 || h.y < -60 || h.y > 660) h.destroy();
    });

    this.wraiths.children.each(w => {
      if (!w.active) return;
      w.chargeTimer -= delta;
      if (w.chargeTimer <= 0) {
        const ang = Phaser.Math.Angle.Between(w.x, w.y, this.player.x, this.player.y);
        const burst = lerp(130, 300, e) + this.heat * 24;
        w.setVelocity(Math.cos(ang) * burst, Math.sin(ang) * burst);
        w.chargeTimer = Phaser.Math.Between(450, 900 - Math.floor(e * 300));
      } else {
        w.setVelocity(w.body.velocity.x * 0.98, w.body.velocity.y * 0.98);
      }
      if (w.x < -80 || w.x > 880 || w.y < -80 || w.y > 680) w.destroy();
    });

    this.shards.children.each(s => {
      if (!s.active) return;
      s.body.velocity.scale(1.001 + e * 0.002);
      if (s.x < -70 || s.x > 870 || s.y < -70 || s.y > 670) s.destroy();
    });

    this.timeAlive = elapsed;
    this.score = Math.floor(this.timeAlive * 10 + this.bonusPoints);
    this.scoreText.setText(`Score ${this.score}`);
    if (elapsed > 25) this.infoText.setText(`Heat ${this.heat.toFixed(2)} • Chrono pressure rising`);

    this.player.setRotation(this.player.body.velocity.angle() + Math.PI/2);
  }

  gameOver() {
    if (this.dead) return;
    this.dead = true;
    sfxHit(); sfxDeath();
    this.player.setTint(0xff3355);
    this.cameras.main.shake(220, 0.014);
    this.cameras.main.flash(180, 255, 80, 120, false);
    const boom = this.add.particles(this.player.x, this.player.y, 'shardTex', {
      speed: { min: 60, max: 280 }, angle: { min: 0, max: 360 }, scale: { start: 0.26, end: 0 }, lifespan: 420, quantity: 34
    });
    this.player.setActive(false).setVisible(false);

    this.time.delayedCall(500, async () => {
      this.scene.pause();
      boom.stop();
      await showGameOverUI(this.score);
    });
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: '#081326',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, GameScene]
});
</script>
</body>
</html>
