<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'/><title>Island Front: Keenan</title><link href='https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@700;900&display=swap' rel='stylesheet'><script src='https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js'></script><style>*{box-sizing:border-box}body{margin:0;background:#0a1220;overflow:hidden}#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:20;font-family:VT323}.p{background:#121936;border:2px solid #6ad4ff;color:#fff;width:min(92vw,500px);padding:14px}.p h2{font-size:44px;color:#ffd27d;margin:0}.p p{font:13px Nunito;margin:8px 0;color:#dbe9ff}button{font:26px VT323;background:#1f2d57;color:#bfe5ff;border:1px solid #6ad4ff;padding:8px 12px;cursor:pointer;margin-top:8px}input{width:100%;padding:8px;background:#0d142b;color:#fff;border:1px solid #456;font:18px VT323}.lb{max-height:170px;overflow:auto;font:12px Nunito;margin-top:8px}.lb div{display:flex;justify-content:space-between;border-bottom:1px solid #234;padding:4px 0}</style></head><body><a href='../../index.html' style='position:fixed;top:8px;left:8px;z-index:30;color:#bfe5ff;text-decoration:none;font:18px VT323;background:#121936;padding:2px 8px;border:1px solid #6ad4ff'>← Hub</a><div id='ov'><div class='p' id='panel'></div></div><script>
const GAME_ID='island-front-377f';const LEADERBOARD_API='https://game-leaderboard.mattgames.workers.dev';
async function submitScore(playerName,score){try{const r=await fetch(`${LEADERBOARD_API}/api/scores`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameId:GAME_ID,playerName,score})});return await r.json()}catch{return null}}
async function getLeaderboard(limit=10){try{const r=await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);const d=await r.json();return d.scores||[]}catch{return[]}}
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();function sfx(f=440,d=.08,v=.12,t='square'){if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}

class Menu extends Phaser.Scene{constructor(){super('Menu')}create(){const w=this.scale.width,h=this.scale.height;const g=this.add.graphics();g.fillGradientStyle(0x4eb5ff,0x4eb5ff,0x0f2b57,0x0f2b57,1);g.fillRect(0,0,w,h);this.add.text(w/2,85,'ISLAND FRONT',{fontFamily:'VT323',fontSize:90,color:'#fff'}).setOrigin(.5);this.add.text(w/2,145,'KEENAN TURLEY',{fontFamily:'VT323',fontSize:44,color:'#ffd27d'}).setOrigin(.5);this.add.text(w/2,250,'Survival defense on island shores.\nEnemies land by boat and rush inland.\nUnlock stronger weapons over time.',{fontFamily:'Nunito',fontSize:14,color:'#e8f2ff',align:'center'}).setOrigin(.5);this.add.text(w/2,560,'Move: A/D or ←/→ or drag\nGrenade: SPACE', {fontFamily:'Nunito',fontSize:14,color:'#e8f2ff',align:'center'}).setOrigin(.5);const t=this.add.text(w/2,640,'TAP / CLICK TO START',{fontFamily:'VT323',fontSize:52,color:'#fff'}).setOrigin(.5);this.tweens.add({targets:t,alpha:.25,yoyo:true,repeat:-1,duration:650});this.input.once('pointerdown',()=>{audioCtx.resume();sfx(700,.1,.15,'triangle');this.scene.start('Game')});this.input.keyboard.once('keydown',()=>{audioCtx.resume();sfx(700,.1,.15,'triangle');this.scene.start('Game')});}}

class Game extends Phaser.Scene{constructor(){super('Game')}preload(){this.load.image('hero','hero.png')}create(){this.timeStart=this.time.now;this.score=0;this.kills=0;this.wave=0;this.dead=false;this.hp=120;this.maxHp=120;this.weaponLvl=0;this.weaponName='Rifle';this.nextUnlock=35;this.quoteAt=0;this.quotes=['Laban lang!','Para sa bayan!','Tatag lang, tuloy ang laban!','Hindi tayo uurong!'];
const w=this.scale.width,h=this.scale.height;this.physics.world.setBounds(0,0,w,h);
this.add.rectangle(w/2,h/2,w,h,0x14345f); // sea
this.add.rectangle(w/2,h-180,w,360,0x2f7a52); // island land
for(let i=0;i<18;i++)this.add.rectangle(40+i*80,h-260+Math.sin(i)*8,60,6,0xd7d1a0,.8);
this.boatG=this.physics.add.group();this.enemyG=this.physics.add.group();this.bulletG=this.physics.add.group();this.ebG=this.physics.add.group();this.grenadeG=this.physics.add.group();
this.player=this.physics.add.image(w/2,h-130,'hero').setScale(0.12);this.player.body.setCircle(24,10,10);this.player.setCollideWorldBounds(true);
this.nameTag=this.add.text(this.player.x,this.player.y-58,'KEENAN TURLEY',{fontFamily:'VT323',fontSize:34,color:'#ffd27d',stroke:'#000',strokeThickness:5}).setOrigin(.5).setDepth(10);
this.quoteTxt=this.add.text(this.player.x,this.player.y-88,'',{fontFamily:'VT323',fontSize:28,color:'#fff',stroke:'#000',strokeThickness:5}).setOrigin(.5).setDepth(10);
this.keys=this.input.keyboard.addKeys('A,D,LEFT,RIGHT,SPACE');
this.pointerDown=false;this.input.on('pointerdown',p=>{this.pointerDown=true;this.pointerX=p.x});this.input.on('pointermove',p=>{if(this.pointerDown)this.pointerX=p.x});this.input.on('pointerup',()=>this.pointerDown=false);
this.physics.add.overlap(this.bulletG,this.enemyG,(b,e)=>this.hitEnemy(b,e));this.physics.add.overlap(this.grenadeG,this.enemyG,(g,e)=>this.hitEnemy(g,e,true));this.physics.add.overlap(this.player,this.ebG,(p,b)=>{b.destroy();this.takeDamage(8)});this.physics.add.overlap(this.player,this.enemyG,(p,e)=>{if(!e.hitAt||this.time.now-e.hitAt>450){e.hitAt=this.time.now;this.takeDamage(10)}});
this.spawnEvent=this.time.addEvent({delay:1400,loop:true,callback:()=>this.spawnLanding()});this.fireEvent=this.time.addEvent({delay:200,loop:true,callback:()=>this.fireAuto()});
this.hud=this.add.text(8,8,'',{fontFamily:'VT323',fontSize:28,color:'#fff',stroke:'#000',strokeThickness:4}).setDepth(20);
}
spawnLanding(){const w=this.scale.width;const x=Phaser.Math.Between(40,w-40);const b=this.boatG.create(x,-25,null).setDisplaySize(80,30).setTint(0x6b4f3a);b.vy=80;const elapsed=(this.time.now-this.timeStart)/1000;const diff=Math.min(elapsed/120,1);const count=1+Math.floor(diff*2);for(let i=0;i<count;i++){const e=this.enemyG.create(x+(i-count/2)*22,-55-i*8,null).setDisplaySize(24,24).setTint(0xe16b6b);e.type=(Math.random()<0.35&&diff>0.25)?'gunner':'banzai';e.hp=(e.type==='gunner'?28:20)*(1+diff*1.2);e.spd=(e.type==='gunner'?75:120)*(1+diff*.6);e.fireAt=0;}}
fireAuto(){if(this.dead)return;const target=this.closestEnemy();if(!target)return;const p=this.player;const base=[{name:'Rifle',dmg:14,cd:260,spread:0,count:1,speed:520},{name:'SMG',dmg:10,cd:140,spread:.06,count:1,speed:560},{name:'LMG',dmg:11,cd:90,spread:.1,count:2,speed:600},{name:'Grenade Launcher',dmg:28,cd:220,spread:.04,count:1,speed:420,explosive:true},{name:'Space Age Armor',dmg:22,cd:70,spread:.12,count:3,speed:700}][this.weaponLvl];
if(this.time.now<(this.lastShot||0)+base.cd)return;this.lastShot=this.time.now;for(let i=0;i<base.count;i++){const a=Math.atan2(target.y-p.y,target.x-p.x)+(i-(base.count-1)/2)*base.spread;const bu=this.bulletG.create(p.x,p.y-10,null).setDisplaySize(base.explosive?10:6,10).setTint(base.explosive?0xffb347:0x9fe8ff);bu.vx=Math.cos(a)*base.speed;bu.vy=Math.sin(a)*base.speed;bu.dmg=base.dmg;bu.explosive=!!base.explosive;bu.life=1400;}sfx(360,.05,.1,'square');}
closestEnemy(){let t=null,d=1e9;this.enemyG.getChildren().forEach(e=>{if(!e.active)return;const dd=Phaser.Math.Distance.Between(this.player.x,this.player.y,e.x,e.y);if(dd<d){d=dd;t=e}});return t}
hitEnemy(proj,e,explode=false){if(!proj.active||!e.active)return;const dmg=(proj.dmg||18);e.hp-=dmg;proj.destroy();if(proj.explosive||explode){this.enemyG.getChildren().forEach(n=>{if(!n.active)return;const d=Phaser.Math.Distance.Between(e.x,e.y,n.x,n.y);if(d<70)n.hp-=dmg*.55});this.cameras.main.shake(80,.004);}if(e.hp<=0){e.destroy();this.kills++;this.score+=25;sfx(520,.05,.1,'triangle');if(this.kills>=this.nextUnlock){this.weaponLvl=Math.min(4,this.weaponLvl+1);this.weaponName=['Rifle','SMG','LMG','Grenade Launcher','Space Age Armor'][this.weaponLvl];this.nextUnlock+=35+this.weaponLvl*20;this.showQuote(`UNLOCKED: ${this.weaponName}`);}}}
takeDamage(d){this.hp-=d;this.cameras.main.shake(120,.008);sfx(110,.12,.13,'sawtooth');if(this.hp<=0)this.gameOver()}
showQuote(t){this.quoteTxt.setText(t);this.quoteTxt.setAlpha(1);this.tweens.killTweensOf(this.quoteTxt);this.tweens.add({targets:this.quoteTxt,alpha:0,duration:2200,ease:'Quad.easeOut'})}
throwGrenade(){if(this.time.now<(this.gCd||0)+1800||this.dead)return;this.gCd=this.time.now;const g=this.grenadeG.create(this.player.x,this.player.y-12,null).setDisplaySize(12,12).setTint(0x7cff7c);g.vy=-320;g.life=700;sfx(240,.1,.12,'triangle')}
update(time,delta){if(this.dead)return;const dt=delta/16.667;let mx=0;if(this.keys.A.isDown||this.keys.LEFT.isDown)mx=-1;if(this.keys.D.isDown||this.keys.RIGHT.isDown)mx=1;if(this.pointerDown){mx=Math.sign(this.pointerX-this.player.x)}this.player.x=Phaser.Math.Clamp(this.player.x+mx*8*dt,24,this.scale.width-24);this.nameTag.setPosition(this.player.x,this.player.y-58);this.quoteTxt.setPosition(this.player.x,this.player.y-88);
if(Phaser.Input.Keyboard.JustDown(this.keys.SPACE))this.throwGrenade();
this.boatG.getChildren().forEach(b=>{b.y+=b.vy*dt*0.06;if(b.y>100)b.destroy()});
this.enemyG.getChildren().forEach(e=>{if(!e.active)return;e.y+=e.spd*dt*0.06;if(e.type==='gunner'){if(time>(e.fireAt||0)){e.fireAt=time+1200+Math.random()*700;const b=this.ebG.create(e.x,e.y,null).setDisplaySize(8,8).setTint(0xffd27d);const a=Math.atan2(this.player.y-e.y,this.player.x-e.x);b.vx=Math.cos(a)*260;b.vy=Math.sin(a)*260;b.life=2200;}}if(e.y>this.scale.height+20)e.destroy()});
this.bulletG.getChildren().forEach(b=>{b.x+=b.vx*dt*0.06;b.y+=b.vy*dt*0.06;b.life-=delta;if(b.life<=0||b.y<-30||b.x<-20||b.x>this.scale.width+20)b.destroy()});
this.ebG.getChildren().forEach(b=>{b.x+=(b.vx||0)*dt*0.06;b.y+=(b.vy||220)*dt*0.06;b.life-=delta;if(b.life<=0||b.y>this.scale.height+30||b.x<-20||b.x>this.scale.width+20)b.destroy()});
this.grenadeG.getChildren().forEach(g=>{g.y+=g.vy*dt*0.06;g.life-=delta;if(g.life<=0){this.hitEnemy(g,{x:g.x,y:g.y,active:true,hp:1,destroy:()=>{}},true)}});
const elapsed=(time-this.timeStart)/1000;if(time>this.quoteAt){this.showQuote(this.quotes[Math.floor(Math.random()*this.quotes.length)]);this.quoteAt=time+7000}
this.score=Math.floor(elapsed*10)+this.kills*12;
this.hud.setText(`HP ${Math.max(0,Math.ceil(this.hp))}/${this.maxHp}  Weapon: ${this.weaponName}\nKills ${this.kills}  Score ${this.score}  Next Unlock ${Math.max(0,this.nextUnlock-this.kills)}`);
}
gameOver(){if(this.dead)return;this.dead=true;this.cameras.main.shake(300,.015);sfx(90,.5,.2,'sawtooth');this.time.delayedCall(550,()=>{this.scene.pause();showGameOver(this.score,this.kills,Math.floor((this.time.now-this.timeStart)/1000),this.weaponName)})}}

new Phaser.Game({type:Phaser.AUTO,width:720,height:1280,backgroundColor:'#0a1220',physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Menu,Game]});
function showGameOver(score,kills,sec,weapon){const ov=document.getElementById('ov'),p=document.getElementById('panel');ov.style.display='flex';p.innerHTML=`<h2>Mission Over</h2><p>Score <b>${score}</b><br>Kills ${kills} • Time ${sec}s • Final Weapon: ${weapon}</p><input id='nm' maxlength='16' placeholder='name'><button id='sub'>Submit Score</button><div id='lb' class='lb'></div><button id='re'>Play Again</button>`;document.getElementById('sub').onclick=async()=>{const n=(document.getElementById('nm').value||'Anonymous').trim();await submitScore(n,score);const rows=await getLeaderboard();document.getElementById('lb').innerHTML=rows.map((r,i)=>`<div><span>#${i+1} ${r.playerName}</span><span>${r.score}</span></div>`).join('');document.getElementById('sub').style.display='none'};document.getElementById('re').onclick=()=>location.reload()}
</script></body></html>
