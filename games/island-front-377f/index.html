<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'/><title>Island Front: Side Ops</title><link href='https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@700;900&display=swap' rel='stylesheet'><script src='https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js'></script><style>*{box-sizing:border-box}body{margin:0;background:#0c1426;overflow:hidden}#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:20;font-family:VT323}.p{background:#141f3d;border:2px solid #74c0ff;color:#fff;width:min(92vw,520px);padding:14px}.p h2{font-size:44px;color:#ffd27d;margin:0}.p p{font:13px Nunito;margin:8px 0;color:#e3f1ff}button{font:28px VT323;background:#1e3564;color:#bfe5ff;border:1px solid #74c0ff;padding:8px 12px;cursor:pointer;margin-top:8px}input{width:100%;padding:8px;background:#0b1530;color:#fff;border:1px solid #456;font:18px VT323}.lb{max-height:180px;overflow:auto;font:12px Nunito;margin-top:8px}.lb div{display:flex;justify-content:space-between;border-bottom:1px solid #2a3f6f;padding:4px 0}</style></head><body><a href='../../index.html' style='position:fixed;top:8px;left:8px;z-index:30;color:#bfe5ff;text-decoration:none;font:18px VT323;background:#141f3d;padding:2px 8px;border:1px solid #74c0ff'>← Hub</a><div id='ov'><div class='p' id='panel'></div></div><script src='../../shared/supabase-config.js'></script><script src='../../shared/supabase-client.js'></script><script>
const GAME_ID='island-front-377f';
const LEADERBOARD_API=window.GAME_HUB_API_BASE;
async function submitScore(playerName,score){try{const r=await fetch(`${LEADERBOARD_API}/api/scores`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameId:GAME_ID,playerName,score})});return await r.json()}catch{return null}}
async function getLeaderboard(limit=10){try{const r=await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);const d=await r.json();return d.scores||[]}catch{return[]}}
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function sfx(f=440,d=.08,v=.12,t='square'){if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}

class Menu extends Phaser.Scene{constructor(){super('Menu')}create(){const w=this.scale.width,h=this.scale.height;const g=this.add.graphics();g.fillGradientStyle(0x5dc1ff,0x5dc1ff,0x1a4b84,0x1a4b84,1);g.fillRect(0,0,w,h);this.add.text(w/2,80,'ISLAND FRONT',{fontFamily:'VT323',fontSize:86,color:'#fff'}).setOrigin(.5);this.add.text(w/2,140,'SIDE OPS',{fontFamily:'VT323',fontSize:48,color:'#ffd27d'}).setOrigin(.5);this.add.text(w/2,230,'Style: Side-scroller run-and-gun\nDifficulty: Chill / Arcade\n\nA/D move • W jump • Click shoot • Space grenade\nCatch supply drops, survive as long as possible.',{fontFamily:'Nunito',fontSize:15,color:'#eaf6ff',align:'center'}).setOrigin(.5);const t=this.add.text(w/2,620,'CLICK TO START',{fontFamily:'VT323',fontSize:56,color:'#fff'}).setOrigin(.5);this.tweens.add({targets:t,alpha:.25,yoyo:true,repeat:-1,duration:650});this.input.once('pointerdown',()=>{audioCtx.resume();sfx(700,.1,.15,'triangle');this.scene.start('Game')});this.input.keyboard.once('keydown',()=>{audioCtx.resume();sfx(700,.1,.15,'triangle');this.scene.start('Game')});}}

class Game extends Phaser.Scene{constructor(){super('Game')}preload(){this.load.image('hero','hero.png');this.load.image('rick','rick.png')}create(){this.dead=false;this.timeStart=this.time.now;this.score=0;this.kills=0;this.wave=1;this.nextWaveAt=3500;this.weaponLvl=0;this.weaponName='Rifle';this.nextUnlock=20;this.quoteAt=0;this.quotes=['Tuloy ang depensa!','Laban!','Keenan at Rick: go!','Kapit lang!'];
const w=this.scale.width,h=this.scale.height;this.physics.world.setBounds(0,0,w,h);
// world
this.add.rectangle(w/2,h/2,w,h,0x0f2a52); // sky
this.add.rectangle(w/2,h-130,w,260,0x2f7a52); // land
for(let i=0;i<14;i++) this.add.rectangle(i*60+40,h-260,70,7,0xd8c796,.8);
for(let i=0;i<6;i++){this.add.rectangle(110+i*180,h-205,80,26,0x6f8aa3,.9);this.add.rectangle(110+i*180,h-194,64,8,0xb7cad8,.9)} // bunkers
this.groundY=h-150;

this.enemyG=this.physics.add.group();this.bulletG=this.physics.add.group();this.ebG=this.physics.add.group();this.grenadeG=this.physics.add.group();this.dropG=this.physics.add.group();

this.heroStats={hp:120,maxHp:120,speed:240,jump:-470,onGround:false};
this.player=this.physics.add.image(130,this.groundY-20,'hero').setScale(0.115);this.player.body.setCircle(22,8,8);this.player.body.setGravityY(1100);this.player.body.setCollideWorldBounds(true);
this.rick=this.physics.add.image(190,this.groundY-20,'rick').setScale(0.115);this.rick.body.setCircle(22,8,8);this.rick.body.setGravityY(1100);this.rick.body.setCollideWorldBounds(true);

this.nameTag=this.add.text(this.player.x,this.player.y-58,'KEENAN TURLEY',{fontFamily:'VT323',fontSize:32,color:'#ffd27d',stroke:'#000',strokeThickness:5}).setOrigin(.5).setDepth(10);
this.rickTag=this.add.text(this.rick.x,this.rick.y-56,'RICK GAO',{fontFamily:'VT323',fontSize:28,color:'#9be7ff',stroke:'#000',strokeThickness:5}).setOrigin(.5).setDepth(10);
this.quoteTxt=this.add.text(w/2,64,'',{fontFamily:'VT323',fontSize:30,color:'#fff',stroke:'#000',strokeThickness:5}).setOrigin(.5).setDepth(10);

this.keys=this.input.keyboard.addKeys('A,D,W,UP,SPACE');
this.input.on('pointerdown',p=>{this.pointerDown=true;this.pointerX=p.x;this.pointerY=p.y;this.shoot(this.player,p.x,p.y)});
this.input.on('pointermove',p=>{this.pointerX=p.x;this.pointerY=p.y});
this.input.on('pointerup',()=>this.pointerDown=false);

this.physics.add.overlap(this.bulletG,this.enemyG,(b,e)=>this.hitEnemy(b,e));
this.physics.add.overlap(this.grenadeG,this.enemyG,(g,e)=>this.hitEnemy(g,e,true));
this.physics.add.overlap(this.player,this.ebG,(p,b)=>{b.destroy();this.takeDamage(8)});
this.physics.add.overlap(this.player,this.enemyG,(p,e)=>{if(!e.hitAt||this.time.now-e.hitAt>500){e.hitAt=this.time.now;this.takeDamage(10)}});
this.physics.add.overlap(this.player,this.dropG,(p,d)=>{this.collectDrop(d)});

this.hud=this.add.text(10,8,'',{fontFamily:'VT323',fontSize:28,color:'#fff',stroke:'#000',strokeThickness:4}).setDepth(20);
}

spawnWave(){const h=this.scale.height;const base=Math.min(18,3+Math.floor(this.wave*1.2));
  for(let i=0;i<base;i++){
    const x=this.scale.width+30+Math.random()*220;
    const y=this.groundY-20;
    const t=Math.random();
    const e=this.enemyG.create(x,y,null).setDisplaySize(30,30);
    if(t<0.58){e.type='charger';e.setTint(0xe16b6b);e.hp=24+this.wave*4;e.spd=130+this.wave*5;}
    else if(t<0.88){e.type='gunner';e.setTint(0xffd27d);e.hp=36+this.wave*5;e.spd=90+this.wave*3;e.fireAt=0;}
    else{e.type='heavy';e.setTint(0xb388ff);e.hp=70+this.wave*8;e.spd=70+this.wave*2;e.fireAt=0;}
    e.body.setSize(24,24,true);e.body.setAllowGravity(false);
  }
  // amphibious craft visual at edge
  const boat=this.add.rectangle(this.scale.width-20,this.groundY+22,110,34,0x70543f).setStrokeStyle(2,0x9b7a5a);
  this.tweens.add({targets:boat,x:this.scale.width-120,duration:850,yoyo:true,onComplete:()=>boat.destroy()});
}

shoot(shooter,tx,ty){if(this.dead)return;const base=[{name:'Rifle',dmg:16,cd:220,count:1,spread:0,speed:620},{name:'SMG',dmg:10,cd:120,count:1,spread:.04,speed:640},{name:'LMG',dmg:12,cd:90,count:2,spread:.08,speed:680},{name:'Grenade Launcher',dmg:30,cd:240,count:1,spread:0,speed:430,explosive:true},{name:'Space Age Armor',dmg:24,cd:70,count:3,spread:.12,speed:760}][this.weaponLvl];
  if(this.time.now < ((shooter===this.player?this.pCd:this.rCd)||0)+base.cd)return;
  if(shooter===this.player)this.pCd=this.time.now; else this.rCd=this.time.now;
  for(let i=0;i<base.count;i++){
    const a=Math.atan2(ty-shooter.y,tx-shooter.x)+(i-(base.count-1)/2)*base.spread;
    const b=this.bulletG.create(shooter.x,shooter.y-6,null).setDisplaySize(base.explosive?11:7,10).setTint(base.explosive?0x7cff7c:0x9fe8ff);
    b.vx=Math.cos(a)*base.speed; b.vy=Math.sin(a)*base.speed; b.life=1400; b.dmg=base.dmg; b.explosive=!!base.explosive;
  }
  sfx(360,.05,.1,'square');
}

throwGrenade(){if(this.time.now<(this.gCd||0)+1700||this.dead)return;this.gCd=this.time.now;const g=this.grenadeG.create(this.player.x,this.player.y-16,null).setDisplaySize(12,12).setTint(0x7cff7c);g.vx=260;g.vy=-260;g.life=950;sfx(240,.1,.12,'triangle')}

hitEnemy(proj,e,explode=false){if(!proj.active||!e.active)return;const dmg=proj.dmg||18;e.hp-=dmg;proj.destroy();if(proj.explosive||explode){this.enemyG.getChildren().forEach(n=>{if(!n.active)return;const d=Phaser.Math.Distance.Between(e.x,e.y,n.x,n.y);if(d<84)n.hp-=dmg*.6});this.cameras.main.shake(90,.004)}if(e.hp<=0){this.kills++;this.score+=28;e.destroy();sfx(520,.05,.1,'triangle');if(Math.random()<0.11)this.spawnDrop(e.x,e.y);if(this.kills>=this.nextUnlock){this.weaponLvl=Math.min(4,this.weaponLvl+1);this.weaponName=['Rifle','SMG','LMG','Grenade Launcher','Space Age Armor'][this.weaponLvl];this.nextUnlock+=24+this.weaponLvl*18;this.say(`UNLOCKED: ${this.weaponName}`)}}}

spawnDrop(x,y){const d=this.dropG.create(x,y,null).setDisplaySize(14,14).setTint(Math.random()<.5?0xffd27d:0x7cff7c);d.kind=Math.random()<.5?'heal':'armor';d.vx=-120;d.vy=-40;d.life=2600}
collectDrop(d){if(d.kind==='heal'){this.heroStats.hp=Math.min(this.heroStats.maxHp,this.heroStats.hp+28);this.say('+HEAL')}else{this.heroStats.maxHp+=8;this.heroStats.hp=Math.min(this.heroStats.maxHp,this.heroStats.hp+8);this.say('+ARMOR')}d.destroy();sfx(780,.08,.12,'triangle')}

takeDamage(v){this.heroStats.hp-=v;this.cameras.main.shake(130,.008);sfx(110,.12,.13,'sawtooth');if(this.heroStats.hp<=0)this.gameOver()}
say(t){this.quoteTxt.setText(t);this.quoteTxt.setAlpha(1);this.tweens.killTweensOf(this.quoteTxt);this.tweens.add({targets:this.quoteTxt,alpha:0,duration:1900,ease:'Quad.easeOut'})}

update(time,delta){if(this.dead)return;const dt=delta/16.667;
  // hero movement/jump
  let vx=0;if(this.keys.A.isDown)vx=-this.heroStats.speed;if(this.keys.D.isDown)vx=this.heroStats.speed;this.player.body.setVelocityX(vx);
  const canJump=this.player.y>=this.groundY-20; if((Phaser.Input.Keyboard.JustDown(this.keys.W)||Phaser.Input.Keyboard.JustDown(this.keys.UP))&&canJump){this.player.body.setVelocityY(this.heroStats.jump);sfx(280,.06,.1,'triangle')}
  if(Phaser.Input.Keyboard.JustDown(this.keys.SPACE))this.throwGrenade();

  // ground clamp
  if(this.player.y>this.groundY-20){this.player.y=this.groundY-20;this.player.body.setVelocityY(0)}

  // ally follow + fire support
  this.rick.x += (this.player.x+72-this.rick.x)*0.14; if(this.rick.y>this.groundY-20)this.rick.y=this.groundY-20;
  const et=this.closestEnemy(); if(et){this.shoot(this.rick,et.x,et.y)}

  // player autofire toward pointer/nearest
  if(this.pointerDown&&this.pointerX!=null)this.shoot(this.player,this.pointerX,this.pointerY||this.player.y-100); else {const t=this.closestEnemy(); if(t)this.shoot(this.player,t.x,t.y)}

  // enemies move/fire
  this.enemyG.getChildren().forEach(e=>{if(!e.active)return;e.x-=e.spd*dt*0.06;if(e.type!=='charger'&&time>(e.fireAt||0)){e.fireAt=time+(e.type==='heavy'?750:1200)+Math.random()*450;const b=this.ebG.create(e.x,e.y-4,null).setDisplaySize(e.type==='heavy'?10:8,8).setTint(e.type==='heavy'?0xb388ff:0xffd27d);const a=Math.atan2(this.player.y-e.y,this.player.x-e.x);const sp=e.type==='heavy'?330:270;b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;b.life=2200;}if(e.x<-40){e.destroy();this.takeDamage(6)}});

  // projectiles
  this.bulletG.getChildren().forEach(b=>{b.x+=b.vx*dt*0.06;b.y+=b.vy*dt*0.06;b.life-=delta;if(b.life<=0||b.x<-20||b.x>this.scale.width+20||b.y<-30||b.y>this.scale.height+30)b.destroy()});
  this.ebG.getChildren().forEach(b=>{b.x+=(b.vx||0)*dt*0.06;b.y+=(b.vy||0)*dt*0.06;b.life-=delta;if(b.life<=0||b.x<-20||b.x>this.scale.width+20||b.y<-20||b.y>this.scale.height+20)b.destroy()});
  this.grenadeG.getChildren().forEach(g=>{g.x+=g.vx*dt*0.06;g.y+=g.vy*dt*0.06;g.vy+=18*dt;g.life-=delta;if(g.life<=0){this.hitEnemy(g,{x:g.x,y:g.y,active:true,hp:1,destroy:()=>{}},true)}});
  this.dropG.getChildren().forEach(d=>{d.x+=d.vx*dt*0.06;d.y+=d.vy*dt*0.06;d.vy+=7*dt;d.life-=delta;if(d.life<=0||d.x<-20)d.destroy()});

  // spawn waves
  if(time>this.nextWaveAt){this.wave++;this.spawnWave();this.nextWaveAt=time+Math.max(2200,3600-this.wave*80)}

  const elapsed=(time-this.timeStart)/1000; if(time>this.quoteAt){this.say(this.quotes[Math.floor(Math.random()*this.quotes.length)]);this.quoteAt=time+7000}
  this.score=Math.floor(elapsed*10)+this.kills*12;

  this.nameTag.setPosition(this.player.x,this.player.y-58);this.rickTag.setPosition(this.rick.x,this.rick.y-56);
  this.hud.setText(`HP ${Math.max(0,Math.ceil(this.heroStats.hp))}/${this.heroStats.maxHp}  Weapon: ${this.weaponName}\nWave ${this.wave}  Kills ${this.kills}  Score ${this.score}  Next ${Math.max(0,this.nextUnlock-this.kills)}`);
}
closestEnemy(){let t=null,d=1e9;this.enemyG.getChildren().forEach(e=>{if(!e.active)return;const dd=Phaser.Math.Distance.Between(this.player.x,this.player.y,e.x,e.y);if(dd<d){d=dd;t=e}});return t}

gameOver(){if(this.dead)return;this.dead=true;this.cameras.main.shake(300,.015);sfx(90,.5,.2,'sawtooth');this.time.delayedCall(550,()=>{this.scene.pause();showGameOver(this.score,this.kills,Math.floor((this.time.now-this.timeStart)/1000),this.weaponName)})}}

new Phaser.Game({type:Phaser.AUTO,width:1280,height:720,backgroundColor:'#0c1426',physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Menu,Game]});
function showGameOver(score,kills,sec,weapon){const ov=document.getElementById('ov'),p=document.getElementById('panel');ov.style.display='flex';p.innerHTML=`<h2>Mission Over</h2><p>Score <b>${score}</b><br>Kills ${kills} • Time ${sec}s • Final Weapon: ${weapon}</p><input id='nm' maxlength='16' placeholder='name'><button id='sub'>Submit Score</button><div id='lb' class='lb'></div><button id='re'>Play Again</button>`;document.getElementById('sub').onclick=async()=>{const n=(document.getElementById('nm').value||'Anonymous').trim();await submitScore(n,score);const rows=await getLeaderboard();document.getElementById('lb').innerHTML=rows.map((r,i)=>`<div><span>#${i+1} ${r.playerName}</span><span>${r.score}</span></div>`).join('');document.getElementById('sub').style.display='none'};document.getElementById('re').onclick=()=>location.reload()}
</script></body></html>
