<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Last Pixel: Terminal Fade</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 20%, #1e3a5f 0%, #0a1628 55%, #060d1a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      font-family: 'VT323', monospace;
      color: #d6f6ff;
    }
    #ui-overlay {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(2, 8, 20, 0.82);
      z-index: 10;
    }
    .panel {
      width: min(92vw, 460px);
      border: 2px solid #48cae4;
      background: rgba(9, 20, 42, 0.96);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 0 28px rgba(72, 202, 228, 0.3);
    }
    h2 { font-size: 38px; letter-spacing: 1px; margin-bottom: 10px; }
    p, li, input, button { font-size: 28px; }
    #final-score { color: #90e0ef; margin-bottom: 10px; }
    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 2px solid #48cae4;
      border-radius: 8px;
      background: #08152a;
      color: #e8fbff;
      outline: none;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      margin-right: 8px;
      cursor: pointer;
      background: #00b4d8;
      color: #02101f;
      font-family: 'VT323', monospace;
    }
    button:hover { filter: brightness(1.1); }
    #leaderboard { margin-top: 10px; max-height: 180px; overflow: auto; }
    #leaderboard li { list-style: decimal inside; color: #caf7ff; }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div class="panel">
      <h2>Screen Dead</h2>
      <p id="final-score">Score: 0</p>
      <input id="name-input" maxlength="20" placeholder="your name" />
      <div>
        <button id="submit-btn">Submit Score</button>
        <button id="replay-btn">Play Again</button>
      </div>
      <ol id="leaderboard"></ol>
    </div>
  </div>

<script>
/*
DESIGN HEADER
- Controls: Arrow/WASD move the last pixel; touch/drag anywhere to steer toward pointer.
- Core loop/death: Survive in a dying monitor while glitches, sweep-lines, and blackout blocks intensify; die on hazard hit.
- Hazards: (1) drifting glitch shards, (2) horizontal/vertical sweep lines, (3) expanding dead zones.
- Pickups/risk-reward: charge motes (+bonus points) and overclock orbs (+bigger bonus + temporary speed boost but increased hazard spawn pressure).
- Scoring: score = Math.floor(timeAlive*10 + bonusPoints), monotonic.
- Difficulty: smooth easing over 120s to ramp spawn rate/speeds/density.
- Visual: Ocean/cool CRT decay palette, scanline shimmer, bubble-noise particles, VT323 retro terminal font.
- Audio: soft triangle pickups, buzzing sawtooth hits, descending death tones.
*/
const GAME_ID = 'last-pixel-terminal-fade-9a4f';
const LEADERBOARD_API = 'https://game-leaderboard.mattgames.workers.dev';

async function submitScore(playerName, score) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gameId: GAME_ID, playerName, score })
    });
    return await res.json();
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return null;
  }
}

async function getLeaderboard(limit = 10) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);
    const data = await res.json();
    return data.scores || [];
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return [];
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type, freq, duration, volume = 0.25, rampTo = 0.001) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(rampTo, audioCtx.currentTime + duration);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
const sfxStart = () => { playSound('triangle', 360, 0.08, 0.2); playSound('triangle', 520, 0.12, 0.15); };
const sfxCollect = () => { playSound('triangle', 720, 0.08, 0.2); playSound('triangle', 1080, 0.1, 0.14); };
const sfxOverclock = () => { playSound('square', 260, 0.08, 0.22); playSound('square', 520, 0.12, 0.2); playSound('square', 840, 0.12, 0.15); };
const sfxHit = () => { playSound('sawtooth', 190, 0.2, 0.22); };
const sfxDeath = () => { playSound('sawtooth', 280, 0.2, 0.25); playSound('sawtooth', 160, 0.25, 0.2); playSound('sawtooth', 80, 0.45, 0.2); };

function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

let currentScene = null;

class MenuScene extends Phaser.Scene {
  constructor() { super('MenuScene'); }

  create() {
    const { width, height } = this.scale;
    this.add.text(width / 2, height * 0.25, 'LAST PIXEL', { fontFamily: 'VT323', fontSize: '72px', color: '#90e0ef' }).setOrigin(0.5);
    this.add.text(width / 2, height * 0.34, 'TERMINAL FADE', { fontFamily: 'VT323', fontSize: '46px', color: '#48cae4' }).setOrigin(0.5);
    this.add.text(width / 2, height * 0.52,
      'Move: WASD / ARROWS / TOUCH\nAvoid glitches + sweep lines + dead zones\nCollect motes, risk overclock for big score\nSurvive as long as the screen decays',
      { align: 'center', fontFamily: 'VT323', fontSize: '30px', color: '#caf7ff' }).setOrigin(0.5);

    const blink = this.add.text(width / 2, height * 0.84, 'TAP OR PRESS ANY KEY', { fontFamily: 'VT323', fontSize: '40px', color: '#00b4d8' }).setOrigin(0.5);
    this.tweens.add({ targets: blink, alpha: 0.2, duration: 600, yoyo: true, repeat: -1 });

    const begin = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      sfxStart();
      this.scene.start('GameScene');
    };

    this.input.once('pointerdown', begin);
    this.input.keyboard.once('keydown', begin);
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    currentScene = this;
    this.dead = false;
    this.gameStartTime = this.time.now;
    this.bonusPoints = 0;
    this.score = 0;
    this.prevScore = 0;
    this.overclockUntil = 0;
    this.touchTarget = null;

    const { width, height } = this.scale;

    this.bgStars = this.add.group();
    for (let i = 0; i < 90; i++) {
      const p = this.add.circle(Phaser.Math.Between(0, width), Phaser.Math.Between(0, height), Phaser.Math.Between(1, 2), 0x90e0ef, Phaser.Math.FloatBetween(0.08, 0.35));
      this.bgStars.add(p);
    }

    this.scanLines = this.add.tileSprite(width / 2, height / 2, width, height, null).setAlpha(0.06);
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xffffff, 1);
    g.fillRect(0, 0, 2, 1);
    g.generateTexture('line', 2, 1);

    const art = this.make.graphics({ x: 0, y: 0, add: false });
    art.fillStyle(0x48cae4, 1); art.fillRect(6, 6, 20, 20);
    art.fillStyle(0xffffff, 0.65); art.fillRect(11, 11, 7, 7);
    art.lineStyle(2, 0x00b4d8, 1); art.strokeRect(5, 5, 22, 22);
    art.generateTexture('playerPix', 32, 32); art.clear();

    art.fillStyle(0xff6b6b, 1); art.fillTriangle(16, 2, 30, 30, 2, 30);
    art.fillStyle(0xffffff, 0.35); art.fillCircle(14, 16, 4);
    art.generateTexture('glitchShard', 32, 32); art.clear();

    art.fillStyle(0x90e0ef, 1); art.fillCircle(12, 12, 10);
    art.fillStyle(0xffffff, 0.7); art.fillCircle(8, 8, 4);
    art.generateTexture('mote', 24, 24); art.clear();

    art.fillStyle(0xf9c74f, 1); art.fillCircle(16, 16, 13);
    art.lineStyle(3, 0xfff3c4, 1); art.strokeCircle(16, 16, 11);
    art.fillStyle(0xff9f1c, 1); art.fillCircle(16, 16, 5);
    art.generateTexture('overclock', 32, 32); art.destroy();

    this.player = this.physics.add.sprite(width * 0.5, height * 0.6, 'playerPix');
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(20, 20).setOffset(6, 6);

    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D');

    this.input.on('pointerdown', p => { this.touchTarget = { x: p.worldX, y: p.worldY }; });
    this.input.on('pointermove', p => { if (p.isDown) this.touchTarget = { x: p.worldX, y: p.worldY }; });
    this.input.on('pointerup', () => { this.touchTarget = null; });

    this.glitches = this.physics.add.group();
    this.lines = this.physics.add.group();
    this.deadzones = this.physics.add.group();
    this.motes = this.physics.add.group();
    this.orbs = this.physics.add.group();

    this.physics.add.overlap(this.player, this.glitches, () => this.gameOver(), null, this);
    this.physics.add.overlap(this.player, this.lines, () => this.gameOver(), null, this);
    this.physics.add.overlap(this.player, this.deadzones, () => this.gameOver(), null, this);
    this.physics.add.overlap(this.player, this.motes, (player, mote) => {
      mote.destroy();
      this.bonusPoints += 30;
      sfxCollect();
      this.popText('+30', player.x, player.y - 18, '#90e0ef');
    }, null, this);
    this.physics.add.overlap(this.player, this.orbs, (player, orb) => {
      orb.destroy();
      this.bonusPoints += 90;
      this.overclockUntil = this.time.now + 4500;
      sfxOverclock();
      this.popText('OVERCLOCK +90', player.x, player.y - 22, '#ffd166');
    }, null, this);

    this.scoreText = this.add.text(16, 12, 'SCORE 0', { fontFamily: 'VT323', fontSize: '38px', color: '#caf7ff' }).setDepth(20);
    this.stateText = this.add.text(16, 48, 'STABLE', { fontFamily: 'VT323', fontSize: '30px', color: '#48cae4' }).setDepth(20);

    this.hazardTimer = 0;
    this.lineTimer = 0;
    this.deadzoneTimer = 0;
    this.pickupTimer = 0;
    this.orbTimer = 0;

    this.burst = this.add.particles(0, 0, 'mote', {
      lifespan: 450,
      speed: { min: 50, max: 220 },
      scale: { start: 0.5, end: 0 },
      alpha: { start: 0.9, end: 0 },
      quantity: 10,
      emitting: false
    });
  }

  popText(txt, x, y, color) {
    const t = this.add.text(x, y, txt, { fontFamily: 'VT323', fontSize: '28px', color }).setOrigin(0.5);
    this.tweens.add({ targets: t, y: y - 26, alpha: 0, duration: 520, ease: 'Quad.easeOut', onComplete: () => t.destroy() });
  }

  spawnGlitch(speedScale) {
    const { width, height } = this.scale;
    const side = Phaser.Math.Between(0, 3);
    let x, y, vx, vy;
    const base = lerp(60, 210, speedScale) * (this.time.now < this.overclockUntil ? 1.25 : 1);
    if (side === 0) { x = -24; y = Phaser.Math.Between(20, height - 20); vx = Phaser.Math.Between(base * 0.8, base); vy = Phaser.Math.Between(-base * 0.45, base * 0.45); }
    if (side === 1) { x = width + 24; y = Phaser.Math.Between(20, height - 20); vx = -Phaser.Math.Between(base * 0.8, base); vy = Phaser.Math.Between(-base * 0.45, base * 0.45); }
    if (side === 2) { x = Phaser.Math.Between(20, width - 20); y = -24; vx = Phaser.Math.Between(-base * 0.45, base * 0.45); vy = Phaser.Math.Between(base * 0.8, base); }
    if (side === 3) { x = Phaser.Math.Between(20, width - 20); y = height + 24; vx = Phaser.Math.Between(-base * 0.45, base * 0.45); vy = -Phaser.Math.Between(base * 0.8, base); }

    const s = this.glitches.create(x, y, 'glitchShard');
    s.setVelocity(vx, vy);
    s.setAngularVelocity(Phaser.Math.Between(-160, 160));
    s.body.setCircle(10, 6, 6);
  }

  spawnSweepLine(speedScale) {
    const { width, height } = this.scale;
    const horizontal = Math.random() < 0.5;
    const speed = lerp(120, 280, speedScale);
    let line;
    if (horizontal) {
      const fromTop = Math.random() < 0.5;
      line = this.lines.create(fromTop ? -30 : width + 30, Phaser.Math.Between(40, height - 40), 'line');
      line.setDisplaySize(60, 8);
      line.setTint(0xf94144);
      line.body.setSize(54, 5).setOffset(3, 1);
      line.setVelocityX(fromTop ? speed : -speed);
    } else {
      const fromLeft = Math.random() < 0.5;
      line = this.lines.create(Phaser.Math.Between(40, width - 40), fromLeft ? -30 : height + 30, 'line');
      line.setDisplaySize(8, 60);
      line.setTint(0xf3722c);
      line.body.setSize(5, 54).setOffset(1, 3);
      line.setVelocityY(fromLeft ? speed : -speed);
    }
  }

  spawnDeadzone(scaleT) {
    const { width, height } = this.scale;
    const dz = this.add.rectangle(Phaser.Math.Between(60, width - 60), Phaser.Math.Between(60, height - 60), 32, 32, 0x03080f, 0.8);
    this.physics.add.existing(dz);
    dz.body.setImmovable(true);
    dz.body.setSize(26, 26).setOffset(3, 3);
    this.deadzones.add(dz);
    const target = lerp(44, 96, scaleT);
    this.tweens.add({
      targets: dz,
      width: target,
      height: target,
      alpha: 0.92,
      duration: 1300,
      yoyo: true,
      repeat: 1,
      onUpdate: () => {
        if (dz.body) {
          dz.body.setSize(dz.width * 0.8, dz.height * 0.8);
          dz.body.setOffset(dz.width * 0.1, dz.height * 0.1);
        }
      },
      onComplete: () => dz.destroy()
    });
  }

  spawnMote() {
    const { width, height } = this.scale;
    const m = this.motes.create(Phaser.Math.Between(24, width - 24), Phaser.Math.Between(24, height - 24), 'mote');
    m.body.setCircle(8, 4, 4);
    this.tweens.add({ targets: m, scale: 1.22, duration: 350, yoyo: true, repeat: -1 });
    this.time.delayedCall(4200, () => m.destroy());
  }

  spawnOverclock() {
    const { width, height } = this.scale;
    const o = this.orbs.create(Phaser.Math.Between(30, width - 30), Phaser.Math.Between(30, height - 30), 'overclock');
    o.body.setCircle(11, 5, 5);
    this.tweens.add({ targets: o, angle: 360, duration: 900, repeat: -1 });
    this.tweens.add({ targets: o, scale: 1.18, duration: 260, yoyo: true, repeat: -1 });
    this.time.delayedCall(2600, () => o.destroy());
  }

  update(time, delta) {
    if (this.dead) return;
    const dt = delta / 16.667;
    const elapsed = (time - this.gameStartTime) / 1000;
    const t = Phaser.Math.Clamp(elapsed / 120, 0, 1);
    const diff = easeInOut(t);

    const baseMove = lerp(130, 250, diff);
    const move = baseMove * (time < this.overclockUntil ? 1.2 : 1);

    let mx = 0, my = 0;
    if (this.cursors.left.isDown || this.keys.A.isDown) mx -= 1;
    if (this.cursors.right.isDown || this.keys.D.isDown) mx += 1;
    if (this.cursors.up.isDown || this.keys.W.isDown) my -= 1;
    if (this.cursors.down.isDown || this.keys.S.isDown) my += 1;

    if (this.touchTarget) {
      const dx = this.touchTarget.x - this.player.x;
      const dy = this.touchTarget.y - this.player.y;
      const mag = Math.hypot(dx, dy);
      if (mag > 8) {
        mx += dx / mag;
        my += dy / mag;
      }
    }

    const mMag = Math.hypot(mx, my) || 1;
    this.player.setVelocity((mx / mMag) * move, (my / mMag) * move);

    this.bgStars.children.iterate(star => {
      if (!star) return;
      star.y += (0.25 + (star.alpha || 0.1) * 0.9) * dt * (1 + diff);
      if (star.y > this.scale.height + 2) {
        star.y = -2;
        star.x = Phaser.Math.Between(0, this.scale.width);
      }
    });

    this.hazardTimer += delta;
    this.lineTimer += delta;
    this.deadzoneTimer += delta;
    this.pickupTimer += delta;
    this.orbTimer += delta;

    const glitchInterval = lerp(1200, 330, diff) * (time < this.overclockUntil ? 0.85 : 1);
    const lineInterval = lerp(3400, 1100, diff);
    const deadzoneInterval = lerp(6200, 1800, diff);

    if (this.hazardTimer >= glitchInterval) { this.hazardTimer = 0; this.spawnGlitch(diff); }
    if (this.lineTimer >= lineInterval) { this.lineTimer = 0; this.spawnSweepLine(diff); }
    if (this.deadzoneTimer >= deadzoneInterval) { this.deadzoneTimer = 0; this.spawnDeadzone(diff); }

    if (this.pickupTimer >= 1750) { this.pickupTimer = 0; this.spawnMote(); }
    if (this.orbTimer >= lerp(12500, 8200, diff)) { this.orbTimer = 0; this.spawnOverclock(); }

    this.glitches.children.iterate(g => {
      if (!g) return;
      if (g.x < -60 || g.x > this.scale.width + 60 || g.y < -60 || g.y > this.scale.height + 60) g.destroy();
    });
    this.lines.children.iterate(l => {
      if (!l) return;
      if (l.x < -90 || l.x > this.scale.width + 90 || l.y < -90 || l.y > this.scale.height + 90) l.destroy();
    });

    const bonusPoints = this.bonusPoints;
    const rawScore = Math.floor(elapsed * 10 + bonusPoints);
    this.score = Math.max(this.prevScore, rawScore);
    this.prevScore = this.score;

    this.scoreText.setText(`SCORE ${this.score}`);
    const overclocking = time < this.overclockUntil;
    this.stateText.setText(overclocking ? 'OVERCLOCKED' : (diff < 0.45 ? 'STABLE' : diff < 0.8 ? 'DEGRADING' : 'CRITICAL'));
    this.stateText.setColor(overclocking ? '#ffd166' : (diff < 0.45 ? '#48cae4' : diff < 0.8 ? '#f8961e' : '#f94144'));

    if (overclocking && Phaser.Math.Between(0, 100) < 12) {
      this.burst.setPosition(this.player.x, this.player.y);
      this.burst.explode(1);
    }
  }

  gameOver() {
    if (this.dead) return;
    this.dead = true;
    sfxHit();
    sfxDeath();
    this.player.setTint(0xffffff);
    this.cameras.main.shake(220, 0.012);
    this.cameras.main.flash(220, 180, 220, 255);
    this.burst.setPosition(this.player.x, this.player.y);
    this.burst.explode(26);
    this.player.setVelocity(0, 0);

    this.time.delayedCall(500, () => {
      this.scene.pause();
      showGameOverUI(this.score);
    });
  }
}

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: '#08142a',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, GameScene]
};

const game = new Phaser.Game(config);

const overlay = document.getElementById('ui-overlay');
const finalScoreEl = document.getElementById('final-score');
const nameInput = document.getElementById('name-input');
const submitBtn = document.getElementById('submit-btn');
const replayBtn = document.getElementById('replay-btn');
const leaderboardEl = document.getElementById('leaderboard');

let latestScore = 0;

async function renderLeaderboard() {
  const rows = await getLeaderboard(10);
  leaderboardEl.innerHTML = '';
  if (!rows.length) {
    const li = document.createElement('li');
    li.textContent = 'No signal records yet.';
    leaderboardEl.appendChild(li);
    return;
  }
  rows.forEach((r) => {
    const li = document.createElement('li');
    li.textContent = `${r.playerName || 'anon'} — ${r.score}`;
    leaderboardEl.appendChild(li);
  });
}

function showGameOverUI(finalScore) {
  latestScore = finalScore;
  finalScoreEl.textContent = `Score: ${finalScore}`;
  overlay.style.display = 'flex';
  nameInput.value = '';
  nameInput.focus();
  renderLeaderboard();
}

submitBtn.addEventListener('click', async () => {
  const playerName = (nameInput.value || 'anon').trim().slice(0, 20) || 'anon';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';
  await submitScore(playerName, latestScore);
  await renderLeaderboard();
  submitBtn.disabled = false;
  submitBtn.textContent = 'Submit Score';
});

replayBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  if (currentScene) currentScene.scene.restart();
});
</script>
</body>
</html>
