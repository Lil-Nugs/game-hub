<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>RageLoad: 99% Forever</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #101010, #1d1d1d);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      font-family: 'Rajdhani', sans-serif;
      color: #f4f4f4;
    }
    #ui-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      z-index: 10;
    }
    .panel {
      width: min(92vw, 420px);
      background: #151515;
      border: 2px solid #ff8a00;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
    }
    h2 { font-size: 32px; margin-bottom: 6px; color: #ffb454; }
    .score { font-size: 26px; margin-bottom: 12px; }
    input, button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 20px;
      font-family: 'Rajdhani', sans-serif;
      margin-top: 8px;
    }
    input { background: #262626; color: #fff; border: 1px solid #4a4a4a; }
    button { background: #ff8a00; color: #111; font-weight: 700; cursor: pointer; }
    button.secondary { background: #3b3b3b; color: #fff; }
    #leaderboard { margin-top: 12px; font-size: 18px; max-height: 180px; overflow: auto; }
    #leaderboard li { margin-left: 20px; }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div class="panel">
      <h2>Rage Clicked.</h2>
      <div id="final-score" class="score">Score: 0</div>
      <input id="name-input" maxlength="20" placeholder="Your name" />
      <button id="submit-btn">Submit Score</button>
      <ol id="leaderboard"></ol>
      <button id="replay-btn" class="secondary">Play Again</button>
    </div>
  </div>

<script>
const GAME_ID = 'loading-bar-rageclick-e311';
const LEADERBOARD_API = 'https://game-leaderboard.mattgames.workers.dev';

async function submitScore(playerName, score) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gameId: GAME_ID, playerName, score })
    });
    return await res.json();
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return null;
  }
}

async function getLeaderboard(limit = 10) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);
    const data = await res.json();
    return data.scores || [];
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return [];
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type, freq, duration, volume, rampTo = 0.001) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(volume || 0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(rampTo, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
const sfxStart = () => { playSound('triangle', 380, 0.12, 0.2); playSound('triangle', 520, 0.14, 0.15); };
const sfxCollect = () => { playSound('sine', 760, 0.09, 0.22); playSound('sine', 980, 0.1, 0.16); };
const sfxHit = () => { playSound('sawtooth', 150, 0.22, 0.3); };
const sfxDeath = () => { playSound('square', 280, 0.2, 0.25); playSound('sawtooth', 90, 0.7, 0.2); };

let currentScene = null;
let finalScoreGlobal = 0;

function renderLeaderboard(scores) {
  const list = document.getElementById('leaderboard');
  if (!scores.length) {
    list.innerHTML = '<li>Leaderboard offline or empty</li>';
    return;
  }
  list.innerHTML = scores.map((s, i) => `<li>#${i + 1} ${s.playerName}: ${s.score}</li>`).join('');
}

async function showGameOverUI(finalScore) {
  finalScoreGlobal = finalScore;
  document.getElementById('final-score').textContent = `Score: ${finalScore}`;
  document.getElementById('ui-overlay').style.display = 'flex';
  const scores = await getLeaderboard(10);
  renderLeaderboard(scores);
}

class MenuScene extends Phaser.Scene {
  constructor() { super('MenuScene'); }
  create() {
    const { width, height } = this.scale;
    const g = this.add.graphics();
    g.fillGradientStyle(0x0f0f0f, 0x0f0f0f, 0x2a2a2a, 0x2a2a2a, 1);
    g.fillRect(0, 0, width, height);

    this.add.text(width/2, height * 0.28, 'RageLoad: 99% Forever', { fontFamily: 'Rajdhani', fontSize: '52px', color: '#ffb454' }).setOrigin(0.5);
    this.add.text(width/2, height * 0.46,
      'You are the loading bar.\nCatch data packets, dodge rage-clicks.\nMove: A/D or ←/→ or drag/touch\nOverclock: Hold SPACE (risky, faster progress)',
      { align: 'center', fontFamily: 'Rajdhani', fontSize: '28px', color: '#e8e8e8' }).setOrigin(0.5);

    const startText = this.add.text(width/2, height * 0.78, 'Tap or Press Any Key', { fontFamily: 'Rajdhani', fontSize: '36px', color: '#ffffff' }).setOrigin(0.5);
    this.tweens.add({ targets: startText, alpha: 0.3, duration: 650, yoyo: true, repeat: -1 });

    const start = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      sfxStart();
      this.scene.start('GameScene');
    };
    this.input.once('pointerdown', start);
    this.input.keyboard.once('keydown', start);
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    currentScene = this;
    this.isDead = false;
    this.gameStartTime = this.time.now;
    this.timeAlive = 0;
    this.bonusPoints = 0;
    this.integrity = 100;
    this.overclock = 0;
    this.pointerX = this.scale.width / 2;

    // DESIGN HEADER:
    // Controls: A/D or arrows, touch/drag for movement, hold SPACE for overclock.
    // Loop/Death: stay alive while filling progress and avoiding clicks; death at integrity <= 0.
    // Hazards: falling rage-cursor clicks, horizontal sweep-beam, burst spam clusters.
    // Pickups/Risk: blue cache packets (+bonus) and volatile packets (+big bonus + overclock spike risk).
    // Scoring: score = floor(timeAlive*10 + bonusPoints), monotonic and always rising over time.
    // Difficulty: smooth time curve over ~120s scaling spawn rate, speed, burst chance, sweep speed.
    // Visual: monochrome OS theme with orange warning accents, moving scanlines and shake/flash on damage.
    // Audio: UI-like beeps for collect/start, harsh saw hit/death tones.

    this.makeTextures();

    this.bg = this.add.tileSprite(400, 300, 800, 600, 'scan');
    this.bg.setAlpha(0.18);

    this.player = this.physics.add.sprite(400, 540, 'bar');
    this.player.setImmovable(true);
    this.player.body.setSize(84, 20).setOffset(6, 5);

    this.clicks = this.physics.add.group();
    this.packets = this.physics.add.group();
    this.sweeps = this.physics.add.group();

    this.physics.add.overlap(this.player, this.clicks, this.hitHazard, null, this);
    this.physics.add.overlap(this.player, this.sweeps, this.hitHazard, null, this);
    this.physics.add.overlap(this.player, this.packets, this.collectPacket, null, this);

    this.keys = this.input.keyboard.addKeys('LEFT,RIGHT,A,D,SPACE');
    this.input.on('pointermove', (p) => { this.pointerX = p.x; });
    this.input.on('pointerdown', (p) => { this.pointerX = p.x; });

    this.scoreText = this.add.text(18, 12, '', { fontFamily: 'Rajdhani', fontSize: '28px', color: '#fff' }).setDepth(5);
    this.integrityText = this.add.text(18, 44, '', { fontFamily: 'Rajdhani', fontSize: '24px', color: '#ffb454' }).setDepth(5);
    this.loadText = this.add.text(18, 72, '', { fontFamily: 'Rajdhani', fontSize: '22px', color: '#9bd0ff' }).setDepth(5);

    this.progress = 0;
    this.cycles = 0;

    this.spawnTimer = 0;
    this.packetTimer = 0;
    this.sweepTimer = 0;
  }

  makeTextures() {
    const g = this.add.graphics();

    g.clear();
    g.fillStyle(0x2b2b2b, 1); g.fillRoundedRect(0, 0, 96, 30, 10);
    g.lineStyle(3, 0xff8a00, 1); g.strokeRoundedRect(0, 0, 96, 30, 10);
    g.fillStyle(0xffb454, 0.5); g.fillRoundedRect(6, 6, 44, 6, 4);
    g.generateTexture('bar', 96, 30);

    g.clear();
    g.fillStyle(0xc93a3a, 1); g.fillTriangle(20, 4, 36, 20, 4, 20);
    g.fillStyle(0xffe3e3, 1); g.fillCircle(10, 10, 3);
    g.generateTexture('click', 40, 24);

    g.clear();
    g.fillStyle(0x4fb7ff, 1); g.fillCircle(12, 12, 10);
    g.lineStyle(2, 0xffffff, 0.9); g.strokeCircle(12, 12, 10);
    g.fillStyle(0xffffff, 0.4); g.fillCircle(16, 8, 4);
    g.generateTexture('packet', 24, 24);

    g.clear();
    g.fillStyle(0xff6f00, 1); g.fillCircle(12, 12, 11);
    g.fillStyle(0x2c0f00, 1); g.fillCircle(12, 12, 4);
    g.generateTexture('volatile', 24, 24);

    g.clear();
    g.fillStyle(0xff9f43, 0.7); g.fillRect(0, 0, 170, 14);
    g.lineStyle(2, 0xffffff, 0.6); g.strokeRect(0, 0, 170, 14);
    g.generateTexture('sweep', 170, 14);

    g.clear();
    for (let y = 0; y < 600; y += 4) {
      g.fillStyle((y % 8 === 0) ? 0xffffff : 0x999999, 0.045);
      g.fillRect(0, y, 800, 2);
    }
    g.generateTexture('scan', 800, 600);
    g.destroy();
  }

  spawnClick(speed, xOverride = null) {
    const x = xOverride ?? Phaser.Math.Between(20, 780);
    const c = this.clicks.create(x, -20, 'click');
    c.setVelocity(Phaser.Math.Between(-40, 40), speed);
    c.setAngularVelocity(Phaser.Math.Between(-130, 130));
    c.body.setSize(28, 16).setOffset(6, 4);
  }

  spawnSweep(speed) {
    const y = Phaser.Math.Between(200, 500);
    const fromLeft = Math.random() > 0.5;
    const s = this.sweeps.create(fromLeft ? -90 : 890, y, 'sweep');
    s.setVelocityX((fromLeft ? 1 : -1) * speed);
    s.body.setSize(146, 10).setOffset(12, 2);
  }

  spawnPacket(difficulty) {
    const volatileChance = 0.2 + difficulty * 0.25;
    const isVolatile = Math.random() < volatileChance;
    const p = this.packets.create(Phaser.Math.Between(30, 770), -20, isVolatile ? 'volatile' : 'packet');
    p.isVolatile = isVolatile;
    p.setVelocity(Phaser.Math.Between(-25, 25), Phaser.Math.Between(120, 190));
    p.body.setSize(18, 18).setOffset(3, 3);
  }

  collectPacket(_player, packet) {
    if (!packet.active) return;
    packet.destroy();
    if (packet.isVolatile) {
      this.bonusPoints += 65;
      this.progress += 18;
      this.overclock = Math.min(4, this.overclock + 1.1);
    } else {
      this.bonusPoints += 30;
      this.progress += 10;
      this.integrity = Math.min(100, this.integrity + 6);
    }
    sfxCollect();
  }

  hitHazard(_player, hazard) {
    if (!hazard.active || this.isDead) return;
    hazard.destroy();
    this.integrity -= 20;
    this.cameras.main.shake(120, 0.005);
    this.cameras.main.flash(90, 255, 120, 0);
    sfxHit();
    this.player.setTint(0xff9966);
    this.time.delayedCall(110, () => this.player.clearTint());
    if (this.integrity <= 0) this.gameOver();
  }

  gameOver() {
    if (this.isDead) return;
    this.isDead = true;
    sfxDeath();
    this.player.setVisible(false);

    const particles = this.add.particles(this.player.x, this.player.y, 'packet', {
      speed: { min: 70, max: 220 },
      lifespan: 420,
      scale: { start: 0.7, end: 0 },
      blendMode: 'ADD',
      quantity: 26
    });
    this.cameras.main.shake(220, 0.012);

    const final = Math.floor(this.timeAlive * 10 + this.bonusPoints);
    this.time.delayedCall(500, async () => {
      particles.destroy();
      this.scene.pause();
      await showGameOverUI(final);
    });
  }

  update(time, delta) {
    if (this.isDead) return;
    const dt = delta / 16.667;
    this.timeAlive = (time - this.gameStartTime) / 1000;
    const t = Math.min(this.timeAlive / 120, 1);
    const ease = 1 - Math.exp(-3 * t);

    this.bg.tilePositionY += (0.4 + ease * 1.2) * dt;

    const left = this.keys.LEFT.isDown || this.keys.A.isDown;
    const right = this.keys.RIGHT.isDown || this.keys.D.isDown;
    const pointerActive = this.input.activePointer.isDown;

    let vx = 0;
    if (left) vx = -330;
    if (right) vx = 330;
    if (pointerActive) {
      const d = Phaser.Math.Clamp(this.pointerX - this.player.x, -1, 1);
      vx = d * 350;
    }

    const overclockHeld = this.keys.SPACE.isDown;
    if (overclockHeld) this.overclock = Math.min(6, this.overclock + 0.016 * dt);
    else this.overclock = Math.max(0, this.overclock - 0.02 * dt);

    this.player.x = Phaser.Math.Clamp(this.player.x + vx * dt / 60, 55, 745);

    const passiveLoad = Phaser.Math.Linear(0.22, 0.52, ease);
    const activeBonus = this.overclock * 0.55;
    this.progress += (passiveLoad + activeBonus) * dt;

    while (this.progress >= 100) {
      this.progress -= 100;
      this.cycles += 1;
      this.bonusPoints += 25;
      playSound('triangle', 600 + Math.min(300, this.cycles * 12), 0.08, 0.13);
    }

    const spawnRate = Phaser.Math.Linear(0.55, 3.2, ease) + this.overclock * 0.38;
    const clickSpeed = Phaser.Math.Linear(130, 360, ease) + this.overclock * 22;
    const sweepSpeed = Phaser.Math.Linear(140, 420, ease);

    this.spawnTimer += delta;
    this.packetTimer += delta;
    this.sweepTimer += delta;

    if (this.spawnTimer >= 1000 / spawnRate) {
      this.spawnTimer = 0;
      this.spawnClick(clickSpeed);
      if (Math.random() < (0.08 + ease * 0.35)) {
        for (let i = 0; i < 2; i++) this.spawnClick(clickSpeed * 0.95, Phaser.Math.Between(80, 720));
      }
    }

    const packetRateMs = Phaser.Math.Linear(1500, 820, ease);
    if (this.packetTimer >= packetRateMs) {
      this.packetTimer = 0;
      this.spawnPacket(ease);
    }

    const sweepRateMs = Phaser.Math.Linear(7500, 2800, ease);
    if (this.sweepTimer >= sweepRateMs) {
      this.sweepTimer = 0;
      this.spawnSweep(sweepSpeed);
    }

    this.integrity -= (0.28 + this.overclock * 0.34 + ease * 0.28) * dt / 60;
    if (this.integrity <= 0) this.gameOver();

    this.clicks.children.iterate((c) => { if (c && c.active && c.y > 660) c.destroy(); });
    this.packets.children.iterate((p) => { if (p && p.active && p.y > 660) p.destroy(); });
    this.sweeps.children.iterate((s) => { if (s && s.active && (s.x < -200 || s.x > 1000)) s.destroy(); });

    const score = Math.floor(this.timeAlive * 10 + this.bonusPoints);
    this.scoreText.setText(`SCORE ${score}`);
    this.integrityText.setText(`INTEGRITY ${Math.max(0, Math.floor(this.integrity))}%`);
    this.loadText.setText(`LOAD ${this.cycles * 100 + Math.floor(this.progress)}%  OC x${this.overclock.toFixed(1)}`);
  }
}

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: '#111111',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, GameScene]
};

const game = new Phaser.Game(config);

document.getElementById('submit-btn').addEventListener('click', async () => {
  const nameInput = document.getElementById('name-input');
  const playerName = (nameInput.value || 'Anonymous').trim().slice(0, 20);
  await submitScore(playerName, finalScoreGlobal);
  const scores = await getLeaderboard(10);
  renderLeaderboard(scores);
});

document.getElementById('replay-btn').addEventListener('click', () => {
  document.getElementById('ui-overlay').style.display = 'none';
  if (currentScene) currentScene.scene.restart();
});
</script>
</body>
</html>
