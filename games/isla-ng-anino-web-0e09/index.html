<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Isla ng Anino: Web Cut</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#0a1220;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:20;font-family:'VT323',monospace}
.panel{width:min(92vw,520px);background:#111831;border:2px solid #7da7ff;color:#fff;padding:16px}
.panel h2{font-size:42px;color:#ffd27d}.panel p{font-family:'Nunito',sans-serif;font-size:13px;color:#c8d3ef;margin:8px 0}
input{width:100%;padding:10px;background:#0a1022;border:1px solid #557;color:#fff;font-size:18px}
button{margin-top:8px;padding:8px 12px;background:#1e2d57;border:1px solid #7da7ff;color:#bfe1ff;font-family:'VT323';font-size:28px;cursor:pointer}
.lb{max-height:180px;overflow:auto;font-family:'Nunito',sans-serif;font-size:12px;margin-top:8px}.lb div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #243457}
</style>
</head>
<body>
<a href="../../index.html" style="position:fixed;top:8px;left:8px;z-index:30;color:#9cf;text-decoration:none;background:#121a35;padding:3px 8px;border:1px solid #7da7ff;font-family:VT323;font-size:20px">← Hub</a>
<div id="ui"><div class="panel" id="panel"></div></div>
<script>
const GAME_ID='isla-ng-anino-web-0e09';
const LEADERBOARD_API='https://game-leaderboard.mattgames.workers.dev';
async function submitScore(playerName,score){try{const r=await fetch(`${LEADERBOARD_API}/api/scores`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameId:GAME_ID,playerName,score})});return await r.json()}catch{return null}}
async function getLeaderboard(limit=10){try{const r=await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);const d=await r.json();return d.scores||[]}catch{return[]}}
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function sfx(f=440,d=.08,v=.15,t='square'){if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}

class MenuScene extends Phaser.Scene{
  constructor(){super('MenuScene')}
  create(){
    const {width:w,height:h}=this.scale;
    const g=this.add.graphics();
    g.fillGradientStyle(0x83d8b0,0x83d8b0,0x5ba9e8,0x5ba9e8,1);g.fillRect(0,0,w,h);
    this.add.text(w/2,90,'ISLA NG ANINO',{fontFamily:'VT323',fontSize:88,color:'#1f2d4d'}).setOrigin(.5);
    this.add.text(w/2,170,'WEB CUT — Catch runaway kids by day, survive FBI raids by night',{fontFamily:'Nunito',fontSize:16,color:'#233d61'}).setOrigin(.5);
    this.add.text(w/2,220,'Hero: Godwin Pang (pixel-art inspired)\nHome: blue-white island shrine with golden dome',{fontFamily:'Nunito',fontSize:14,color:'#294c77',align:'center'}).setOrigin(.5);
    this.add.text(w/2,560,'WASD / Arrows move • Click shoot • Space/K dodge • J slash • E interact',{fontFamily:'Nunito',fontSize:15,color:'#f0f6ff'}).setOrigin(.5);
    const t=this.add.text(w/2,640,'CLICK TO START',{fontFamily:'VT323',fontSize:64,color:'#ffe4a8'}).setOrigin(.5);
    this.tweens.add({targets:t,alpha:.2,duration:650,yoyo:true,repeat:-1});
    this.input.once('pointerdown',()=>{audioCtx.resume();sfx(620,.1,.18,'triangle');this.scene.start('GameScene')});
    this.input.keyboard.once('keydown',()=>{audioCtx.resume();sfx(620,.1,.18,'triangle');this.scene.start('GameScene')});
  }
}

class GameScene extends Phaser.Scene{
  constructor(){super('GameScene')}
  preload(){
    this.load.image('godwinHead','godwin.png');
  }
  create(){
    this.physics.world.setBounds(-1600,-1000,3200,2000);
    this.elapsed=0; this.score=0; this.bonus=0; this.wave=0; this.crops=0; this.kidsCaught=0; this.mode='day'; this.nextWaveAt=0;
    this.hero={hp:140,maxHp:140,stam:100,maxStam:100,speed:220,atk:28,rollCd:0,atkCd:0,inv:0,weaponLevel:1,weaponName:'Pistol'};

    // Island world (water around, land center)
    const gg=this.add.graphics();
    // water
    for(let x=-1600;x<1600;x+=96)for(let y=-1000;y<1000;y+=96){gg.fillStyle(((x+y)/96)%2?0x1b5fa8:0x2272c8,1);gg.fillRect(x,y,96,96)}
    // sand ring
    gg.fillStyle(0xe5d29a,1); gg.fillCircle(0,0,980);
    // grass island
    gg.fillStyle(0x2f7a52,1); gg.fillCircle(0,0,860);
    for(let x=-900;x<900;x+=96)for(let y=-900;y<900;y+=96){if(Math.hypot(x,y)<830){gg.fillStyle(((x+y)/96)%2?0x2f7a52:0x337f58,1);gg.fillRect(x,y,96,96)}}

    // Home building inspired by reference image (blue-white stripes + golden dome)
    const hg=this.add.graphics();
    hg.fillStyle(0xf0f3ff,1); hg.fillRect(0,0,180,160);
    for(let i=0;i<8;i++){if(i%2===0){hg.fillStyle(0x4b78d4,1);hg.fillRect(0,i*20,180,10)}}
    hg.fillStyle(0xd7b46b,1); hg.fillRect(68,90,44,70);
    hg.fillStyle(0xe0c176,1); hg.fillEllipse(90,40,120,80);
    hg.fillStyle(0x3a5ba6,1); hg.fillRect(75,108,30,52);
    hg.generateTexture('home',180,160); hg.destroy();
    this.home=this.physics.add.staticImage(0,0,'home');

    const eg=this.add.graphics();
    // FBI agent enemy texture (suit + glasses)
    eg.fillStyle(0x1f2b46,1);eg.fillRect(0,0,26,26);
    eg.fillStyle(0xf2d2b6,1);eg.fillRect(6,4,14,10);
    eg.fillStyle(0x111111,1);eg.fillRect(5,7,7,4);eg.fillRect(14,7,7,4);eg.fillRect(12,8,2,2);
    eg.fillStyle(0x2a3a5f,1);eg.fillRect(6,14,14,10);
    eg.fillStyle(0xbad7ff,1);eg.fillRect(11,14,4,10);
    eg.generateTexture('fbi',26,26);eg.destroy();
    const cg=this.add.graphics();cg.fillStyle(0x7abf64,1);cg.fillRect(0,0,18,18);cg.fillStyle(0xc8f19a,1);cg.fillRect(4,4,10,10);cg.generateTexture('crop',18,18);cg.destroy();
    const kg=this.add.graphics();
    kg.fillStyle(0xffd6a8,1);kg.fillRect(4,2,12,10); // head
    kg.fillStyle(0x6ec6ff,1);kg.fillRect(3,12,14,10); // shirt
    kg.fillStyle(0x222,1);kg.fillRect(6,5,2,2);kg.fillRect(12,5,2,2); // eyes
    kg.generateTexture('kid',20,22);kg.destroy();
    const bg=this.add.graphics();bg.fillStyle(0xffc857,1);bg.fillRect(0,0,8,8);bg.generateTexture('spit',8,8);bg.destroy();

    this.player=this.physics.add.image(-120,120,'godwinHead').setScale(0.085);
    this.player.body.setCircle(18,14,14);
    this.player.setCollideWorldBounds(true);

    this.cropGroup=this.physics.add.group();
    this.kidGroup=this.physics.add.group();
    this.enemyGroup=this.physics.add.group();
    this.spitGroup=this.physics.add.group();
    this.playerBullets=this.physics.add.group();

    this.spawnCrops(48);
    this.spawnKids(14);

    this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,J,K,E,SPACE');

    this.physics.add.overlap(this.player,this.cropGroup,(p,c)=>{if(this.mode!=='day')return; c.destroy(); this.crops++; this.bonus+=22; sfx(790,.05,.09,'triangle')});
    this.physics.add.overlap(this.player,this.kidGroup,(p,k)=>{if(this.mode!=='day')return; k.destroy(); this.kidsCaught++; this.bonus+=45; sfx(910,.06,.1,'triangle'); if(this.kidsCaught%5===0)this.applyWeaponUpgrade(); this.time.delayedCall(900,()=>this.spawnKids(1));});
    this.physics.add.overlap(this.player,this.spitGroup,(p,b)=>{if(this.hero.inv>0)return; b.destroy(); this.hit(10)});
    this.physics.add.overlap(this.player,this.enemyGroup,(p,e)=>{if(this.hero.inv>0)return; if(!e.getData('hitAt')||this.time.now-e.getData('hitAt')>420){e.setData('hitAt',this.time.now); this.hit(12)}});
    this.physics.add.overlap(this.playerBullets,this.enemyGroup,(b,e)=>{const dmg=b.damage||22; b.destroy(); e.setData('hp',e.getData('hp')-dmg); e.setTint(0xfff2a8); this.time.delayedCall(40,()=>e.clearTint()); if(b.rocket){this.enemyGroup.getChildren().forEach(t=>{if(t===e)return; const d=Phaser.Math.Distance.Between(e.x,e.y,t.x,t.y); if(d<80)t.setData('hp',t.getData('hp')-12);}); this.cameras.main.shake(80,.004);} if(e.getData('hp')<=0){this.score+=35;this.bonus+=12;e.destroy();sfx(540,.05,.1,'triangle')}});

    this.input.on('pointerdown',p=>{if(this.dead)return; this.shootGun(p.worldX,p.worldY)});

    this.cam=this.cameras.main; this.cam.startFollow(this.player,true,.12,.12); this.cam.setBounds(-1600,-1000,3200,2000);
    this.hud=this.add.text(10,8,'',{fontFamily:'VT323',fontSize:34,color:'#fff',stroke:'#000',strokeThickness:4}).setScrollFactor(0).setDepth(20);
    this.nameTag=this.add.text(this.player.x,this.player.y-56,'GODWIN PANG',{fontFamily:'VT323',fontSize:36,color:'#ffd27d',stroke:'#000',strokeThickness:6}).setOrigin(0.5).setDepth(21);
    this.quoteText=this.add.text(this.player.x,this.player.y-92,'',{fontFamily:'VT323',fontSize:26,color:'#ffffff',stroke:'#000',strokeThickness:5}).setOrigin(0.5).setDepth(21);
    this.quotes=["You'll never catch me!",'Move, move!','Island life, no surrender!','Keep up if you can!'];
    this.nextQuoteAt=0;
  }

  randomIslandPoint(minR=0,maxR=780){const a=Math.random()*Math.PI*2,r=Phaser.Math.Between(minR,maxR);return{x:Math.cos(a)*r,y:Math.sin(a)*r}}
  spawnCrops(n){for(let i=0;i<n;i++){const p=this.randomIslandPoint(60,760);this.cropGroup.create(p.x,p.y,'crop')}}
  spawnKids(n){for(let i=0;i<n;i++){const p=this.randomIslandPoint(80,740);const k=this.kidGroup.create(p.x,p.y,'kid');k.setData('spd',70+Math.random()*45);k.body.setSize(14,16).setOffset(3,3)}}
  spawnWave(n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,d=Phaser.Math.Between(860,980);const e=this.enemyGroup.create(Math.cos(a)*d,Math.sin(a)*d,'fbi');const r=Math.random();let type='agent';if(r>0.92)type='heli';else if(r>0.74)type='swat';const hp=Math.round((type==='swat'?42:type==='heli'?58:28)+this.wave*6);e.setData('hp',hp);e.setData('type',type);e.setData('spd',(type==='swat'?84:type==='heli'?66:72)+this.wave*6+Math.random()*14);if(type==='swat')e.setTint(0x9dc0ff);if(type==='heli')e.setTint(0xffd27d);e.body.setSize(20,20).setOffset(3,3)}}

  shootGun(tx,ty){if(this.time.now<(this._gunCd||0))return; const lvl=this.hero.weaponLevel; const spread=lvl>=3?0.12:0.05; const bullets=lvl>=4?3:lvl>=2?2:1; const cd=lvl>=4?70:lvl>=3?90:lvl>=2?110:140; this._gunCd=this.time.now+cd; sfx(360,.05,.09,'square'); const a=Math.atan2(ty-this.player.y,tx-this.player.x); for(let i=0;i<bullets;i++){const off=(i-(bullets-1)/2)*spread; const b=this.playerBullets.create(this.player.x,this.player.y,'spit'); b.setTint(lvl>=4?0xffb347:lvl>=3?0xff8b6a:0x9cf5ff); b.setScale(lvl>=3?1.4:1.1); b.setVelocity(Math.cos(a+off)*(lvl>=3?620:520),Math.sin(a+off)*(lvl>=3?620:520)); b.life=1400; b.damage=lvl>=4?38:lvl>=3?30:lvl>=2?24:22; b.rocket=lvl>=3;} }

  applyWeaponUpgrade(){this.hero.weaponLevel=Math.min(4,this.hero.weaponLevel+1);const names=['Pistol','SMG','Machine Gun','Rocket Launcher'];this.hero.weaponName=names[this.hero.weaponLevel-1];this.bonus+=120;sfx(980,.09,.12,'triangle');this.showQuote('UPGRADE: '+this.hero.weaponName+'!');}

  attack(){if(this.time.now<this.hero.atkCd)return; this.hero.atkCd=this.time.now+260; sfx(260,.08,.12,'sawtooth');
    const slash=this.add.circle(this.player.x,this.player.y,56,0xffffff,.1); this.tweens.add({targets:slash,alpha:0,scale:1.35,duration:120,onComplete:()=>slash.destroy()});
    this.enemyGroup.getChildren().forEach(e=>{const d=Phaser.Math.Distance.Between(this.player.x,this.player.y,e.x,e.y); if(d<62){let dmg=this.hero.atk*(this.mode==='night'?1.1:1); e.setData('hp',e.getData('hp')-dmg); e.setTint(0xffffff); this.time.delayedCall(60,()=>e.clearTint()); if(e.getData('hp')<=0){this.score+=30; this.bonus+=14; e.destroy(); sfx(520,.06,.1,'triangle')}}});
  }

  roll(){if(this.time.now<this.hero.rollCd||this.hero.stam<24)return; this.hero.rollCd=this.time.now+640; this.hero.inv=260; this.hero.stam-=24; sfx(180,.09,.13);
    const v=this.player.body.velocity; let nx=v.x,ny=v.y; if(Math.abs(nx)+Math.abs(ny)<1){ny=-1}else{const m=Math.hypot(nx,ny)||1; nx/=m; ny/=m}
    this.player.setVelocity(nx*650,ny*650); this.player.setTint(0x9fe8ff); this.time.delayedCall(160,()=>this.player.clearTint());
  }

  hit(d){this.hero.hp-=Math.max(1,d); this.cam.shake(120,.008); sfx(110,.14,.16,'sawtooth'); if(this.hero.hp<=0)this.gameOver();}

  switchMode(m){if(this.mode===m)return; this.mode=m;
    if(m==='night'){this.cameras.main.flash(320,80,0,120); this.wave++; this.spawnWave(8+this.wave*2); this.bonus+=100;}
    else{this.cameras.main.flash(280,180,240,255); this.spawnCrops(20); this.spawnKids(4); this.bonus+=70;}
  }

  enemyAI(time,delta){this.enemyGroup.getChildren().forEach(e=>{
    const dx=this.player.x-e.x,dy=this.player.y-e.y,d=Math.hypot(dx,dy)||1;
    const type=e.getData('type')||'agent';
    const s=e.getData('spd')*(this.mode==='night'?1.18:.75);
    if(type==='heli'){
      const ang=(time*0.001)+(e.x*0.0007);
      e.setVelocity(Math.cos(ang)*s*0.7 + (dx/d)*s*0.5, Math.sin(ang)*s*0.7 + (dy/d)*s*0.5);
    }else{
      e.setVelocity((dx/d)*s,(dy/d)*s);
    }
    const shotCd=type==='swat'?900:type==='heli'?700:1200;
    if(this.mode==='night'&&(!e.getData('shot')||time-e.getData('shot')>shotCd+Math.random()*400)){
      e.setData('shot',time); const b=this.spitGroup.create(e.x,e.y,'spit'); const a=Math.atan2(dy,dx),sp=(type==='heli'?260:type==='swat'?235:210)+this.wave*10; b.setVelocity(Math.cos(a)*sp,Math.sin(a)*sp); b.life=2800; if(type==='heli')b.setTint(0xffd27d);
    }
  });
  this.spitGroup.getChildren().forEach(b=>{b.life-=delta;if(b.life<=0)b.destroy()});
  this.playerBullets.getChildren().forEach(b=>{b.life-=delta;if(b.life<=0)b.destroy()});}

  kidAI(){
    this.kidGroup.getChildren().forEach(k=>{
      const dx=k.x-this.player.x,dy=k.y-this.player.y; // run away from player
      const d=Math.hypot(dx,dy)||1;
      if(this.mode==='day'){
        const s=k.getData('spd')||70;
        k.setVelocity((dx/d)*s,(dy/d)*s);
        // keep kids around home area
        const hx=0,hy=0;
        const dh=Math.hypot(k.x-hx,k.y-hy);
        if(dh>1000){const ax=(hx-k.x)/dh,ay=(hy-k.y)/dh;k.setVelocity(ax*s,ay*s)}
      }else{
        k.setVelocity(0,0);
      }
    });
  }

  update(time,delta){if(this.dead)return; this.elapsed=(time-(this._start|| (this._start=time)))/1000;
    const cyc=this.elapsed%30; this.switchMode(cyc<12?'day':'night');

    let mx=0,my=0; if(this.keys.A.isDown||this.keys.LEFT.isDown)mx=-1; if(this.keys.D.isDown||this.keys.RIGHT.isDown)mx=1; if(this.keys.W.isDown||this.keys.UP.isDown)my=-1; if(this.keys.S.isDown||this.keys.DOWN.isDown)my=1;
    const m=Math.hypot(mx,my)||1; if(this.hero.inv<=0)this.player.setVelocity(mx/m*this.hero.speed,my/m*this.hero.speed);
    this.hero.inv=Math.max(0,this.hero.inv-delta); this.hero.stam=Math.min(this.hero.maxStam,this.hero.stam+delta*0.035);

    if(Phaser.Input.Keyboard.JustDown(this.keys.J))this.attack();
    if(Phaser.Input.Keyboard.JustDown(this.keys.K)||Phaser.Input.Keyboard.JustDown(this.keys.SPACE))this.roll();
    if(Phaser.Input.Keyboard.JustDown(this.keys.E)&&this.mode==='day'){
      const d=Phaser.Math.Distance.Between(this.player.x,this.player.y,this.home.x,this.home.y);
      if(d<140){this.hero.hp=Math.min(this.hero.maxHp,this.hero.hp+25); this.bonus+=40; sfx(680,.09,.1,'triangle');}
    }

    if(this.mode==='night'&&time>this.nextWaveAt){this.wave++; this.spawnWave(Math.min(36,8+this.wave*2)); this.nextWaveAt=time+3400;}
    this.kidAI();
    this.enemyAI(time,delta);

    if(time>this.nextQuoteAt){this.showQuote(this.quotes[Math.floor(Math.random()*this.quotes.length)]); this.nextQuoteAt=time+7000;}
    this.score=Math.floor(this.elapsed*10)+this.bonus;
    this.nameTag.setPosition(this.player.x,this.player.y-56);
    this.quoteText.setPosition(this.player.x,this.player.y-92);
    this.hud.setText(`HP ${Math.ceil(this.hero.hp)}/${this.hero.maxHp}  STAM ${Math.ceil(this.hero.stam)}\n${this.mode.toUpperCase()}  FBI Wave ${this.wave}  Crops ${this.crops}  Runaways ${this.kidsCaught}  ${this.hero.weaponName}  Score ${this.score}`);
  }

  showQuote(t){this.quoteText.setText(t); this.quoteText.setAlpha(1); this.tweens.killTweensOf(this.quoteText); this.tweens.add({targets:this.quoteText,alpha:0,duration:2200,ease:'Quad.easeOut'});}

  gameOver(){if(this.dead)return; this.dead=true; this.player.setTint(0xff4444); this.player.setVelocity(0,0); this.cam.shake(280,.013); sfx(80,.5,.2,'sawtooth');
    this.time.delayedCall(500,()=>{this.scene.pause();showGameOver(this.score,Math.floor(this.elapsed),this.crops,this.kidsCaught,this.wave,this.hero.weaponName)});
  }
}

new Phaser.Game({type:Phaser.AUTO,width:1280,height:720,backgroundColor:'#0e1730',physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[MenuScene,GameScene]});

function showGameOver(score,sec,crops,kids,wave,weapon){
  const ui=document.getElementById('ui'),p=document.getElementById('panel'); ui.style.display='flex';
  p.innerHTML=`<h2>You Died</h2><p>Score: <b>${score}</b><br>Time: ${sec}s • Crops: ${crops} • Kids Caught: ${kids} • Highest FBI Wave: ${wave} • Weapon: ${weapon}</p><input id="nm" placeholder="name" maxlength="16"><button id="sub">Submit Score</button><div id="lb" class="lb"></div><button id="re">Play Again</button>`;
  document.getElementById('sub').onclick=async()=>{const n=(document.getElementById('nm').value||'Anonymous').trim();await submitScore(n,score);const rows=await getLeaderboard();document.getElementById('lb').innerHTML=rows.map((r,i)=>`<div><span>#${i+1} ${r.playerName}</span><span>${r.score}</span></div>`).join('');document.getElementById('sub').style.display='none'};
  document.getElementById('re').onclick=()=>location.reload();
}
</script>
</body>
</html>
