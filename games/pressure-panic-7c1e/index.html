<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pressure Panic</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 20% 20%, #1e3a5f 0%, #0a1628 60%, #08101d 100%);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; touch-action: none;
      font-family: 'Rajdhani', sans-serif;
    }
    #ui-overlay {
      position: fixed; inset: 0; display: none; z-index: 20;
      justify-content: center; align-items: center; background: rgba(2, 9, 20, 0.82);
      color: #e7f8ff;
    }
    .panel {
      width: min(92vw, 440px); background: rgba(7, 27, 46, 0.95);
      border: 2px solid #48cae4; border-radius: 14px; padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    h1 { font-size: 40px; line-height: 1; margin-bottom: 8px; }
    .score { color: #90e0ef; font-size: 30px; margin: 10px 0 14px; }
    input, button {
      width: 100%; padding: 11px 12px; border-radius: 8px; border: none;
      margin-bottom: 10px; font: 700 18px 'Rajdhani', sans-serif;
    }
    input { background: #dff6ff; color: #0a1628; }
    button { background: #00b4d8; color: #06121d; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    #leaderboard { margin-top: 12px; font-size: 17px; line-height: 1.2; }
    #leaderboard li { margin-left: 18px; margin-bottom: 2px; }
    .tiny { opacity: 0.78; font-size: 15px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div class="panel">
      <h1>Run Over</h1>
      <div id="final-score" class="score">Score: 0</div>
      <div class="tiny">Submit to global leaderboard:</div>
      <input id="player-name" maxlength="20" placeholder="Pilot name" />
      <button id="submit-score">Submit Score</button>
      <button id="play-again" style="background:#48cae4;">Play Again</button>
      <ol id="leaderboard"></ol>
    </div>
  </div>

<script src='../../shared/supabase-config.js'></script><script src='../../shared/supabase-client.js'></script><script>
const GAME_ID = 'pressure-panic-7c1e';
const LEADERBOARD_API = window.GAME_HUB_API_BASE;

/* DESIGN HEADER
Controls: hold/tap one button (space/mouse/touch) to thrust upward; release to fall.
Core loop/death: survive an endless tunnel by dodging hazards while balancing engine stress; die on collision, ceiling/floor crash, or stress meltdown.
Hazards: (1) Scrap drones flying straight at variable heights, (2) sine mines weaving vertically.
Pickups + risk/reward: coolant orbs reduce stress (+small bonus), overcharge cells give bigger bonus but add stress.
Scoring: finalScore = Math.floor(timeAlive * 10 + bonusPoints), monotonic.
Difficulty ramp: smooth ease over 120s scales hazard spawn rate, speed, and mine density; stress while holding further worsens spawn/speed.
Visual/audio: ocean/cool palette, parallax bubbles/current lines, Rajdhani type, synthy beeps and harsh saw death tone.
*/

async function submitScore(playerName, score) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gameId: GAME_ID, playerName, score })
    });
    return await res.json();
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return null;
  }
}

async function getLeaderboard(limit = 10) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);
    const data = await res.json();
    return data.scores || [];
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return [];
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(type, freq, duration, vol=0.2, glide=1) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * glide), audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
const sfxStart = () => { beep('triangle', 300, 0.12, 0.18, 1.6); beep('triangle', 520, 0.16, 0.14, 1.15); };
const sfxPickup = () => { beep('sine', 700, 0.09, 0.2, 1.35); };
const sfxRisk = () => { beep('square', 480, 0.08, 0.2, 0.8); beep('square', 300, 0.08, 0.14, 0.9); };
const sfxHit = () => { beep('sawtooth', 160, 0.24, 0.26, 0.55); };
const sfxDeath = () => { beep('sawtooth', 300, 0.45, 0.25, 0.23); beep('square', 130, 0.55, 0.18, 0.7); };

function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

let activeScene = null;

class MenuScene extends Phaser.Scene {
  constructor() { super('MenuScene'); }
  create() {
    const { width, height } = this.scale;
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x0a1628, 0x0a1628, 0x1e3a5f, 0x08101d, 1);
    bg.fillRect(0,0,width,height);
    for (let i = 0; i < 42; i++) {
      const c = this.add.circle(Phaser.Math.Between(0,width), Phaser.Math.Between(0,height), Phaser.Math.Between(1,3), 0x90e0ef, Phaser.Math.FloatBetween(0.12,0.3));
      this.tweens.add({ targets: c, y: c.y - Phaser.Math.Between(12,40), alpha: {from:c.alpha, to:0.03}, duration: Phaser.Math.Between(2200,4200), repeat:-1 });
    }
    this.add.text(width/2, height*0.23, 'PRESSURE PANIC', { fontFamily: 'Rajdhani', fontSize: '64px', color: '#e7f8ff', fontStyle: '700'}).setOrigin(0.5);
    this.add.text(width/2, height*0.44,
      'ONE BUTTON:\nHOLD to thrust up.\nHolding raises ENGINE STRESS,\nwhich makes hazard spawns worse.\n\nRelease to cool down.',
      { align:'center', fontFamily:'Rajdhani', fontSize:'28px', color:'#90e0ef', lineSpacing:6 }).setOrigin(0.5);
    const blink = this.add.text(width/2, height*0.82, 'Tap / Click / Space to Start', { fontFamily:'Rajdhani', fontSize:'36px', color:'#48cae4' }).setOrigin(0.5);
    this.tweens.add({ targets: blink, alpha: 0.2, duration: 740, yoyo: true, repeat: -1 });

    const begin = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      sfxStart();
      this.scene.start('GameScene');
    };
    this.input.once('pointerdown', begin);
    this.input.keyboard.once('keydown', begin);
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }
  create() {
    activeScene = this;
    this.isDead = false;
    this.holding = false;
    this.gameStartTime = this.time.now;
    this.timeAlive = 0;
    this.bonusPoints = 0;
    this.finalScore = 0;
    this.stress = 0;

    const w = this.scale.width;
    const h = this.scale.height;

    this.back1 = this.add.tileSprite(0, 0, w, h, null).setOrigin(0);
    this.back1.fillColor = 0x0a1628;
    this.currents = this.add.graphics();
    this.currents.fillStyle(0x1e3a5f, 1).fillRect(0, 0, w, h);
    for (let i=0;i<24;i++) {
      this.currents.lineStyle(1, 0x48cae4, 0.1 + Math.random()*0.2);
      const y = i * (h/24) + Math.random()*14;
      this.currents.lineBetween(0, y, w, y + Phaser.Math.Between(-24,24));
    }

    this.bubbles = this.add.group();
    for (let i=0;i<28;i++) {
      const b = this.add.circle(Phaser.Math.Between(0,w), Phaser.Math.Between(0,h), Phaser.Math.Between(2,6), 0x90e0ef, Phaser.Math.FloatBetween(0.08,0.28));
      this.bubbles.add(b);
    }

    const g = this.add.graphics();
    g.fillStyle(0x00b4d8, 1); g.fillCircle(48,48,30);
    g.lineStyle(6, 0x023e8a, 1); g.strokeCircle(48,48,30);
    g.fillStyle(0xffffff,0.4); g.fillCircle(62,36,10);
    g.fillStyle(0x03045e,1); g.fillRect(38,56,20,10);
    g.generateTexture('playerTex', 96, 96); g.clear();

    g.fillStyle(0xcd2121, 1); g.fillTriangle(10,30, 86,48, 10,66);
    g.lineStyle(4, 0x5a0e0e, 1); g.strokeTriangle(10,30,86,48,10,66);
    g.fillStyle(0xffb3b3, 0.6); g.fillCircle(34,46,6);
    g.generateTexture('droneTex', 96, 96); g.clear();

    g.fillStyle(0x4b3f72, 1); g.fillCircle(48,48,26);
    g.lineStyle(6, 0xc77dff, 1); g.strokeCircle(48,48,26);
    for (let i=0;i<6;i++) {
      const ang = i * Math.PI / 3;
      const x1 = 48 + Math.cos(ang)*20; const y1 = 48 + Math.sin(ang)*20;
      const x2 = 48 + Math.cos(ang)*40; const y2 = 48 + Math.sin(ang)*40;
      g.lineStyle(4, 0xe0aaff, 1); g.lineBetween(x1,y1,x2,y2);
    }
    g.generateTexture('mineTex', 96,96); g.clear();

    g.fillStyle(0x80ffdb,1); g.fillCircle(24,24,16); g.lineStyle(3,0x2dc653,1); g.strokeCircle(24,24,16); g.generateTexture('coolTex',48,48); g.clear();
    g.fillStyle(0xff6d00,1); g.fillRect(8,10,32,28); g.lineStyle(3,0xffba08,1); g.strokeRect(8,10,32,28); g.generateTexture('riskTex',48,48); g.destroy();

    this.player = this.physics.add.sprite(w*0.22, h*0.5, 'playerTex').setScale(0.52);
    this.player.body.setSize(this.player.width*0.62, this.player.height*0.62);
    this.player.body.setCollideWorldBounds(true);
    this.player.body.setDragY(60);
    this.player.body.setMaxVelocity(0, 500);

    this.hazards = this.physics.add.group();
    this.pickups = this.physics.add.group();

    this.physics.add.overlap(this.player, this.hazards, this.hitHazard, null, this);
    this.physics.add.overlap(this.player, this.pickups, this.collectPickup, null, this);

    this.scoreText = this.add.text(18, 14, 'Score: 0', { fontFamily:'Rajdhani', fontSize:'34px', color:'#e7f8ff' }).setDepth(8);
    this.stressText = this.add.text(18, 52, 'Stress: 0%', { fontFamily:'Rajdhani', fontSize:'28px', color:'#ffd166' }).setDepth(8);

    this.stressBarBack = this.add.rectangle(132, 88, 228, 14, 0x0d1b2a).setOrigin(0,0.5).setStrokeStyle(2,0x90e0ef).setDepth(8);
    this.stressBar = this.add.rectangle(134, 88, 0, 10, 0x80ffdb).setOrigin(0,0.5).setDepth(8);

    this.spawnEvent = this.time.addEvent({ delay: 900, loop: true, callback: this.spawnHazard, callbackScope: this });
    this.pickupEvent = this.time.addEvent({ delay: 1700, loop: true, callback: this.spawnPickup, callbackScope: this });

    this.input.on('pointerdown', () => { this.holding = true; if (audioCtx.state === 'suspended') audioCtx.resume(); });
    this.input.on('pointerup', () => this.holding = false);
    this.input.on('pointerout', () => this.holding = false);
    this.space = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    this.deathParticles = this.add.particles(0,0,'coolTex',{ speed:{min:60,max:240}, scale:{start:0.3,end:0}, lifespan:500, quantity:12, emitting:false });
  }

  spawnHazard() {
    const h = this.scale.height;
    const w = this.scale.width;
    const type = Math.random() < 0.62 ? 'drone' : 'mine';
    const y = Phaser.Math.Between(42, h - 42);
    const tex = type === 'drone' ? 'droneTex' : 'mineTex';
    const hz = this.hazards.create(w + 60, y, tex).setScale(type === 'drone' ? 0.42 : 0.4);
    hz.kind = type;
    hz.baseY = y;
    hz.wave = Phaser.Math.FloatBetween(2.4, 5.2);
    hz.phase = Phaser.Math.FloatBetween(0, Math.PI * 2);
    hz.body.setSize(hz.width*0.68, hz.height*0.68);
  }

  spawnPickup() {
    const h = this.scale.height;
    const w = this.scale.width;
    const risky = Math.random() < 0.36;
    const p = this.pickups.create(w + 40, Phaser.Math.Between(50, h - 50), risky ? 'riskTex' : 'coolTex').setScale(0.56);
    p.kind = risky ? 'risk' : 'cool';
    p.body.setCircle(11, 13, 13);
    this.tweens.add({ targets: p, angle: 360, duration: risky ? 650 : 950, repeat: -1 });
  }

  collectPickup(player, p) {
    if (!p.active || this.isDead) return;
    if (p.kind === 'cool') {
      this.stress = Math.max(0, this.stress - 28);
      this.bonusPoints += 14;
      sfxPickup();
    } else {
      this.stress = Math.min(100, this.stress + 18);
      this.bonusPoints += 45;
      sfxRisk();
      this.cameras.main.flash(70, 255, 180, 80, false);
    }
    p.destroy();
  }

  hitHazard() {
    if (this.isDead) return;
    sfxHit();
    this.gameOver();
  }

  update(time, delta) {
    if (this.isDead) return;
    const dt = delta / 16.667;
    this.timeAlive = (time - this.gameStartTime) / 1000;

    const t = Math.min(this.timeAlive / 120, 1);
    const d = easeInOut(t);
    const holdNow = this.holding || this.space.isDown;

    if (holdNow) {
      this.player.setAccelerationY(-710 - d * 200);
      this.stress += (20 + 34 * d) * (delta / 1000);
    } else {
      this.player.setAccelerationY(460 + d * 140);
      this.stress -= (24 - 6 * d) * (delta / 1000);
    }
    this.stress = Phaser.Math.Clamp(this.stress, 0, 100);

    const stressFactor = this.stress / 100;
    const speed = lerp(190, 420, d) * (1 + stressFactor * 0.75);
    const spawnDelay = lerp(920, 350, d) * (1 - stressFactor * 0.35);
    this.spawnEvent.delay = Phaser.Math.Clamp(spawnDelay, 210, 980);

    this.hazards.children.iterate(hz => {
      if (!hz || !hz.active) return;
      hz.x -= speed * (delta / 1000);
      if (hz.kind === 'mine') {
        hz.y = hz.baseY + Math.sin(time * 0.001 * hz.wave + hz.phase) * (18 + 34 * d);
      }
      hz.angle += hz.kind === 'mine' ? 2.2 * dt : 0;
      if (hz.x < -80) hz.destroy();
    });

    const pSpeed = speed * 0.78;
    this.pickups.children.iterate(p => {
      if (!p || !p.active) return;
      p.x -= pSpeed * (delta / 1000);
      p.y += Math.sin((time + p.x * 3) * 0.004) * 0.9 * dt;
      if (p.x < -60) p.destroy();
    });

    this.bubbles.children.iterate(b => {
      b.y -= (0.35 + b.radius * 0.05 + d * 0.6) * dt;
      b.x += Math.sin((time * 0.001) + b.y) * 0.22;
      if (b.y < -8) { b.y = this.scale.height + Phaser.Math.Between(4,24); b.x = Phaser.Math.Between(0, this.scale.width); }
    });

    this.player.angle = this.player.body.velocity.y * 0.035;
    this.player.setScale(0.52 + (holdNow ? 0.03 : 0));

    this.finalScore = Math.floor(this.timeAlive * 10 + this.bonusPoints);
    this.scoreText.setText(`Score: ${this.finalScore}`);
    this.stressText.setText(`Stress: ${Math.floor(this.stress)}%`);

    this.stressBar.width = 224 * (this.stress / 100);
    const c = Phaser.Display.Color.Interpolate.ColorWithColor(
      Phaser.Display.Color.HexStringToColor('#80ffdb'),
      Phaser.Display.Color.HexStringToColor('#ff595e'),
      100, Math.floor(this.stress)
    );
    this.stressBar.fillColor = Phaser.Display.Color.GetColor(c.r,c.g,c.b);

    if (this.player.y < 12 || this.player.y > this.scale.height - 12) this.gameOver();
    if (this.stress >= 100) this.gameOver();
  }

  gameOver() {
    if (this.isDead) return;
    this.isDead = true;
    sfxDeath();
    this.player.setTint(0xffffff);
    this.deathParticles.explode(26, this.player.x, this.player.y);
    this.cameras.main.shake(220, 0.012);
    this.cameras.main.flash(180, 120, 180, 255, false);
    this.player.disableBody(true, true);

    this.time.delayedCall(500, () => {
      this.scene.pause();
      showGameOverUI(Math.floor(this.timeAlive * 10 + this.bonusPoints));
    });
  }
}

const config = {
  type: Phaser.AUTO,
  width: 900,
  height: 600,
  backgroundColor: '#0a1628',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, GameScene]
};
new Phaser.Game(config);

const overlay = document.getElementById('ui-overlay');
const scoreEl = document.getElementById('final-score');
const nameInput = document.getElementById('player-name');
const submitBtn = document.getElementById('submit-score');
const playAgainBtn = document.getElementById('play-again');
const leaderboardEl = document.getElementById('leaderboard');
let pendingScore = 0;

function renderLeaderboard(scores) {
  leaderboardEl.innerHTML = '';
  if (!scores.length) {
    const li = document.createElement('li');
    li.textContent = 'No scores yet — be first!';
    leaderboardEl.appendChild(li);
    return;
  }
  scores.forEach((row, i) => {
    const li = document.createElement('li');
    li.textContent = `${i + 1}. ${row.playerName || 'Anon'} — ${row.score}`;
    leaderboardEl.appendChild(li);
  });
}

async function showGameOverUI(finalScore) {
  pendingScore = finalScore;
  scoreEl.textContent = `Score: ${finalScore}`;
  overlay.style.display = 'flex';
  nameInput.value = '';
  nameInput.focus();
  renderLeaderboard(await getLeaderboard(10));
}

submitBtn.addEventListener('click', async () => {
  const playerName = (nameInput.value || 'Anonymous').trim().slice(0, 20);
  submitBtn.disabled = true;
  await submitScore(playerName || 'Anonymous', pendingScore);
  renderLeaderboard(await getLeaderboard(10));
  submitBtn.disabled = false;
});

playAgainBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  if (activeScene) activeScene.scene.restart();
});
</script>
</body>
</html>
