<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'/><title>Bonk Parade</title><script src='https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js'></script><style>*{box-sizing:border-box;margin:0}body{background:#181426;overflow:hidden;font-family:system-ui}#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);z-index:20}.p{width:min(92vw,480px);background:#22203a;border:2px solid #ff8ad6;color:#fff;padding:14px}button{margin-top:8px;padding:8px 12px;border:1px solid #ff8ad6;background:#3a2758;color:#ffd8f2;font-size:18px;cursor:pointer;width:100%}input{width:100%;padding:8px;background:#141126;border:1px solid #556;color:#fff}.lb{max-height:180px;overflow:auto;font:12px sans-serif;margin-top:8px}.lb div{display:flex;justify-content:space-between;border-bottom:1px solid #3b3155;padding:4px 0}</style></head><body><a href='../../index.html' style='position:fixed;top:8px;left:8px;z-index:30;color:#ffd8f2;text-decoration:none;border:1px solid #ff8ad6;padding:2px 8px;background:#22203a'>← Hub</a><div id='ov'><div id='panel' class='p'></div></div><script>
const GAME_ID='bonk-parade-a1c3';const LEADERBOARD_API='https://game-leaderboard.mattgames.workers.dev';
async function submitScore(playerName,score){try{const r=await fetch(`${LEADERBOARD_API}/api/scores`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameId:GAME_ID,playerName,score})});return await r.json()}catch{return null}}
async function getLeaderboard(limit=10){try{const r=await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);const d=await r.json();return d.scores||[]}catch{return[]}}
class M extends Phaser.Scene{create(){const w=this.scale.width,h=this.scale.height;this.add.rectangle(w/2,h/2,w,h,0x181426);this.add.text(w/2,120,'BONK PARADE',{font:'64px sans-serif',color:'#ffd8f2'}).setOrigin(.5);this.add.text(w/2,210,'SFW chaos: dodge drama clouds, collect hearts,\nBONK overacting NPCs, rack combo points.',{font:'20px sans-serif',align:'center',color:'#b7f7ff'}).setOrigin(.5);const t=this.add.text(w/2,620,'CLICK TO START',{font:'36px sans-serif',color:'#fff'}).setOrigin(.5);this.tweens.add({targets:t,alpha:.2,yoyo:true,repeat:-1,duration:650});this.input.once('pointerdown',()=>this.scene.start('G'));this.input.keyboard.once('keydown',()=>this.scene.start('G'));}}
class G extends Phaser.Scene{create(){this.start=this.time.now;this.score=0;this.combo=0;this.hp=5;this.kills=0;const w=this.scale.width,h=this.scale.height;this.physics.world.setBounds(0,0,w,h);this.add.rectangle(w/2,h/2,w,h,0x20163a);this.grpN=this.physics.add.group();this.grpC=this.physics.add.group();this.grpH=this.physics.add.group();const g=this.add.graphics();g.fillStyle(0x7ce0ff,1);g.fillCircle(10,10,10);g.generateTexture('pl',20,20);g.clear();g.fillStyle(0x9f6bff,1);g.fillRoundedRect(0,0,22,22,6);g.generateTexture('npc',22,22);g.clear();g.fillStyle(0x777,1);g.fillRoundedRect(0,0,34,24,8);g.generateTexture('cloud',34,24);g.clear();g.fillStyle(0xff6bb3,1);g.fillCircle(8,8,8);g.generateTexture('heart',16,16);g.destroy();this.p=this.physics.add.sprite(w/2,h-90,'pl');this.p.setCollideWorldBounds(true);this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,SPACE');this.physics.add.overlap(this.p,this.grpN,(p,n)=>{n.destroy();this.combo++;this.kills++;this.score+=20+this.combo*5;this.flash('BONK!','#ffd8f2')});this.physics.add.overlap(this.p,this.grpC,(p,c)=>{c.destroy();this.combo=0;this.hp--;this.score=Math.max(0,this.score-25);this.flash('DRAMA CLOUD!','#bbb');if(this.hp<=0)this.over()});this.physics.add.overlap(this.p,this.grpH,(p,h)=>{h.destroy();this.score+=35;this.flash('+HEART','#ff8ad6')});this.h1=this.add.text(10,8,'',{font:'24px sans-serif',color:'#fff'});this.h2=this.add.text(10,36,'',{font:'18px sans-serif',color:'#b7f7ff'});this.msg=this.add.text(w/2,80,'',{font:'28px sans-serif',color:'#ffd8f2'}).setOrigin(.5).setAlpha(0);this.spawn=0;}
flash(t,c){this.msg.setText(t).setColor(c).setAlpha(1);this.tweens.killTweensOf(this.msg);this.tweens.add({targets:this.msg,alpha:0,y:this.msg.y-15,duration:450,onComplete:()=>this.msg.setY(80)})}
update(time,dt){const d=dt/16.667;let mx=0,my=0;if(this.keys.A.isDown||this.keys.LEFT.isDown)mx=-1;if(this.keys.D.isDown||this.keys.RIGHT.isDown)mx=1;if(this.keys.W.isDown||this.keys.UP.isDown)my=-1;if(this.keys.S.isDown||this.keys.DOWN.isDown)my=1;const m=Math.hypot(mx,my)||1;this.p.x+=mx/m*5*d;this.p.y+=my/m*5*d;this.spawn+=dt;if(this.spawn>450){this.spawn=0;const r=Math.random();if(r<.5){const n=this.grpN.create(Phaser.Math.Between(30,this.scale.width-30),-20,'npc');n.v=Phaser.Math.Between(100,180);}else if(r<.82){const c=this.grpC.create(Phaser.Math.Between(30,this.scale.width-30),-20,'cloud');c.v=Phaser.Math.Between(110,170);}else{const h=this.grpH.create(Phaser.Math.Between(30,this.scale.width-30),-20,'heart');h.v=Phaser.Math.Between(120,190);}}[this.grpN,this.grpC,this.grpH].forEach(g=>g.getChildren().forEach(o=>{o.y+=o.v*d*0.06;if(o.y>this.scale.height+30)o.destroy()}));const sec=Math.floor((time-this.start)/1000);this.score+=0.05*dt;this.h1.setText(`Score ${Math.floor(this.score)}   HP ${this.hp}   Combo ${this.combo}`);this.h2.setText(`BONKs ${this.kills}   Time ${sec}s`)}
over(){this.scene.pause();const score=Math.floor(this.score),sec=Math.floor((this.time.now-this.start)/1000);const ov=document.getElementById('ov'),p=document.getElementById('panel');ov.style.display='flex';p.innerHTML=`<h2 style='margin:0 0 8px;color:#ffd8f2'>Parade Over</h2><p style='font:13px sans-serif;color:#cfe8ff'>Score <b>${score}</b><br>Time ${sec}s • BONKs ${this.kills}</p><input id='nm' maxlength='16' placeholder='name'><button id='sub'>Submit Score</button><div id='lb' class='lb'></div><button id='re'>Play Again</button>`;document.getElementById('sub').onclick=async()=>{const n=(document.getElementById('nm').value||'Anonymous').trim();await submitScore(n,score);const rows=await getLeaderboard();document.getElementById('lb').innerHTML=rows.map((r,i)=>`<div><span>#${i+1} ${r.playerName}</span><span>${r.score}</span></div>`).join('');document.getElementById('sub').style.display='none'};document.getElementById('re').onclick=()=>location.reload();}}
new Phaser.Game({type:Phaser.AUTO,width:900,height:1400,backgroundColor:'#181426',physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[M,G]});
</script></body></html>
