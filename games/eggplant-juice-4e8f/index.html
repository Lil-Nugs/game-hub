<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eggplant Juicer</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{background:#2d1536;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Nunito',sans-serif;cursor:grab}
body.juicing{cursor:grabbing}
#game{width:100%;height:100%;position:relative;overflow:hidden}
#ui-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:10}
#ui-overlay>div{pointer-events:auto}
.panel{background:rgba(255,255,255,.96);border:4px solid #7B2D8E;border-radius:20px;padding:28px;text-align:center;color:#333;max-width:400px;width:90vw;max-height:92vh;overflow-y:auto;box-shadow:0 10px 40px rgba(123,45,142,.3)}
.panel h1{font-family:'Lilita One',sans-serif;font-size:32px;color:#7B2D8E;margin-bottom:8px}
.panel h2{font-size:20px;color:#4CAF50;margin-bottom:10px}
.panel p{font-size:13px;line-height:1.8;color:#777;margin-bottom:10px}
.btn{font-family:'Lilita One',sans-serif;font-size:20px;padding:14px 32px;border:3px solid #7B2D8E;background:linear-gradient(135deg,#7B2D8E,#9B59B6);color:#fff;cursor:pointer;border-radius:50px;margin:8px;transition:all .2s;box-shadow:0 4px 15px rgba(123,45,142,.4)}
.btn:hover{transform:scale(1.08)}
input[type="text"]{font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;padding:12px;border:3px solid #7B2D8E;background:#F3E5F5;color:#7B2D8E;border-radius:50px;width:220px;text-align:center;outline:none}
.lb{text-align:left;margin-top:14px}.lb div{font-size:13px;padding:6px 0;color:#666;border-bottom:1px solid #E8E0F0;display:flex;justify-content:space-between}
.lr{color:#7B2D8E;font-weight:700}.ls{color:#4CAF50;font-weight:700}
.juiced-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;opacity:0;transition:opacity .5s}
</style>
</head>
<body>
<a href="../../index.html" style="position:fixed;top:10px;left:10px;z-index:100;font-size:12px;color:#fff;text-decoration:none;background:rgba(123,45,142,0.6);padding:4px 12px;border-radius:20px;font-family:sans-serif">← Hub</a>
<canvas id="c"></canvas>
<div id="juiced" class="juiced-overlay"></div>
<div id="ui-overlay"><div id="ui-content"></div></div>
<script src='../../shared/supabase-config.js'></script><script src='../../shared/supabase-client.js'></script><script>
const GAME_ID='eggplant-juice-4e8f';
const LB_API=window.GAME_HUB_API_BASE;
async function submitScore(n,s){try{return(await(await fetch(`${LB_API}/api/scores`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameId:GAME_ID,playerName:n,score:s})})).json())}catch(e){return null}}
async function getLeaderboard(l=10){try{return(await(await fetch(`${LB_API}/api/scores?gameId=${GAME_ID}&limit=${l}`)).json()).scores||[]}catch(e){return[]}}

const C=document.getElementById('c'),X=C.getContext('2d'),ui=document.getElementById('ui-content');
const juicedEl=document.getElementById('juiced');
let W,H;
function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
resize();window.addEventListener('resize',resize);

let state='menu';
let juice=0; // 0-100
let strokes=0;
let startTime=0;
let elapsed=0;
let lastY=null;
let lastDir=0;
let strokeDist=0;
let eggplantShake=0;
let eggplantSquish=1;
let particles=[];
let splashes=[];
let juiceDrops=[];
let comboTimer=0;
let combo=0;
let bestTime=Infinity;
let juiceColor='#7B2D8E';
let screenJuice=0; // how juiced the screen is 0-1
let level=1;
let totalScore=0;
let eggplantsJuiced=0;

// Eggplant types per level
const EGGPLANTS=[
  {name:'Baby Eggplant',size:1,toughness:1,emoji:'🍆',color:'#7B2D8E',juiceColor:'#9B59B6'},
  {name:'Thicc Eggplant',size:1.3,toughness:1.5,emoji:'🍆',color:'#5B1D6E',juiceColor:'#8E44AD'},
  {name:'Mega Eggplant',size:1.6,toughness:2,emoji:'🍆',color:'#4A0E5C',juiceColor:'#6C3483'},
  {name:'Golden Eggplant',size:1.2,toughness:1.2,emoji:'🍆',color:'#FFD700',juiceColor:'#FFC107'},
  {name:'Cursed Eggplant',size:1.8,toughness:3,emoji:'🍆',color:'#1a0a2e',juiceColor:'#4A148C'},
];
let currentPlant=EGGPLANTS[0];

// Input
let isDown=false;
function onDown(y){
  if(state!=='playing')return;
  isDown=true;lastY=y;strokeDist=0;
  document.body.classList.add('juicing');
}
function onMove(y){
  if(!isDown||state!=='playing')return;
  const dy=y-lastY;
  const dir=Math.sign(dy);
  
  // Count direction changes as strokes
  if(dir!==0&&dir!==lastDir&&Math.abs(strokeDist)>20){
    strokes++;
    strokeDist=0;
    comboTimer=30;
    combo++;
    
    // Add juice based on vigor
    const vigor=Math.min(Math.abs(dy),40);
    const juiceGain=(vigor/40)*(.8+combo*.05)/currentPlant.toughness;
    juice=Math.min(100,juice+juiceGain);
    
    // Effects
    eggplantShake=8;
    eggplantSquish=0.85;
    
    // Splash particles
    const splashCount=Math.floor(vigor/8);
    for(let i=0;i<splashCount;i++){
      const angle=Math.random()*Math.PI*2;
      const spd=Math.random()*vigor*.15+2;
      splashes.push({
        x:W/2+(Math.random()-.5)*40,
        y:H/2+(Math.random()-.5)*60,
        dx:Math.cos(angle)*spd,dy:Math.sin(angle)*spd,
        life:1,color:currentPlant.juiceColor,
        sz:Math.random()*8+3
      });
    }
    
    // Juice drops falling
    if(juice>20){
      juiceDrops.push({
        x:W/2+(Math.random()-.5)*50,
        y:H/2+60*currentPlant.size,
        dx:(Math.random()-.5)*2,dy:Math.random()*2+1,
        life:1,sz:Math.random()*6+3
      });
    }
  }
  
  strokeDist+=dy;
  lastDir=dir;
  lastY=y;
}
function onUp(){
  isDown=false;lastY=null;
  document.body.classList.remove('juicing');
}

C.addEventListener('mousedown',e=>onDown(e.clientY));
C.addEventListener('mousemove',e=>onMove(e.clientY));
C.addEventListener('mouseup',onUp);
C.addEventListener('mouseleave',onUp);
C.addEventListener('touchstart',e=>{onDown(e.touches[0].clientY);e.preventDefault()},{passive:false});
C.addEventListener('touchmove',e=>{onMove(e.touches[0].clientY);e.preventDefault()},{passive:false});
C.addEventListener('touchend',onUp);

function reset(){
  juice=0;strokes=0;startTime=Date.now();elapsed=0;
  lastY=null;lastDir=0;strokeDist=0;
  eggplantShake=0;eggplantSquish=1;
  particles=[];splashes=[];juiceDrops=[];
  comboTimer=0;combo=0;screenJuice=0;
  level=1;totalScore=0;eggplantsJuiced=0;
  currentPlant=EGGPLANTS[0];
  juicedEl.style.opacity=0;
}

function nextEggplant(){
  eggplantsJuiced++;
  level++;
  juice=0;strokes=0;comboTimer=0;combo=0;
  splashes=[];juiceDrops=[];
  eggplantShake=0;eggplantSquish=1;
  currentPlant=EGGPLANTS[Math.min(level-1,EGGPLANTS.length-1)];
  startTime=Date.now();
}

function update(){
  if(state!=='playing')return;
  
  elapsed=Date.now()-startTime;
  
  // Combo decay
  if(comboTimer>0)comboTimer--;
  else combo=0;
  
  // Eggplant physics
  if(eggplantShake>0)eggplantShake-=.5;
  eggplantSquish+=(1-eggplantSquish)*.15;
  
  // Screen juice effect
  screenJuice+=(juice/100-screenJuice)*.05;
  
  // Juice complete!
  if(juice>=100){
    const timeScore=Math.max(1,Math.round(10000/(elapsed/1000)));
    const strokeBonus=Math.max(0,200-strokes)*5;
    const levelBonus=level*500;
    totalScore+=timeScore+strokeBonus+levelBonus;
    
    // JUICED screen effect
    screenJuice=1;
    juicedEl.style.background=currentPlant.juiceColor;
    juicedEl.style.opacity=0.6;
    
    // Explosion of juice
    for(let i=0;i<60;i++){
      const angle=Math.random()*Math.PI*2;
      const spd=Math.random()*12+3;
      splashes.push({
        x:W/2,y:H/2,
        dx:Math.cos(angle)*spd,dy:Math.sin(angle)*spd,
        life:1.5,color:currentPlant.juiceColor,sz:Math.random()*15+5
      });
    }
    
    // If we've done all eggplant types, game over with score
    if(level>=EGGPLANTS.length){
      setTimeout(()=>{
        juicedEl.style.opacity=0;
        showGameOver();
      },1500);
    }else{
      setTimeout(()=>{
        juicedEl.style.opacity=0;
        nextEggplant();
      },1200);
    }
    
    juice=101; // prevent re-trigger
  }
  
  // Update particles
  splashes.forEach(p=>{
    p.x+=p.dx;p.y+=p.dy;p.dy+=.15;
    p.life-=.02;p.dx*=.98;
  });
  splashes=splashes.filter(p=>p.life>0);
  
  juiceDrops.forEach(d=>{
    d.y+=d.dy;d.dy+=.1;d.dx*=.99;d.x+=d.dx;
    d.life-=.008;
  });
  juiceDrops=juiceDrops.filter(d=>d.life>0&&d.y<H+20);
}

function draw(){
  // Background - gets more purple/juicy as juice increases
  const bg1=lerpC([45,21,54],[123,45,142],screenJuice*.5);
  const bg2=lerpC([20,8,30],[80,20,100],screenJuice*.5);
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${bg1})`);g.addColorStop(1,`rgb(${bg2})`);
  X.fillStyle=g;X.fillRect(0,0,W,H);
  
  // Background pattern
  X.globalAlpha=.03;X.font='30px serif';X.textAlign='center';
  for(let i=0;i<20;i++){
    X.fillText('🍆',(i*97+Date.now()*.01)%W,(i*131+Date.now()*.008)%H);
  }
  X.globalAlpha=1;
  
  if(state==='menu'||state==='gameover'){requestAnimationFrame(draw);return}
  
  // Juice puddle on ground
  if(juice>10){
    const puddleW=80+juice*2;
    const puddleH=15+juice*.3;
    X.fillStyle=currentPlant.juiceColor+'60';
    X.beginPath();
    X.ellipse(W/2,H/2+80*currentPlant.size+20,puddleW/2,puddleH/2,0,0,Math.PI*2);
    X.fill();
  }
  
  // Juice drops
  juiceDrops.forEach(d=>{
    X.globalAlpha=d.life;
    X.fillStyle=currentPlant.juiceColor;
    X.beginPath();X.arc(d.x,d.y,d.sz,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;
  
  // Eggplant
  const cx=W/2+(eggplantShake>0?(Math.random()-.5)*eggplantShake*2:0);
  const cy=H/2;
  const scale=currentPlant.size;
  const squishX=1+(1-eggplantSquish)*.5;
  const squishY=eggplantSquish;
  
  X.save();
  X.translate(cx,cy);
  X.scale(squishX,squishY);
  
  // Shadow
  X.fillStyle='rgba(0,0,0,.2)';
  X.beginPath();X.ellipse(0,75*scale,45*scale,12*scale,0,0,Math.PI*2);X.fill();
  
  // Main body
  const bodyGrad=X.createRadialGradient(-10*scale,-10*scale,5,0,0,65*scale);
  bodyGrad.addColorStop(0,lerpCS(currentPlant.color,[255,255,255],.3));
  bodyGrad.addColorStop(.6,currentPlant.color);
  bodyGrad.addColorStop(1,lerpCS(currentPlant.color,[0,0,0],.3));
  X.fillStyle=bodyGrad;
  
  // Eggplant shape - bottom heavy oval
  X.beginPath();
  X.moveTo(0,-60*scale);
  X.bezierCurveTo(25*scale,-55*scale,45*scale,-20*scale,40*scale,20*scale);
  X.bezierCurveTo(38*scale,50*scale,20*scale,70*scale,0,72*scale);
  X.bezierCurveTo(-20*scale,70*scale,-38*scale,50*scale,-40*scale,20*scale);
  X.bezierCurveTo(-45*scale,-20*scale,-25*scale,-55*scale,0,-60*scale);
  X.fill();
  
  // Shine
  X.fillStyle='rgba(255,255,255,.15)';
  X.beginPath();
  X.ellipse(-15*scale,-20*scale,12*scale,30*scale,-.3,0,Math.PI*2);
  X.fill();
  
  // Stem/cap
  X.fillStyle='#4CAF50';
  X.beginPath();
  X.moveTo(-15*scale,-58*scale);
  X.quadraticCurveTo(-8*scale,-75*scale,0,-72*scale);
  X.quadraticCurveTo(8*scale,-75*scale,15*scale,-58*scale);
  X.quadraticCurveTo(5*scale,-62*scale,-5*scale,-62*scale);
  X.fill();
  // Leaf
  X.fillStyle='#66BB6A';
  X.beginPath();
  X.moveTo(0,-68*scale);
  X.quadraticCurveTo(15*scale,-85*scale,8*scale,-65*scale);
  X.fill();
  
  // Face based on juice level
  const eyeY=-10*scale;
  if(juice<30){
    // Normal face
    X.fillStyle='#fff';
    X.beginPath();X.arc(-12*scale,eyeY,6*scale,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(12*scale,eyeY,6*scale,0,Math.PI*2);X.fill();
    X.fillStyle='#333';
    X.beginPath();X.arc(-11*scale,eyeY,3*scale,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(13*scale,eyeY,3*scale,0,Math.PI*2);X.fill();
    // Mouth
    X.strokeStyle='#333';X.lineWidth=2;
    X.beginPath();X.arc(0,5*scale,8*scale,.1*Math.PI,.9*Math.PI);X.stroke();
  }else if(juice<70){
    // Worried face
    X.fillStyle='#fff';
    X.beginPath();X.arc(-12*scale,eyeY-3*scale,7*scale,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(12*scale,eyeY-3*scale,7*scale,0,Math.PI*2);X.fill();
    X.fillStyle='#333';
    X.beginPath();X.arc(-11*scale,eyeY,3.5*scale,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(13*scale,eyeY,3.5*scale,0,Math.PI*2);X.fill();
    // Sweat
    X.fillStyle='#87CEEB';
    X.beginPath();X.arc(20*scale,eyeY-5*scale,3*scale,0,Math.PI*2);X.fill();
    // Worried mouth
    X.strokeStyle='#333';X.lineWidth=2;
    X.beginPath();X.arc(0,12*scale,6*scale,1.1*Math.PI,1.9*Math.PI);X.stroke();
  }else{
    // Panicking face
    X.fillStyle='#fff';
    X.beginPath();X.arc(-12*scale,eyeY-5*scale,8*scale,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(12*scale,eyeY-5*scale,8*scale,0,Math.PI*2);X.fill();
    X.fillStyle='#333';
    const lookDir=Math.sin(Date.now()*.01)*2;
    X.beginPath();X.arc(-11*scale+lookDir,eyeY-2*scale,2*scale,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(13*scale+lookDir,eyeY-2*scale,2*scale,0,Math.PI*2);X.fill();
    // Mouth open
    X.fillStyle='#333';
    X.beginPath();X.ellipse(0,10*scale,8*scale,10*scale,0,0,Math.PI*2);X.fill();
    X.fillStyle='#E57373';
    X.beginPath();X.ellipse(0,12*scale,5*scale,5*scale,0,0,Math.PI*2);X.fill();
    // Multiple sweat drops
    X.fillStyle='#87CEEB';
    X.beginPath();X.arc(22*scale,eyeY-8*scale,3*scale,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(-22*scale,eyeY,2.5*scale,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(18*scale,5*scale,2*scale,0,Math.PI*2);X.fill();
  }
  
  X.restore();
  
  // Splash particles
  splashes.forEach(p=>{
    X.globalAlpha=Math.min(1,p.life);
    X.fillStyle=p.color;
    X.beginPath();X.arc(p.x,p.y,p.sz,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;
  
  // Juice meter
  const meterW=240,meterH=24;
  const meterX=(W-meterW)/2,meterY=H-60;
  X.fillStyle='rgba(0,0,0,.3)';
  X.fillRect(meterX,meterY,meterW,meterH);
  // Fill
  const fillPct=Math.min(1,juice/100);
  const meterGrad=X.createLinearGradient(meterX,0,meterX+meterW,0);
  meterGrad.addColorStop(0,'#9B59B6');meterGrad.addColorStop(1,'#FF69B4');
  X.fillStyle=meterGrad;
  X.fillRect(meterX,meterY,meterW*fillPct,meterH);
  // Border
  X.strokeStyle='#BB86FC';X.lineWidth=2;
  X.strokeRect(meterX,meterY,meterW,meterH);X.lineWidth=1;
  // Meter text
  X.font='bold 12px Nunito';X.textAlign='center';X.fillStyle='#fff';
  X.fillText(`${Math.min(100,Math.floor(juice))}% JUICED`,W/2,meterY+17);
  
  // HUD
  X.font='bold 16px Nunito';X.textAlign='left';
  X.fillStyle='#FF69B4';X.fillText(`🍆 ${currentPlant.name}`,12,30);
  X.font='13px Nunito';X.fillStyle='#BB86FC';
  X.fillText(`Level ${level}/${EGGPLANTS.length}`,12,50);
  
  X.textAlign='right';X.font='bold 16px Nunito';
  X.fillStyle='#FFD700';X.fillText(`Score: ${totalScore}`,W-12,30);
  X.font='13px Nunito';X.fillStyle='#aaa';
  X.fillText(`${strokes} strokes · ${(elapsed/1000).toFixed(1)}s`,W-12,50);
  
  // Combo
  if(combo>2){
    X.textAlign='center';
    X.font=`bold ${Math.min(32,16+combo)}px Lilita One`;
    X.fillStyle=combo>10?'#FF69B4':combo>5?'#BB86FC':'#fff';
    X.fillText(`${combo}x COMBO!`,W/2,H/2-100*currentPlant.size);
  }
  
  // Instructions
  if(juice<5&&strokes<3){
    X.textAlign='center';X.font='bold 16px Nunito';
    X.fillStyle='rgba(255,255,255,.5)';
    X.fillText('↕️ DRAG UP & DOWN VIGOROUSLY ↕️',W/2,H-100);
  }
}

function lerpC(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function lerpCS(hex,rgb,t){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgb(${Math.round(r+(rgb[0]-r)*t)},${Math.round(g+(rgb[1]-g)*t)},${Math.round(b+(rgb[2]-b)*t)})`;
}

function showMenu(){
  state='menu';
  ui.innerHTML=`<div class="panel">
    <h1>🍆 Eggplant Juicer 🍆</h1>
    <p>Drag your mouse/finger UP and DOWN vigorously<br>
    on the eggplant to juice it!<br><br>
    Juice 5 eggplants, each tougher than the last.<br>
    Faster = more points. Combos = faster juicing.<br>
    When it hits 100%... 💦 JUICED 💦</p>
    <button class="btn" id="go">Start Juicing 🍆</button>
  </div>`;
  document.getElementById('go').onclick=()=>{ui.innerHTML='';state='playing';reset()};
}

function showGameOver(){
  state='gameover';
  ui.innerHTML=`<div class="panel">
    <h1>💦 FULLY JUICED 💦</h1>
    <h2>Score: ${totalScore}</h2>
    <p>All ${EGGPLANTS.length} eggplants juiced!<br>
    Total strokes: ${strokes}</p>
    <input type="text" id="ni" placeholder="Juicer name" maxlength="16">
    <br><button class="btn" id="sub" style="margin-top:10px">Submit 🍆</button>
    <div id="lba"></div>
    <button class="btn" id="rep" style="margin-top:10px">Juice Again! 💦</button>
  </div>`;
  document.getElementById('sub').onclick=async()=>{
    const n=document.getElementById('ni').value.trim()||'Anonymous';
    document.getElementById('sub').textContent='...';
    await submitScore(n,totalScore);
    const sc=await getLeaderboard();
    document.getElementById('lba').innerHTML='<div class="lb"><h2>🏆 Top Juicers</h2>'+
      sc.map((s,i)=>`<div><span class="lr">#${i+1} ${s.playerName}</span><span class="ls">${s.score}</span></div>`).join('')+'</div>';
    document.getElementById('sub').style.display='none';
  };
  document.getElementById('rep').onclick=()=>{ui.innerHTML='';state='playing';reset()};
}

function loop(){update();draw();requestAnimationFrame(loop)}
showMenu();loop();
</script>
</body>
</html>
