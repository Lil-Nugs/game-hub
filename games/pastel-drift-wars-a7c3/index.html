<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pastel Drift Wars</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #f6efff, #e8f7ff 45%, #fff7ea);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; touch-action: none; font-family: 'Fredoka', sans-serif;
    }
    #ui-overlay {
      position: fixed; inset: 0; display: none; justify-content: center; align-items: center;
      z-index: 10; background: rgba(82, 92, 130, 0.35); backdrop-filter: blur(4px);
    }
    .panel {
      width: min(92vw, 420px); border-radius: 22px; padding: 20px;
      background: rgba(255,255,255,0.92); border: 2px solid #d4c5ff; color: #556;
      box-shadow: 0 18px 45px rgba(124, 116, 182, 0.28);
    }
    h2 { color: #7a6ad6; margin-bottom: 10px; }
    .score { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
    input, button {
      width: 100%; border-radius: 12px; padding: 11px 12px; margin-top: 8px;
      font: inherit; border: 1px solid #cabdf9;
    }
    button { background: #b8f0ff; cursor: pointer; border: 1px solid #93d7ee; font-weight: 600; }
    button:hover { filter: brightness(0.98); }
    #leaderboard { margin-top: 12px; max-height: 220px; overflow: auto; font-size: 0.95rem; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #e8defb; }
    .hint { font-size: 0.85rem; opacity: 0.8; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div class="panel">
      <h2>Soft Game Over ✨</h2>
      <div class="score" id="final-score">Score: 0</div>
      <input id="name-input" maxlength="16" placeholder="Your name" />
      <button id="submit-btn">Submit Score</button>
      <div id="leaderboard"></div>
      <button id="replay-btn">Play Again</button>
      <div class="hint">Tip: WASD/Arrows to drift. Hold mouse or touch to steer on mobile.</div>
    </div>
  </div>

<script src='../../shared/supabase-config.js'></script><script src='../../shared/supabase-client.js'></script><script>
// Design:
// - Genre: soothing arena survivor (Geometry Wars inspired)
// - Core mechanic: drift through a calm pastel field, auto-pulse projectiles, dodge incoming shapes
// - Death: enemy touches player
// - Difficulty: smooth time ramp via easing over 2 minutes (spawn, speed, fire cadence)
// - Visuals: candy/pastel palette, soft circles, low-contrast glow, floating ambience
// - Score: time alive * 10 + enemy pops * 12 + calm-orb pickups * 25

const GAME_ID = 'pastel-drift-wars-a7c3';
const LEADERBOARD_API = window.GAME_HUB_API_BASE;

async function submitScore(playerName, score) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gameId: GAME_ID, playerName, score })
    });
    return await res.json();
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return null;
  }
}

async function getLeaderboard(limit = 10) {
  try {
    const res = await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${limit}`);
    const data = await res.json();
    return data.scores || [];
  } catch (e) {
    console.warn('Leaderboard unavailable:', e);
    return [];
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type, freq, duration, volume, slide=1) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(Math.max(60, freq * slide), audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(volume || 0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
const sfxStart = () => { playSound('triangle', 420, 0.16, 0.16, 1.5); playSound('sine', 620, 0.2, 0.12, 1.2); };
const sfxShoot = () => playSound('sine', 700, 0.06, 0.06, 0.9);
const sfxPop = () => playSound('triangle', 540, 0.09, 0.11, 1.45);
const sfxOrb = () => { playSound('sine', 780, 0.08, 0.12, 1.2); playSound('sine', 1040, 0.1, 0.09, 1.1); };
const sfxDeath = () => { playSound('sawtooth', 260, 0.35, 0.2, 0.45); playSound('triangle', 180, 0.5, 0.15, 0.6); };

const overlay = document.getElementById('ui-overlay');
const finalScoreEl = document.getElementById('final-score');
const nameInput = document.getElementById('name-input');
const submitBtn = document.getElementById('submit-btn');
const replayBtn = document.getElementById('replay-btn');
const leaderboardEl = document.getElementById('leaderboard');
let replayHandler = null;

function renderLeaderboard(scores) {
  if (!scores.length) {
    leaderboardEl.innerHTML = '<div class="hint">No scores yet — be the first gentle champion 🌸</div>';
    return;
  }
  leaderboardEl.innerHTML = scores.map((s, i) => `<div class="row"><span>${i+1}. ${s.playerName}</span><strong>${s.score}</strong></div>`).join('');
}

function showGameOverUI(finalScore) {
  finalScoreEl.textContent = `Score: ${finalScore}`;
  nameInput.value = '';
  overlay.style.display = 'flex';
  leaderboardEl.innerHTML = '<div class="hint">Loading leaderboard…</div>';

  getLeaderboard().then(renderLeaderboard);

  submitBtn.onclick = async () => {
    const playerName = (nameInput.value || 'Anonymous').trim().slice(0, 16) || 'Anonymous';
    submitBtn.disabled = true;
    await submitScore(playerName, finalScore);
    const scores = await getLeaderboard();
    renderLeaderboard(scores);
    submitBtn.disabled = false;
  };

  replayBtn.onclick = () => {
    overlay.style.display = 'none';
    if (replayHandler) replayHandler();
  };
}

function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

class MenuScene extends Phaser.Scene {
  constructor() { super('MenuScene'); }
  create() {
    const { width, height } = this.scale;
    const g = this.add.graphics();
    g.fillGradientStyle(0xf7f1ff,0xf7f1ff,0xe9f8ff,0xfff6ea,1,1,1,1);
    g.fillRect(0,0,width,height);

    this.add.text(width/2, height*0.27, 'Pastel Drift Wars', { fontFamily: 'Fredoka', fontSize: '52px', color: '#7e6bd8' }).setOrigin(0.5);
    this.add.text(width/2, height*0.43,
      'Like Geometry Wars, but calm:\nDrift, breathe, and survive the soft storm.',
      { fontFamily: 'Fredoka', fontSize: '24px', align: 'center', color: '#5f6690' }).setOrigin(0.5);
    this.add.text(width/2, height*0.62,
      'Move: WASD / Arrows\nAlso hold mouse/touch to glide\nAuto-fire pulses pop incoming shapes',
      { fontFamily: 'Fredoka', fontSize: '20px', align: 'center', color: '#6f78a5' }).setOrigin(0.5);

    const start = this.add.text(width/2, height*0.82, 'Tap or Press Any Key to Begin ✨',
      { fontFamily: 'Fredoka', fontSize: '24px', color: '#8868e8', backgroundColor: '#ffffffb8', padding: {x:14,y:8} }).setOrigin(0.5);
    this.tweens.add({ targets: start, alpha: 0.45, duration: 900, yoyo: true, repeat: -1 });

    const begin = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      sfxStart();
      this.scene.start('GameScene');
    };
    this.input.once('pointerdown', begin);
    this.input.keyboard.once('keydown', begin);
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }
  create() {
    const { width, height } = this.scale;
    this.gameStartTime = this.time.now;
    this.alive = true;
    this.bonus = 0;
    this.kills = 0;

    const bg = this.add.graphics();
    bg.fillGradientStyle(0xf6efff,0xf6efff,0xe8f7ff,0xfff7ea,1,1,1,1);
    bg.fillRect(0,0,width,height);
    for (let i=0;i<26;i++) {
      const c = Phaser.Utils.Array.GetRandom([0xffc8e9,0xcde8ff,0xd8ffc8,0xffe6b8,0xe2d5ff]);
      bg.fillStyle(c, 0.16);
      const r = Phaser.Math.Between(20, 75);
      bg.fillCircle(Phaser.Math.Between(0,width), Phaser.Math.Between(0,height), r);
    }

    this.makeTextures();

    this.player = this.physics.add.image(width/2, height/2, 'player');
    this.player.setDamping(true).setDrag(0.92).setMaxVelocity(300,300);
    this.player.body.setCircle(18, 14, 14);

    this.enemies = this.physics.add.group();
    this.bullets = this.physics.add.group();
    this.orbs = this.physics.add.group();

    this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
    this.physics.add.overlap(this.player, this.enemies, this.playerHit, null, this);
    this.physics.add.overlap(this.player, this.orbs, this.collectOrb, null, this);

    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D');
    this.pointer = this.input.activePointer;

    this.scoreText = this.add.text(18, 14, 'Score: 0', { fontFamily:'Fredoka', fontSize:'28px', color:'#5f6898' });
    this.timeText = this.add.text(18, 48, 'Time: 0.0s', { fontFamily:'Fredoka', fontSize:'20px', color:'#7d85b2' });

    this.nextSpawn = 0;
    this.nextShot = 0;
    this.nextOrb = 2200;

    replayHandler = () => this.scene.restart();
  }

  makeTextures() {
    const g = this.add.graphics();

    g.clear();
    g.fillStyle(0xa18dff,1); g.fillCircle(32,32,26);
    g.lineStyle(5,0xffffff,0.9); g.strokeCircle(32,32,22);
    g.fillStyle(0xffffff,0.45); g.fillCircle(24,23,9);
    g.generateTexture('player', 64,64);

    g.clear();
    g.fillStyle(0xff9fcb,1); g.fillTriangle(32,6, 58,56, 6,56);
    g.lineStyle(4,0xffffff,0.82); g.strokeTriangle(32,10, 53,52, 11,52);
    g.generateTexture('enemyA', 64,64);

    g.clear();
    g.fillStyle(0x9ad7ff,1); g.fillRect(10,10,44,44);
    g.lineStyle(4,0xffffff,0.85); g.strokeRect(14,14,36,36);
    g.fillStyle(0xffffff,0.3); g.fillCircle(26,26,7);
    g.generateTexture('enemyB', 64,64);

    g.clear();
    g.fillStyle(0xffe3a5,1); g.fillCircle(12,12,12); g.fillCircle(34,12,12); g.fillCircle(23,28,14);
    g.generateTexture('bullet', 48,48);

    g.clear();
    g.fillStyle(0xb8ffd6,1); g.fillCircle(20,20,16);
    g.lineStyle(3,0xffffff,0.85); g.strokeCircle(20,20,12);
    g.generateTexture('orb', 40,40);

    g.destroy();
  }

  spawnEnemy(difficulty) {
    const { width, height } = this.scale;
    const edge = Phaser.Math.Between(0, 3);
    let x,y;
    if (edge===0) { x=-30; y=Phaser.Math.Between(20,height-20); }
    else if (edge===1) { x=width+30; y=Phaser.Math.Between(20,height-20); }
    else if (edge===2) { y=-30; x=Phaser.Math.Between(20,width-20); }
    else { y=height+30; x=Phaser.Math.Between(20,width-20); }

    const key = Math.random() < 0.55 ? 'enemyA' : 'enemyB';
    const enemy = this.enemies.create(x, y, key);
    enemy.setScale(Phaser.Math.FloatBetween(0.68, 1.12));
    enemy.angleVel = Phaser.Math.FloatBetween(-100,100);
    enemy.speed = lerp(45, 185, difficulty) * Phaser.Math.FloatBetween(0.9, 1.2);
    enemy.body.setCircle(14, 18, 18);
  }

  shootAtNearest(difficulty) {
    if (!this.enemies.getLength()) return;
    const p = this.player;
    let nearest = null, nd = Infinity;
    this.enemies.children.iterate(e => {
      if (!e || !e.active) return;
      const d = Phaser.Math.Distance.Between(p.x,p.y,e.x,e.y);
      if (d < nd) { nd = d; nearest = e; }
    });
    if (!nearest) return;

    const b = this.bullets.create(p.x, p.y, 'bullet');
    b.setScale(0.42);
    b.body.setCircle(8, 8, 8);
    const angle = Phaser.Math.Angle.Between(p.x,p.y, nearest.x, nearest.y);
    const spd = lerp(280, 420, difficulty);
    b.setVelocity(Math.cos(angle)*spd, Math.sin(angle)*spd);
    b.life = 1200;
    sfxShoot();
  }

  hitEnemy(b, e) {
    if (!b.active || !e.active) return;
    b.destroy();
    e.destroy();
    this.kills += 1;
    this.bonus += 12;
    sfxPop();

    const puff = this.add.circle(e.x, e.y, 7, 0xffffff, 0.95);
    this.tweens.add({ targets: puff, radius: 34, alpha: 0, duration: 260, onComplete: () => puff.destroy() });
  }

  collectOrb(player, orb) {
    orb.destroy();
    this.bonus += 25;
    sfxOrb();
    player.setScale(1.09);
    this.tweens.add({ targets: player, scale: 1, duration: 170, ease: 'Back.Out' });
  }

  playerHit() {
    if (!this.alive) return;
    this.alive = false;
    sfxDeath();
    this.cameras.main.shake(260, 0.009);
    this.cameras.main.flash(240, 255, 235, 250);
    this.player.setTint(0xffffff);
    this.tweens.add({ targets: this.player, alpha: 0, angle: 220, scale: 0.4, duration: 480, ease: 'Cubic.In' });

    const score = Math.floor(this.getElapsed()*10 + this.bonus);
    this.time.delayedCall(520, () => {
      this.scene.pause();
      showGameOverUI(score);
    });
  }

  getElapsed() { return (this.time.now - this.gameStartTime) / 1000; }

  update(time, delta) {
    if (!this.alive) return;
    const dt = delta / 16.667;
    const elapsed = this.getElapsed();
    const t = Math.min(elapsed / 120, 1);
    const difficulty = easeInOut(t);

    let ix = 0, iy = 0;
    if (this.keys.A.isDown || this.cursors.left.isDown) ix -= 1;
    if (this.keys.D.isDown || this.cursors.right.isDown) ix += 1;
    if (this.keys.W.isDown || this.cursors.up.isDown) iy -= 1;
    if (this.keys.S.isDown || this.cursors.down.isDown) iy += 1;

    if (this.pointer.isDown) {
      const ang = Phaser.Math.Angle.Between(this.player.x, this.player.y, this.pointer.worldX, this.pointer.worldY);
      ix += Math.cos(ang) * 0.9;
      iy += Math.sin(ang) * 0.9;
    }

    const accel = lerp(9, 12, difficulty);
    this.player.setAcceleration(ix * accel * 20, iy * accel * 20);
    this.player.x = Phaser.Math.Clamp(this.player.x, 18, this.scale.width - 18);
    this.player.y = Phaser.Math.Clamp(this.player.y, 18, this.scale.height - 18);

    const spawnEvery = lerp(1200, 290, difficulty);
    if (time >= this.nextSpawn) {
      this.spawnEnemy(difficulty);
      this.nextSpawn = time + spawnEvery;
    }

    const shotEvery = lerp(320, 130, difficulty);
    if (time >= this.nextShot) {
      this.shootAtNearest(difficulty);
      this.nextShot = time + shotEvery;
    }

    if (time >= this.nextOrb) {
      const orb = this.orbs.create(Phaser.Math.Between(40, this.scale.width - 40), Phaser.Math.Between(40, this.scale.height - 40), 'orb');
      orb.body.setCircle(11, 9, 9);
      orb.life = 5600;
      this.nextOrb = time + lerp(4600, 2700, difficulty);
    }

    this.enemies.children.iterate(e => {
      if (!e || !e.active) return;
      const ang = Phaser.Math.Angle.Between(e.x,e.y,this.player.x,this.player.y);
      e.setVelocity(Math.cos(ang)*e.speed*dt, Math.sin(ang)*e.speed*dt);
      e.rotation += (e.angleVel * dt) * 0.002;
      if (e.x < -60 || e.x > this.scale.width + 60 || e.y < -60 || e.y > this.scale.height + 60) e.destroy();
    });

    this.bullets.children.iterate(b => {
      if (!b || !b.active) return;
      b.life -= delta;
      if (b.life <= 0) b.destroy();
    });
    this.orbs.children.iterate(o => {
      if (!o || !o.active) return;
      o.life -= delta;
      o.rotation += 0.02 * dt;
      o.alpha = 0.65 + Math.sin(time * 0.006) * 0.2;
      if (o.life <= 0) o.destroy();
    });

    const score = Math.floor(elapsed * 10 + this.bonus);
    this.scoreText.setText(`Score: ${score}`);
    this.timeText.setText(`Time: ${elapsed.toFixed(1)}s`);
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  width: 900,
  height: 600,
  backgroundColor: '#f6efff',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, GameScene]
});
</script>
</body>
</html>
