<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kawaii Killzone</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFB7C5;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Nunito',sans-serif}
canvas{display:block;touch-action:none}
#ui-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:10}
#ui-overlay>div{pointer-events:auto}
.panel{background:rgba(255,255,255,.96);border:4px solid #FF69B4;border-radius:24px;padding:28px;text-align:center;color:#333;max-width:440px;width:92vw;max-height:92vh;overflow-y:auto;box-shadow:0 10px 40px rgba(255,105,180,.3)}
.panel h1{font-family:'Lilita One',sans-serif;font-size:28px;color:#FF1493;margin-bottom:8px}
.panel h2{font-size:18px;color:#9B59B6;margin-bottom:10px}
.panel p{font-size:12px;line-height:1.8;color:#777;margin-bottom:10px}
.btn{font-family:'Lilita One',sans-serif;font-size:18px;padding:14px 32px;border:3px solid #FF69B4;background:linear-gradient(135deg,#FF69B4,#FF1493);color:#fff;cursor:pointer;border-radius:50px;margin:8px;transition:all .2s;box-shadow:0 4px 15px rgba(255,105,180,.4)}
.btn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(255,105,180,.5)}
input[type="text"]{font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;padding:12px;border:3px solid #FF69B4;background:#FFF0F5;color:#FF1493;border-radius:50px;width:220px;text-align:center;outline:none}
.lb{text-align:left;margin-top:14px}.lb div{font-size:13px;padding:6px 0;color:#666;border-bottom:1px solid #FFE4E1;display:flex;justify-content:space-between}
.lr{color:#FF1493;font-weight:700}.ls{color:#9B59B6;font-weight:700}
</style>
</head>
<body>
<a href="../../index.html" style="position:fixed;top:10px;left:10px;z-index:100;font-size:12px;color:#fff;text-decoration:none;background:rgba(255,105,180,0.6);padding:4px 12px;border-radius:20px;font-family:sans-serif;">← Hub</a>
<canvas id="c"></canvas>
<div id="ui-overlay"><div id="ui-content"></div></div>
<script>
const GAME_ID='zombie-march-ab54';
const LEADERBOARD_API='https://game-leaderboard.mattgames.workers.dev';
async function submitScore(n,s){try{const r=await fetch(`${LEADERBOARD_API}/api/scores`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameId:GAME_ID,playerName:n,score:s})});return await r.json()}catch(e){return null}}
async function getLeaderboard(l=10){try{const r=await fetch(`${LEADERBOARD_API}/api/scores?gameId=${GAME_ID}&limit=${l}`);const d=await r.json();return d.scores||[]}catch(e){return[]}}

const C=document.getElementById('c'),X=C.getContext('2d'),ui=document.getElementById('ui-content');
let W,H;
function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
resize();window.addEventListener('resize',resize);

// Road dimensions
const ROAD_W=300,LANE_W=150;
function roadL(){return(W-ROAD_W)/2}
function roadR(){return(W+ROAD_W)/2}
function roadCenter(){return W/2}

// State
let state='menu',score=0,distance=0,soldiers=5,weapon='pistol',fireRate=0,shieldHP=0;
let marchSpeed=1.5,scrollY=0,shootTimer=0;
let playerX=W/2;
let army=[],zombies=[],bullets=[],gates=[],barriers=[],particles=[],floats=[],powerups=[];
let gateSpawnDist=0,zombieSpawnDist=0,barrierSpawnDist=0;
let combo=0,maxCombo=0;

// Weapons
const WEAPONS={
  pistol:{name:'Pistol',emoji:'🔫',rate:18,dmg:1,count:1,spread:0,color:'#FFD700',bullet:'•'},
  shotgun:{name:'Shotgun',emoji:'💥',rate:30,dmg:1,count:5,spread:.4,color:'#FF8C00',bullet:'•'},
  laser:{name:'Laser',emoji:'⚡',rate:6,dmg:.5,count:1,spread:0,color:'#FF69B4',bullet:'─'},
  rocket:{name:'Rocket',emoji:'🚀',rate:45,dmg:8,count:1,spread:0,color:'#FF1493',bullet:'★',splash:40},
  minigun:{name:'Minigun',emoji:'🔥',rate:4,dmg:.4,count:2,spread:.15,color:'#FF4500',bullet:'·'},
};

// Input
let inputX=null,dragging=false;
C.addEventListener('mousedown',e=>{dragging=true;inputX=e.clientX});
C.addEventListener('mousemove',e=>{if(dragging)inputX=e.clientX});
C.addEventListener('mouseup',()=>dragging=false);
C.addEventListener('touchstart',e=>{inputX=e.touches[0].clientX;e.preventDefault()},{passive:false});
C.addEventListener('touchmove',e=>{inputX=e.touches[0].clientX;e.preventDefault()},{passive:false});
C.addEventListener('touchend',()=>{inputX=null});

function reset(){
  score=0;distance=0;soldiers=5;weapon='pistol';fireRate=0;shieldHP=0;
  marchSpeed=1.5;scrollY=0;shootTimer=0;combo=0;maxCombo=0;
  playerX=W/2;
  army=[];zombies=[];bullets=[];gates=[];barriers=[];particles=[];floats=[];powerups=[];
  gateSpawnDist=300;zombieSpawnDist=200;barrierSpawnDist=400;
  rebuildArmy();
}

function rebuildArmy(){
  army=[];
  const cols=Math.min(soldiers,5);
  const rows=Math.ceil(soldiers/cols);
  for(let i=0;i<soldiers;i++){
    const col=i%cols,row=Math.floor(i/cols);
    army.push({
      offX:(col-(cols-1)/2)*22,
      offY:row*20+10,
      shootOff:Math.random()*20,
      hue:Math.random()*360
    });
  }
}

function addFloat(x,y,text,color,size=18){floats.push({x,y,text,color,size,life:50})}
function addParticles(x,y,color,n=6,sz=4){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*3+1;
  particles.push({x,y,dx:Math.cos(a)*s,dy:Math.sin(a)*s-1,life:1,color,size:Math.random()*sz+1})}
}

function spawnGatePair(){
  const y=-80-scrollY;
  // Two gates side by side - pick left or right
  const gateTypes=[
    ()=>{const n=Math.floor(Math.random()*8+3);return{label:`+${n}`,color:'#7BC67E',apply:()=>{soldiers+=n;rebuildArmy()}}},
    ()=>{const n=Math.floor(Math.random()*3+2);return{label:`×${n}`,color:'#64B5F6',apply:()=>{soldiers=Math.floor(soldiers*n);rebuildArmy()}}},
    ()=>{const n=Math.floor(Math.random()*5+2);return{label:`−${n}`,color:'#EF5350',apply:()=>{soldiers=Math.max(1,soldiers-n);rebuildArmy()}}},
    ()=>{const n=Math.floor(Math.random()*2+2);return{label:`÷${n}`,color:'#FF8A65',apply:()=>{soldiers=Math.max(1,Math.ceil(soldiers/n));rebuildArmy()}}},
    ()=>{const wps=Object.keys(WEAPONS).filter(w=>w!==weapon);const w=wps[Math.floor(Math.random()*wps.length)];return{label:WEAPONS[w].emoji+' '+WEAPONS[w].name,color:'#CE93D8',apply:()=>{weapon=w}}},
    ()=>({label:'🛡️ Shield',color:'#4FC3F7',apply:()=>{shieldHP+=3}}),
    ()=>({label:'⚡ Speed+',color:'#FFF176',apply:()=>{marchSpeed+=.2}}),
  ];
  // Make sure the pair isn't identical
  const t1=gateTypes[Math.floor(Math.random()*gateTypes.length)]();
  let t2;do{t2=gateTypes[Math.floor(Math.random()*gateTypes.length)]()}while(t2.label===t1.label);
  const rl=roadL(),mid=roadCenter();
  gates.push({x:rl+LANE_W/2,y,w:LANE_W-12,h:50,...t1,hit:false});
  gates.push({x:mid+LANE_W/2,y,w:LANE_W-12,h:50,...t2,hit:false});
}

function spawnZombieWave(){
  const y=-60-scrollY;
  const count=Math.floor(2+distance/500);
  const hpScale=1+distance/800;
  for(let i=0;i<count;i++){
    const x=roadL()+30+Math.random()*(ROAD_W-60);
    const types=[
      {emoji:'🧟',hp:2*hpScale,speed:.3,reward:5,size:18},
      {emoji:'💀',hp:4*hpScale,speed:.5,reward:10,size:16},
      {emoji:'👹',hp:8*hpScale,speed:.2,reward:20,size:22},
      {emoji:'🎃',hp:3*hpScale,speed:.7,reward:8,size:16},
      {emoji:'👻',hp:1.5*hpScale,speed:.9,reward:6,size:14},
    ];
    const tier=Math.min(Math.floor(Math.random()*Math.random()*(1+distance/400)),types.length-1);
    const t=types[tier];
    zombies.push({x:x-scrollY*0+0,y:y-i*40,hp:t.hp,maxHp:t.hp,emoji:t.emoji,speed:t.speed,reward:t.reward,size:t.size});
  }
}

function spawnBarrier(){
  const y=-60-scrollY;
  const x=roadL()+40+Math.random()*(ROAD_W-80);
  const hp=5+distance/200;
  barriers.push({x,y,w:50+Math.random()*30,h:20,hp,maxHp:hp,color:'#A1887F'});
}

function shoot(){
  const w=WEAPONS[weapon];
  const baseY=H*.75;
  army.forEach((s,i)=>{
    if((shootTimer+s.shootOff)%Math.max(2,Math.round(w.rate))!==0)return;
    const sx=playerX+s.offX;
    for(let b=0;b<w.count;b++){
      const angle=-Math.PI/2+(b-(w.count-1)/2)*w.spread+(Math.random()-.5)*.05;
      bullets.push({
        x:sx,y:baseY-s.offY,
        dx:Math.cos(angle)*8,dy:Math.sin(angle)*8,
        dmg:w.dmg,color:w.color,size:w.bullet==='★'?6:w.bullet==='─'?1:3,
        shape:w.bullet,splash:w.splash||0,life:80
      });
    }
  });
}

function update(){
  if(state!=='playing')return;

  // March forward
  const eff=marchSpeed;
  scrollY+=eff;
  distance+=eff;
  score+=Math.floor(eff);

  // Player horizontal movement
  if(inputX!==null){
    const target=Math.max(roadL()+20,Math.min(roadR()-20,inputX));
    playerX+=(target-playerX)*.12;
  }

  // Shooting
  shootTimer++;
  shoot();

  // Spawn gates
  if(distance>=gateSpawnDist){
    spawnGatePair();
    gateSpawnDist=distance+250+Math.random()*150;
  }
  // Spawn zombies
  if(distance>=zombieSpawnDist){
    spawnZombieWave();
    zombieSpawnDist=distance+120+Math.random()*100;
  }
  // Spawn barriers
  if(distance>=barrierSpawnDist){
    spawnBarrier();
    barrierSpawnDist=distance+300+Math.random()*200;
  }

  const playerBaseY=H*.75;

  // Move bullets
  bullets.forEach(b=>{
    b.x+=b.dx;b.y+=b.dy;b.life--;
    // Hit zombies
    zombies.forEach(z=>{
      if(z.dead)return;
      const dx=b.x-z.x,dy=b.y-(z.y+scrollY);
      if(Math.abs(dx)<z.size&&Math.abs(dy)<z.size){
        z.hp-=b.dmg;b.life=0;
        addParticles(b.x,z.y+scrollY,'#FF69B4',3,3);
        if(b.splash>0){
          zombies.forEach(z2=>{
            if(z2===z||z2.dead)return;
            const d=Math.sqrt((z2.x-z.x)**2+(z2.y-z.y)**2);
            if(d<b.splash){z2.hp-=b.dmg*.5}
          });
          addParticles(b.x,z.y+scrollY,'#FF8C00',10,6);
        }
        if(z.hp<=0){
          z.dead=true;score+=z.reward;combo++;
          if(combo>maxCombo)maxCombo=combo;
          addFloat(z.x,z.y+scrollY,'+'+z.reward,'#FFD700');
          addParticles(z.x,z.y+scrollY,'#9B59B6',8);
          // Kawaii death - hearts and stars
          addParticles(z.x,z.y+scrollY,'#FF69B4',5,5);
        }
      }
    });
    // Hit barriers
    barriers.forEach(br=>{
      if(br.dead)return;
      const bry=br.y+scrollY;
      if(b.x>br.x-br.w/2&&b.x<br.x+br.w/2&&b.y>bry-br.h/2&&b.y<bry+br.h/2){
        br.hp-=b.dmg;b.life=0;
        addParticles(b.x,bry,'#A1887F',2,2);
        if(br.hp<=0){br.dead=true;addParticles(br.x,bry,'#8D6E63',12);score+=10}
      }
    });
  });
  bullets=bullets.filter(b=>b.life>0&&b.y>-50&&b.y<H+50&&b.x>0&&b.x<W);

  // Move zombies toward player
  zombies.forEach(z=>{
    if(z.dead)return;
    z.y+=z.speed+eff*.3;
    // Slight tracking toward player
    const screenY=z.y+scrollY;
    if(screenY>-50){
      z.x+=(playerX-z.x)*.003;
    }
    // Hit player
    if(screenY>playerBaseY-30&&screenY<playerBaseY+40&&Math.abs(z.x-playerX)<40){
      // Zombie damages army
      const dmg=Math.ceil(z.maxHp/3);
      if(shieldHP>0){shieldHP-=dmg;if(shieldHP<0)shieldHP=0;addFloat(z.x,screenY,'Shield!','#4FC3F7')}
      else{soldiers=Math.max(0,soldiers-dmg);rebuildArmy();combo=0}
      z.dead=true;
      addParticles(z.x,screenY,'#FF1493',10);
      if(soldiers<=0){showGameOver();return}
    }
  });
  zombies=zombies.filter(z=>!z.dead&&z.y+scrollY<H+100);

  // Gate collision
  gates.forEach(g=>{
    if(g.hit)return;
    const gy=g.y+scrollY;
    if(gy>playerBaseY-30&&gy<playerBaseY+30&&Math.abs(playerX-g.x)<g.w/2){
      g.hit=true;g.apply();
      addFloat(g.x,gy-20,g.label,g.color,22);
      addParticles(g.x,gy,g.color,12);
      if(soldiers<=0){soldiers=1;rebuildArmy()}
    }
  });
  gates=gates.filter(g=>g.y+scrollY<H+100);

  // Barrier collision with player
  barriers.forEach(br=>{
    if(br.dead)return;
    const bry=br.y+scrollY;
    if(bry>playerBaseY-20&&bry<playerBaseY+30&&Math.abs(playerX-br.x)<br.w/2+20){
      if(!br.dead){
        soldiers=Math.max(1,soldiers-1);rebuildArmy();
        addParticles(playerX,bry,'#f44',5);
      }
    }
  });
  barriers=barriers.filter(br=>!br.dead&&br.y+scrollY<H+100);

  // Particles & floats
  particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.life-=.025;p.dx*=.95;p.dy*=.95});
  particles=particles.filter(p=>p.life>0);
  floats.forEach(f=>{f.life--;f.y-=1.2});
  floats=floats.filter(f=>f.life>0);

  // Difficulty ramp
  marchSpeed=1.5+distance*.0003;
}

function draw(){
  // Background - pastel gradient that shifts
  const t=Math.min(1,distance/5000);
  const bg1=lerpC([255,183,197],[200,160,255],t);
  const bg2=lerpC([255,240,245],[150,100,200],t);
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${bg1})`);g.addColorStop(1,`rgb(${bg2})`);
  X.fillStyle=g;X.fillRect(0,0,W,H);

  // Cute background pattern - hearts and stars
  X.globalAlpha=.06;X.font='20px serif';X.textAlign='center';
  for(let i=0;i<15;i++){
    const bx=(i*137+scrollY*.1)%W;
    const by=(i*193+scrollY*.3)%(H+100)-50;
    X.fillText(i%3===0?'💖':i%3===1?'⭐':'🌸',bx,by);
  }
  X.globalAlpha=1;

  const rl=roadL(),rr=roadR();

  // Road
  X.fillStyle='#E8D5E0';
  X.beginPath();X.roundRect(rl-5,-10,ROAD_W+10,H+20,8);X.fill();
  // Road surface
  X.fillStyle='#F5EBF0';
  X.fillRect(rl,0,ROAD_W,H);
  // Center line
  X.strokeStyle='rgba(255,105,180,.2)';X.lineWidth=2;X.setLineDash([20,15]);
  const lineOff=(scrollY*3)%35;
  X.beginPath();X.moveTo(W/2,-lineOff);X.lineTo(W/2,H);X.stroke();
  X.setLineDash([]);X.lineWidth=1;

  // Side decorations - flowers/skulls alternating
  const decoOff=(scrollY*2)%120;
  for(let y=-decoOff;y<H+60;y+=120){
    X.font='16px serif';X.textAlign='center';
    X.fillText('🌸',rl-20,y);X.fillText('💀',rr+20,y+60);
    X.fillText('🎀',rr+20,y);X.fillText('🌺',rl-20,y+60);
  }

  // Gates
  gates.forEach(g=>{
    const gy=g.y+scrollY;
    if(gy<-80||gy>H+80)return;
    const a=g.hit?.3:1;X.globalAlpha=a;
    // Gate body
    X.fillStyle=g.color;
    X.beginPath();X.roundRect(g.x-g.w/2,gy-g.h/2,g.w,g.h,12);X.fill();
    // Highlight
    X.fillStyle='rgba(255,255,255,.35)';
    X.beginPath();X.roundRect(g.x-g.w/2+4,gy-g.h/2+4,g.w-8,g.h/2-4,8);X.fill();
    // Label
    X.fillStyle='#fff';X.font='bold 14px Nunito';X.textAlign='center';X.textBaseline='middle';
    X.fillText(g.label,g.x,gy);
    X.globalAlpha=1;
  });

  // Barriers
  barriers.forEach(br=>{
    if(br.dead)return;
    const bry=br.y+scrollY;
    if(bry<-40||bry>H+40)return;
    const hpPct=br.hp/br.maxHp;
    X.fillStyle=hpPct>.5?'#A1887F':'#D7837F';
    X.beginPath();X.roundRect(br.x-br.w/2,bry-br.h/2,br.w,br.h,4);X.fill();
    // Cracks
    if(hpPct<.7){
      X.strokeStyle='rgba(0,0,0,.2)';X.lineWidth=1;
      X.beginPath();X.moveTo(br.x-5,bry-br.h/2);X.lineTo(br.x+3,bry+br.h/2);X.stroke();
    }
    // HP bar
    X.fillStyle='rgba(0,0,0,.2)';X.fillRect(br.x-br.w/2,bry-br.h/2-6,br.w,4);
    X.fillStyle='#E57373';X.fillRect(br.x-br.w/2,bry-br.h/2-6,br.w*hpPct,4);
  });

  // Zombies
  zombies.forEach(z=>{
    if(z.dead)return;
    const zy=z.y+scrollY;
    if(zy<-40||zy>H+40)return;
    // Shadow
    X.fillStyle='rgba(0,0,0,.1)';
    X.beginPath();X.ellipse(z.x,zy+z.size,z.size*.6,4,0,0,Math.PI*2);X.fill();
    // Zombie
    X.font=z.size+'px serif';X.textAlign='center';X.textBaseline='middle';
    X.fillText(z.emoji,z.x,zy);
    // HP bar
    if(z.hp<z.maxHp){
      const bw=z.size*1.5;
      X.fillStyle='rgba(0,0,0,.15)';X.fillRect(z.x-bw/2,zy-z.size-4,bw,3);
      X.fillStyle='#FF69B4';X.fillRect(z.x-bw/2,zy-z.size-4,bw*(z.hp/z.maxHp),3);
    }
  });

  // Bullets
  bullets.forEach(b=>{
    X.fillStyle=b.color;X.shadowColor=b.color;X.shadowBlur=4;
    if(b.shape==='★'){
      X.font='10px serif';X.textAlign='center';X.fillText('★',b.x,b.y);
    }else if(b.shape==='─'){
      X.fillRect(b.x-1,b.y-4,2,8);
    }else{
      X.beginPath();X.arc(b.x,b.y,b.size/2,0,Math.PI*2);X.fill();
    }
    X.shadowBlur=0;
  });

  // Player army
  const baseY=H*.75;
  army.forEach((s,i)=>{
    const sx=playerX+s.offX;
    const sy=baseY+s.offY;
    const bob=Math.sin(scrollY*.1+i)*.8;
    // Shadow
    X.fillStyle='rgba(0,0,0,.08)';
    X.beginPath();X.ellipse(sx,sy+12,8,3,0,0,Math.PI*2);X.fill();
    // Body - kawaii soldier
    const hue=s.hue;
    X.fillStyle=`hsl(${hue},70%,75%)`;
    X.beginPath();X.arc(sx,sy+bob,10,0,Math.PI*2);X.fill();
    // Face
    X.fillStyle='#FFE4C4';
    X.beginPath();X.arc(sx,sy-3+bob,7,0,Math.PI*2);X.fill();
    // Eyes
    X.fillStyle='#333';
    X.beginPath();X.arc(sx-2.5,sy-4+bob,1.5,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(sx+2.5,sy-4+bob,1.5,0,Math.PI*2);X.fill();
    // Blush
    X.fillStyle='rgba(255,105,180,.3)';
    X.beginPath();X.arc(sx-5,sy-1+bob,2.5,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(sx+5,sy-1+bob,2.5,0,Math.PI*2);X.fill();
    // Mouth
    X.strokeStyle='#333';X.lineWidth=1;
    X.beginPath();X.arc(sx,sy-1+bob,2,.1*Math.PI,.9*Math.PI);X.stroke();
    // Helmet
    X.fillStyle=`hsl(${hue},60%,55%)`;
    X.beginPath();X.arc(sx,sy-6+bob,7,Math.PI,.01);X.fill();
  });

  // Shield indicator around army
  if(shieldHP>0){
    const sa=.2+Math.sin(Date.now()*.004)*.1;
    X.strokeStyle=`rgba(79,195,247,${sa})`;X.lineWidth=3;
    X.beginPath();X.ellipse(playerX,baseY+10,50,40,0,0,Math.PI*2);X.stroke();
    X.lineWidth=1;
  }

  // Particles
  particles.forEach(p=>{
    X.globalAlpha=p.life;X.fillStyle=p.color;
    X.beginPath();X.arc(p.x,p.y,p.size,0,Math.PI*2);X.fill();
  });X.globalAlpha=1;

  // Float texts
  X.textAlign='center';
  floats.forEach(f=>{
    X.globalAlpha=Math.min(1,f.life/15);
    X.font=`bold ${f.size}px Nunito`;X.fillStyle=f.color;
    // Outline
    X.strokeStyle='rgba(0,0,0,.2)';X.lineWidth=3;X.strokeText(f.text,f.x,f.y);
    X.fillText(f.text,f.x,f.y);X.lineWidth=1;
  });X.globalAlpha=1;

  // HUD
  X.textAlign='left';
  // Score
  X.font='bold 22px Nunito';X.fillStyle='rgba(0,0,0,.15)';X.fillText(score,14,34);
  X.fillStyle='#fff';X.fillText(score,12,32);
  X.font='bold 11px Nunito';X.fillStyle='rgba(255,255,255,.6)';X.fillText('SCORE',12,14);

  // Soldiers
  X.textAlign='right';
  X.font='bold 22px Nunito';X.fillStyle='rgba(0,0,0,.15)';X.fillText('🧑 '+soldiers,W-10,34);
  X.fillStyle='#fff';X.fillText('🧑 '+soldiers,W-12,32);

  // Weapon
  X.textAlign='center';
  X.font='bold 14px Nunito';X.fillStyle='rgba(255,255,255,.8)';
  X.fillText(WEAPONS[weapon].emoji+' '+WEAPONS[weapon].name,W/2,22);

  // Combo
  if(combo>2){
    X.font=`bold ${Math.min(24,14+combo*.2)}px Nunito`;
    X.fillStyle=combo>20?'#FF1493':combo>10?'#FFD700':'#fff';
    X.fillText(combo+'x combo!',W/2,46);
  }

  // Shield
  if(shieldHP>0){
    X.textAlign='left';X.font='bold 13px Nunito';X.fillStyle='#4FC3F7';
    X.fillText('🛡️ '+shieldHP,12,52);
  }

  // Distance
  X.textAlign='center';X.font='10px Nunito';X.fillStyle='rgba(255,255,255,.4)';
  X.fillText(Math.floor(distance)+'m',W/2,H-8);
}

function lerpC(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}

function showMenu(){
  state='menu';
  ui.innerHTML=`<div class="panel">
    <h1>🎀💀 Kawaii Killzone 💀🎀</h1>
    <p>March your adorable army forward!<br>
    Choose gates to grow (or shrink) your squad.<br>
    Shoot zombies, break barriers, collect weapons!<br><br>
    🔫 Pistol · 💥 Shotgun · ⚡ Laser · 🚀 Rocket · 🔥 Minigun<br>
    Your soldier count = your health. Don't hit zero!</p>
    <p>📱 Drag/tap to move &nbsp; ⌨️ Mouse to aim</p>
    <button class="btn" id="go">March! 💖</button>
  </div>`;
  document.getElementById('go').onclick=()=>{ui.innerHTML='';state='playing';reset()};
}

function showGameOver(){
  state='gameover';
  ui.innerHTML=`<div class="panel">
    <h1>💀 Squad Down!</h1>
    <h2>Score: ${score}</h2>
    <p>Distance: ${Math.floor(distance)}m · Best Combo: ${maxCombo}x · Weapon: ${WEAPONS[weapon].emoji}</p>
    <input type="text" id="ni" placeholder="Your name" maxlength="16">
    <br><button class="btn" id="sub" style="margin-top:10px">Submit 💖</button>
    <div id="lba"></div>
    <button class="btn" id="rep" style="margin-top:10px">Again! 🎀</button>
  </div>`;
  document.getElementById('sub').onclick=async()=>{
    const n=document.getElementById('ni').value.trim()||'Anonymous';
    document.getElementById('sub').textContent='...';
    await submitScore(n,score);
    const sc=await getLeaderboard();
    document.getElementById('lba').innerHTML='<div class="lb"><h2>🏆 Top 10</h2>'+
      sc.map((s,i)=>`<div><span class="lr">#${i+1} ${s.playerName}</span><span class="ls">${s.score}</span></div>`).join('')+'</div>';
    document.getElementById('sub').style.display='none';
  };
  document.getElementById('rep').onclick=()=>{ui.innerHTML='';state='playing';reset()};
}

function loop(){update();draw();requestAnimationFrame(loop)}
showMenu();loop();
</script>
