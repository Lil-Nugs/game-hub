<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'DM Sans',sans-serif;min-height:100vh}
header{text-align:center;padding:2.5rem 1rem 1rem;border-bottom:1px solid rgba(108,92,231,.25)}
h1{font-family:'Space Mono',monospace;font-size:2.3rem;color:#fff} h1 span{color:#6c5ce7}
header p{margin-top:.5rem;color:#9aa;font-size:.95rem}
#controls{max-width:1120px;margin:1rem auto;padding:0 1rem;display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid #2f3150;background:#12121a;color:#9aa;padding:.45rem .8rem;border-radius:999px;cursor:pointer;font-size:.85rem}
.chip.active{border-color:#6c5ce7;color:#fff;background:#1a1730}
#gallery{max-width:1120px;margin:1rem auto 2rem;padding:0 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}
.card{background:#12121a;border:1px solid #1f2134;border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.card:hover{border-color:#6c5ce7;box-shadow:0 0 24px rgba(108,92,231,.18)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.model{font-size:.72rem;border:1px solid #38406d;padding:.22rem .5rem;border-radius:999px;color:#bcd}
.model.codex{border-color:#5eead4;color:#5eead4}.model.claude{border-color:#a78bfa;color:#c4b5fd}.model.unknown{border-color:#666;color:#999}
h2{font-family:'Space Mono',monospace;font-size:1.05rem;color:#fff}
.desc{font-size:.88rem;line-height:1.45;color:#b1b1bf;min-height:2.4rem}
.meta{font-size:.78rem;color:#7f8094}
.play{display:inline-block;text-align:center;padding:.55rem 1rem;background:#6c5ce7;color:#fff;text-decoration:none;border-radius:8px;font-family:'Space Mono',monospace;font-size:.85rem}
.rating{border-top:1px solid #1f2134;padding-top:.55rem}
.rline{font-size:.75rem;color:#9aa;display:flex;justify-content:space-between}
.rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .6rem;margin-top:.35rem}
.rate-item{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;color:#9aa}
.stars button{background:none;border:none;color:#444;cursor:pointer;font-size:.85rem;padding:0 .03rem}
.stars button.on{color:#ffd166}
.small{font-size:.7rem;color:#777}
#empty{text-align:center;color:#666;padding:4rem 1rem}
</style>
</head>
<body>
<header>
  <h1><span>&gt;</span> Game Hub</h1>
  <p>Filter by model + lightweight ratings (visuals / balance / fun / stability)</p>
</header>
<nav style="text-align:center;padding:.7rem"><a href="leaderboard.html" style="color:#6c5ce7;text-decoration:none;font-family:'Space Mono',monospace;font-size:.9rem;padding:.45rem 1rem;border:1px solid rgba(108,92,231,.35);border-radius:8px">🏆 Leaderboards</a></nav>
<div id="controls"></div>
<div id="gallery"></div>
<script>
const CATS=['visuals','balance','entertainment','stability'];
const MODEL_OPTIONS=['all','codex','claude','unknown'];
let currentModel='all';
let games=[];
let seedRatings={};
const localRatings=JSON.parse(localStorage.getItem('gameHubRatings')||'{}');

(async()=>{
  const [gRes,rRes]=await Promise.allSettled([fetch('games.json'),fetch('ratings-seed.json')]);
  if(gRes.status==='fulfilled'){const data=await gRes.value.json();games=(data.games||[]).map(withModel)}
  if(rRes.status==='fulfilled'){try{seedRatings=await rRes.value.json()}catch{seedRatings={}}}
  renderControls(); renderGallery();
})();

function withModel(g){
  // Use explicit model if present; otherwise infer conservatively
  let model=(g.model||'').toLowerCase();
  if(!model){
    const s=(g.slug||'').toLowerCase();
    if(s.includes('claude')) model='claude';
    else if(s.includes('codex')||s.includes('v3')||s.includes('turbo')) model='codex';
    else model='unknown';
  }
  return {...g,model};
}

function renderControls(){
  const c=document.getElementById('controls');
  c.innerHTML='';
  MODEL_OPTIONS.forEach(m=>{
    const b=document.createElement('button');
    b.className='chip'+(m===currentModel?' active':'');
    b.textContent=m.toUpperCase();
    b.onclick=()=>{currentModel=m;renderControls();renderGallery()};
    c.appendChild(b);
  });
}

function mergedRatings(slug){
  const seed=seedRatings[slug]||{};
  const local=localRatings[slug]||{};
  const out={};
  CATS.forEach(cat=>{
    const s=seed[cat]||{sum:0,count:0};
    const v=local[cat];
    out[cat]={sum:s.sum+(v||0),count:s.count+(v?1:0),mine:v||0};
  });
  return out;
}

function avg(obj){return obj.count? (obj.sum/obj.count).toFixed(1):'—'}

function renderGallery(){
  const g=document.getElementById('gallery');
  const list=[...games].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(x=>currentModel==='all'||x.model===currentModel);
  if(!list.length){g.innerHTML='<div id="empty">No games in this filter.</div>';return}
  g.innerHTML='';
  list.forEach(game=>{
    const r=mergedRatings(game.slug);
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`
      <div class="row"><h2>${esc(game.title)}</h2><span class="model ${game.model}">${game.model}</span></div>
      <p class="desc">${esc(game.description||'')}</p>
      <div class="meta row"><span>by ${esc(game.creator||'unknown')}</span><span>${fmt(game.date)}</span></div>
      <a class="play" href="games/${encodeURIComponent(game.slug)}/index.html">PLAY</a>
      <div class="rating">
        <div class="rline"><span>Ratings</span><span class="small">local votes now · seed file for shared baseline</span></div>
        <div class="rate-grid">
          ${CATS.map(cat=>`<div class='rate-item'><span>${cat}</span><span>${avg(r[cat])}</span></div><div class='stars' data-slug='${game.slug}' data-cat='${cat}'>${renderStars(r[cat].mine)}</div>`).join('')}
        </div>
      </div>`;
    g.appendChild(card);
  });
  document.querySelectorAll('.stars').forEach(el=>bindStars(el));
}

function renderStars(mine){
  let s='';
  for(let i=1;i<=5;i++) s+=`<button data-v='${i}' class='${mine>=i?'on':''}'>★</button>`;
  return s;
}

function bindStars(el){
  const slug=el.dataset.slug,cat=el.dataset.cat;
  el.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const v=Number(b.dataset.v);
      localRatings[slug]=localRatings[slug]||{};
      localRatings[slug][cat]=v;
      localStorage.setItem('gameHubRatings',JSON.stringify(localRatings));
      renderGallery();
    };
  });
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmt(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
</script>
</body></html>
